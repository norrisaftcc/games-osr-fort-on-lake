<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>The Spring Turn</title>
<style>
/* The Stage: the shell's styles. Contract: stage/SPEC.md section 4, stage/MOTION.md.

   The shell has structure and no look. The look comes from the pack's theme.json.
   The build writes each theme token as a custom property on :root (`--bg`, `--ink`, ...)
   and switches the two themes with prefers-color-scheme and <html data-theme="light|dark">.

   TOKENS THE SHELL READS (set them in both `light` and `dark` of theme.json)
   Format: tools/validate.mjs reads the indented rows below. A row is a token name, two or more spaces, then its use.
   `a | b` means a theme may define either name; `a, b` lists two separate tokens; "optional" means no theme has to define it.
   Colour. The first name is the fixture vocabulary; the second is the Blueline vocabulary.
     bg | paper          page and stage ground
     panel | tint-1      sheets, HUD, top bar, deck
     card | tint-2       controls, option cards, spent pips
     line | rule-hair    hairlines
     ink                 text and strokes
     ink-soft | rule-firm  control borders, secondary text
     muted               small print (needs 4.5:1 on bg, panel and card)
     accent              primary buttons, focus ring, the Fate star (needs 4.5:1 against bg as text)
     lamp | plate-gold   the Fate ticket, the warm wash
     good, bad           gain and loss labels, roll results
     on-accent           text on an accent button (optional; the default is bg)
     plate-gold          optional: the paper kit's gold fill (default: lamp)
     plate-umber         optional: the paper kit's umber fill (default: ink-soft)
     blueline            optional: the paper kit's Blueline ink (default: accent)
   Type (optional; each is a font-family list). The pack's theme.fonts embeds the files.
     font-body           optional: story text         (default: Georgia, serif)
     font-display        optional: titles, big numbers (default: font-body)
     font-ui             optional: buttons, labels    (default: system-ui)
     font-mono           optional: screens, logs      (default: ui-monospace)
   Motion (optional; set in theme.json only to retune; defaults are in the :root block below)
     m-flash-color       optional: the one flash on a cost (default: ink)
   Everything else below is the shell's own: every colour is a var(--st-*) alias of a token above,
   and every duration is a --m-* token from MOTION.md. No colour or time is hard-coded in a rule.

   Attributes the shell sets, for kits and tests:
     <html data-theme="light|dark">   absent means follow the system
     <html data-map="ink|blueline">   the map style the reader chose
     <html data-motion="full|calm">   calm behaves exactly as prefers-reduced-motion: reduce
     <html data-commentary="on|off">
     <html data-hidden>               present while the page is hidden
     <html data-cue>                  present while a cue plays
     #app[data-phase="title|card|play"], #app[data-node="beat|choice|input|roll|ending"], #app[data-busy="0|1"]
     #app[data-ending="<id>"] and .panel.ending[data-ending="<id>"]   the id of the ending on show; absent at any other node
     .ava.ava-none                    the speaker's avatar when the cast entry has no crop: a still disc with a camera-off mark
     .panel[data-overflow="1"], .track[data-overflow="1"]   the box scrolls and is not at its end: a fade shows on its bottom edge
   Custom properties the shell reads from a kit or pack (optional): --st-tab-x (where a pull-tab stands across the book box, default .87)
   and --st-tab-out (how far its card has slid out, default 0px): the paper kit sets both on #stage, and while a .k-tab shows, the text slide keeps clear of it, --st-stage-min (the least height of the stage, default 9.5rem).
*/

:root {
  /* motion tokens: MOTION.md section 2, copied as written */
  --m-state: 250ms; --m-sheet: 300ms; --m-in: 450ms; --m-out: 380ms;
  --m-cross: 650ms; --m-turn: 650ms; --m-ink: 800ms; --m-bloom: 700ms;
  --m-seal: 300ms; --m-roll: 900ms; --m-tear: 500ms; --m-close: 1200ms;
  --m-flash: 700ms; --m-flash-gap: 340ms; --m-hold: 2000ms; --m-stagger: 80ms;
  --m-type: 28ms; --m-auto-base: 2600ms; --m-auto-char: 42ms;
  --m-idle: 26000ms; --m-scan: 8000ms;
  --m-ease-out: cubic-bezier(.2, .8, .2, 1); --m-ease-in: ease-in;
  --m-ease-inout: ease-in-out; --m-ease-linear: linear;
  --m-ease-thump: cubic-bezier(.3, 1.4, .4, 1);
  --m-d1: 4px; --m-d2: 8px; --m-d3: 16px; --m-d4: 32px; --m-d5: 48px;
  --m-persp: 1200px; --m-fold: 80deg; --m-flap: 150deg; --m-tilt: 3deg;
  --m-tunnel: 24px; --m-roll-turn: 540deg; --m-idle-scale: 1.02;
  --m-layers-max: 3; --m-roll-ticks: 3;
  --m-flash-alpha: .28; --m-flash-color: var(--st-ink); --m-wash-alpha: .30;

  /* the shell's aliases of the theme tokens */
  --st-bg: var(--bg, var(--paper, #f4efe3));
  --st-panel: var(--panel, var(--tint-1, #e9e2d0));
  --st-card: var(--card, var(--tint-2, #ddd5be));
  --st-line: var(--line, var(--rule-hair, #b9ae94));
  --st-ink: var(--ink, #1b1b1b);
  --st-ink-soft: var(--ink-soft, var(--rule-firm, #444444));
  --st-edge: var(--ink-soft, var(--rule-firm, #444444));
  --st-muted: var(--muted, #5a5446);
  --st-accent: var(--accent, #7a2e1c);
  --st-lamp: var(--lamp, var(--plate-gold, #7a4806));
  --st-good: var(--good, #285e33);
  --st-bad: var(--bad, #9a2a1c);
  --st-tint1: var(--tint-1, var(--panel, #e6dfce));
  --st-tint2: var(--tint-2, var(--card, #cfc7b4));
  --st-on-accent: var(--on-accent, var(--st-bg));
  --st-scrim: var(--st-panel);
  --st-veil: var(--st-ink);

  --st-font-body: var(--font-body, Georgia, "Times New Roman", serif);
  --st-font-display: var(--font-display, var(--st-font-body));
  --st-font-ui: var(--font-ui, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  --st-font-mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);

  --st-gutter: max(16px, env(safe-area-inset-left, 0px));
  --st-gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --st-target: 44px;
  --st-radius: 8px;
  --st-stage-min: 9.5rem; /* the stage never gets shorter than this; a shorter screen scrolls the page (WCAG 1.4.10) */
  --st-tab-x: .87;       /* where a pull-tab sits across the book box, 0 to 1 (the right edge of its card); the text panel keeps clear of it */
}
@supports (background: color-mix(in srgb, red 50%, blue)) {
  :root {
    --st-scrim: color-mix(in srgb, var(--st-panel) 94%, transparent);
    --st-veil: color-mix(in srgb, var(--st-ink) 58%, transparent);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  min-height: 100%; margin: 0; overflow-x: hidden;
  background: var(--st-bg); color: var(--st-ink);
  font: 16px/1.5 var(--st-font-ui);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--st-accent); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* ---------- frame: top bar, HUD, stage, deck ---------- */
.app {
  position: relative; min-height: 100vh; min-height: 100dvh;
  display: grid; grid-template-rows: auto auto minmax(var(--st-stage-min), 1fr) auto;
  background: var(--st-bg);
}
.app > * { min-width: 0; }

.bar {
  display: flex; align-items: center; gap: 8px;
  padding: max(6px, env(safe-area-inset-top, 0px)) var(--st-gutter-r) 6px var(--st-gutter);
  background: var(--st-panel); border-bottom: 1px solid var(--st-line);
}
.brand { flex: 1 1 auto; min-width: 0; }
.brand-name {
  font: 700 1.05rem/1.2 var(--st-font-display);
  overflow-wrap: anywhere;
}
.brand-sub { font-size: .75rem; line-height: 1.3; color: var(--st-muted); overflow-wrap: anywhere; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--st-target); min-width: var(--st-target); padding: 0 14px;
  background: var(--st-card); color: var(--st-ink);
  border: 1px solid var(--st-edge); border-radius: var(--st-radius);
  font: 600 .875rem/1.2 var(--st-font-ui); letter-spacing: .02em;
  cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
}
.btn:hover:not(:disabled):not(.primary):not([aria-pressed="true"]) { background: var(--st-tint1); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn.primary, .btn[aria-pressed="true"] { background: var(--st-accent); color: var(--st-on-accent); border-color: var(--st-accent); }
.btn.primary:hover:not(:disabled), .btn[aria-pressed="true"]:hover:not(:disabled) { filter: brightness(1.08); }
.btn.icon { padding: 0; }
.kbd-hint { font-size: .7rem; font-weight: 700; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
@media (max-width: 480px) { .kbd-hint { display: none; } }

.hud {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; container-type: inline-size;
  padding: 8px var(--st-gutter-r) 8px var(--st-gutter);
  background: var(--st-panel); border-bottom: 1px solid var(--st-line);
}
.hud-tools { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; margin-left: auto; }
.tallies { flex: 0 1 5.5rem; min-width: 0; font-size: .8125rem; line-height: 1.35; color: var(--st-ink-soft); }
.tallies:empty { display: none; }
.tallies b { font-weight: 700; color: var(--st-ink); }
.tallies i { font-style: normal; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tallies i.bump { color: var(--st-ink); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.tallies span + span::before { content: "\00b7"; margin: 0 6px; }
.count { font-variant-numeric: tabular-nums; }
.hud-tools .count:not(:empty) { font-size: .8125rem; }

/* The meters. One or two sit side by side. Three share a row. Four make a 2 x 2 block until the HUD is 520px wide; five, three over two until 640px.
   A meter's name is never cut: when name and number do not fit on one line, the number drops under the name. */
.meters {
  --st-mw: 6rem; /* the least width the meters get before the tallies and buttons drop to a second row */
  flex: 1 1 var(--st-mw); min-width: var(--st-mw); display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
}
.meters:has(.meter:nth-child(2)) { --st-mw: 13rem; }
.meters:has(.meter:nth-child(3)) { --st-mw: 25rem; }
.meters:not(:has(.meter:nth-child(3))) { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.meters:has(.meter:nth-child(3)):not(:has(.meter:nth-child(4))) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.meters:has(.meter:nth-child(4)):not(:has(.meter:nth-child(5))) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
/* Five make three over two (a six-column grid: the first row's meters take two columns, the second row's three), one row from 640px. */
.meters:has(.meter:nth-child(5)):not(:has(.meter:nth-child(6))) { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.meters:has(.meter:nth-child(5)):not(:has(.meter:nth-child(6))) .meter { grid-column: span 2; }
.meters:has(.meter:nth-child(5)):not(:has(.meter:nth-child(6))) .meter:nth-child(n+4) { grid-column: span 3; }
@container (min-width: 520px) {
  .meters:has(.meter:nth-child(4)):not(:has(.meter:nth-child(5))) { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@container (min-width: 640px) {
  .meters:has(.meter:nth-child(5)):not(:has(.meter:nth-child(6))) { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .meters:has(.meter:nth-child(5)):not(:has(.meter:nth-child(6))) .meter { grid-column: auto; }
}
@container (max-width: 399px) {
  .meters:has(.meter:nth-child(3)):not(:has(.meter:nth-child(4))) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .meters:has(.meter:nth-child(3)):not(:has(.meter:nth-child(4))) .meter:last-child { grid-column: 1 / -1; }
}
.meter {
  position: relative; min-width: 0; padding: 4px 8px 6px;
  background: var(--st-card); border: 1px solid var(--st-line); border-radius: var(--st-radius);
}
.m-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; column-gap: 6px; }
.m-name { flex: 0 1 auto; min-width: 0; font-size: .75rem; line-height: 1.3; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--st-ink-soft); overflow-wrap: anywhere; }
.m-val { font: 700 1.25rem/1.1 var(--st-font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.m-val small { font-size: .75rem; font-weight: 600; color: var(--st-muted); }
.pips { display: flex; gap: 3px; margin-top: 3px; }
.pip { flex: 1 1 0; max-width: 16px; height: 8px; border: 1px solid var(--st-ink); border-radius: 2px; background: transparent; }
.pip.on { background: var(--st-ink); }
.pip.spent {
  border-style: dashed; border-color: var(--st-ink-soft);
  background: repeating-linear-gradient(135deg, var(--st-tint2) 0 3px, transparent 3px 6px);
}
.bar-track { height: 8px; margin-top: 3px; border: 1px solid var(--st-ink); border-radius: 2px; overflow: hidden; }
.bar-track i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--st-ink); }
.m-delta { /* the signed change a cost or gain made: it sits on the meter's top edge for --m-hold, clear of the name and the row above */
  position: absolute; right: 6px; top: -14px; z-index: 5; pointer-events: none; max-width: calc(100% - 8px);
  padding: 0 6px; border-radius: 4px; font-size: .75rem; font-weight: 800; line-height: 1.3; white-space: nowrap;
  background: var(--st-panel); border: 1px solid currentColor;
}
.m-delta.neg { color: var(--st-bad); }
.m-delta.pos { color: var(--st-good); }
.m-flash {
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
  background: var(--m-flash-color);
}
@media (max-width: 380px) { .m-val small { display: none; } }
@media (max-width: 520px) { .hud-tools .lbl { display: none; } .hud-tools .btn { padding: 0 10px; } }
@media (min-width: 521px) and (min-height: 481px) { .count:not(:empty)::before { content: "("; } .count:not(:empty)::after { content: ")"; } }

/* Three or more meters: the buttons show their icons only, up to 899px, to leave the meters their room. */
@media (max-width: 899px) { .hud:has(.meter:nth-child(3)) .hud-tools .lbl { display: none; } .hud:has(.meter:nth-child(3)) .hud-tools .btn { padding: 0 10px; } }
/* Three or more meters on a narrow screen (under 560px): the meters take the width, the two tool buttons stand in a column beside
   them, and the tallies, if any, go under the meters. A wider screen keeps everything on one row. */
@media (max-width: 559px) {
  .hud:has(.meter:nth-child(3)) { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
  .hud:has(.meter:nth-child(3)) .meters { grid-column: 1; grid-row: 1; min-width: 0; }
  .hud:has(.meter:nth-child(3)) .hud-tools { grid-column: 2; grid-row: 1; flex-direction: column; align-items: stretch; }
  .hud:has(.meter:nth-child(3)) .tallies { grid-column: 1 / -1; grid-row: 2; flex: none; max-width: none; }
}

/* ---------- stage ---------- */
.stage { position: relative; min-height: 0; overflow: hidden; container-type: size; background: var(--st-bg); touch-action: manipulation; }
.kit { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.place {
  position: absolute; left: 0; right: 0; top: 0; z-index: 3; pointer-events: none;
  padding: 4px var(--st-gutter-r) 4px var(--st-gutter);
  font: 700 .75rem/1.4 var(--st-font-ui); letter-spacing: .08em; text-transform: uppercase;
  color: var(--st-ink); background: var(--st-scrim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.place:empty { display: none; }
.slides { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.sl {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;
  padding: 32px var(--st-gutter-r) 10px var(--st-gutter);
  align-items: center;
}
.sl > * { pointer-events: auto; width: 100%; max-width: 42rem; }
.sl.out { pointer-events: none; }
.sl.out > * { pointer-events: none; }
.sl.mid { justify-content: center; }
/* While the kit shows a pull-tab (.k-tab), the text keeps clear of it, tab and touch margin both. The tab stands at --st-tab-x across the
   book box (the square, as wide as the stage is high, or as wide as the stage if that is less), plus --st-tab-out when its card slides out.
   Its touch area starts 24px left of that edge (the reserve adds 4px). The paper kit sets both properties on #stage for the tab on show. */
#stage:has(.k-tab:not([hidden])) .sl {
  padding-right: max(var(--st-gutter-r), calc(50cqw - (var(--st-tab-x) - .5) * min(100cqw, 100cqh) - var(--st-tab-out, 0px) + 28px));
}

.panel {
  flex: 0 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  --st-pad-x: 14px; --st-fade: var(--st-panel);
  padding: 12px var(--st-pad-x); background: var(--st-scrim); color: var(--st-ink);
  border: 1px solid var(--st-edge); border-left-width: 4px; border-radius: var(--st-radius);
  font: 1.0625rem/1.6 var(--st-font-body); overflow-wrap: anywhere;
}
.panel[data-look="ink"] { border-left-style: dotted; }
.panel[data-look="paint"] { border-left-style: solid; border-left-color: var(--st-lamp); }
.panel.is-secret { --st-fade: var(--st-tint1); background: var(--st-tint1); border-left-style: dashed; }
.panel:focus-visible { outline-offset: -3px; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; font-family: var(--st-font-ui); }
.tag {
  display: inline-flex; align-items: center; padding: 1px 8px; border: 1px solid var(--st-edge); border-radius: 999px;
  font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--st-ink-soft);
}
.tag[data-k="ink"] { border-style: dotted; }
.tag[data-k="paint"] { border-color: var(--st-lamp); color: var(--st-lamp); }
.tag[data-k="secret"] { border-style: dashed; color: var(--st-ink); }
.kicker { font: 700 .75rem/1.4 var(--st-font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--st-ink-soft); margin-bottom: 4px; }
.who { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-family: var(--st-font-ui); }
.ava {
  flex: none; display: block; width: 44px; height: 44px; border-radius: 50%;
  background: var(--st-card) var(--cast-sheet, none) no-repeat; border: 2px solid var(--st-edge);
}
.ava.ava-none {
  position: relative; overflow: hidden; background-color: var(--st-card);
  background-image: repeating-conic-gradient(var(--st-card) 0% 25%, var(--st-tint1) 0% 50%); background-size: 6px 6px;
}
.ava.ava-none::before { /* the camera body */
  content: ""; position: absolute; left: 25%; top: 34%; width: 50%; height: 32%;
  border: 2px solid var(--st-ink-soft); border-radius: 3px; background: var(--st-card);
}
.ava.ava-none::after { /* the slash across it */
  content: ""; position: absolute; left: 12%; top: calc(50% - 1px); width: 76%; height: 2px;
  background: var(--st-ink); transform: rotate(-45deg);
}
.who-t { display: flex; flex-direction: column; line-height: 1.2; }
.who-t b { font-size: .9375rem; }
.who-t small { font-size: .75rem; color: var(--st-muted); }
.txt { margin: 0; white-space: pre-wrap; }
.txt em, .sr-copy em { font-style: italic; font-weight: 400; } /* only Alegreya 400 italic is embedded */
.t-rest { opacity: 0; }
.caret { display: inline-block; width: 0; position: relative; }
.caret::after { content: ""; position: absolute; left: 0; bottom: .15em; width: .55em; height: 1em; background: var(--st-ink); }
.panel.done .caret { display: none; }

.late { opacity: 0; }
.panel.done .late, .sl.done .late { opacity: 1; }
.screen {
  margin-top: 10px; padding: 8px 10px; font: .875rem/1.5 var(--st-font-mono);
  background: var(--st-ink); color: var(--st-bg); border-radius: 4px; white-space: pre-wrap;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-family: var(--st-font-ui); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: var(--st-target); padding: 0 14px;
  background: transparent; border: 1px dashed var(--st-edge); border-radius: 999px;
  font: 600 .8125rem/1.2 var(--st-font-ui); color: var(--st-ink); cursor: pointer;
}
.chip:hover { border-style: solid; background: var(--st-tint1); }
.track {
  --st-pad-x: 12px; --st-fade: var(--st-tint1);
  flex: 0 1 auto; max-height: 34%; overflow-y: auto; overscroll-behavior: contain; padding: 8px var(--st-pad-x);
  background: var(--st-tint1); border: 1px dashed var(--st-edge); border-radius: var(--st-radius);
  font: .875rem/1.5 var(--st-font-ui); color: var(--st-ink); overflow-wrap: anywhere;
}
.track .t-label { display: block; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--st-ink-soft); }
.track b { font-weight: 700; }
html[data-commentary="off"] .track { display: none; }
@media (max-height: 700px) { .track { max-height: 40%; } }

/* A panel or track that scrolls says so: the shell sets data-overflow="1" while there is more below. A short fade, shorter than
   any option, sits on the bottom edge. A row of buttons at the foot of a panel (Begin, Play again, Write it down) stays in view
   instead, with the fade above it. */
.panel[data-overflow="1"]::after, .track[data-overflow="1"]::after {
  content: ""; display: block; position: sticky; bottom: 0; height: 24px; margin: -24px calc(var(--st-pad-x) * -1) 0;
  background: linear-gradient(to bottom, transparent, var(--st-fade)); pointer-events: none;
}
.panel > .row:last-child, .in-form > .row {
  position: sticky; bottom: 0; z-index: 1; margin: 12px calc(var(--st-pad-x) * -1) -12px; padding: 0 var(--st-pad-x) 12px;
}
.panel[data-overflow="1"] > .row:last-child, .panel[data-overflow="1"] .in-form > .row { background: var(--st-fade); }
.panel[data-overflow="1"] > .row:last-child::before, .panel[data-overflow="1"] .in-form > .row::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 24px; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--st-fade));
}
.panel[data-overflow="1"]:has(> .row:last-child)::after, .panel[data-overflow="1"]:has(.in-form)::after { display: none; }
.in-form { display: contents; }

/* secret beat before it is revealed */
.secret-note { margin: 4px 0 10px; color: var(--st-ink-soft); font-family: var(--st-font-ui); font-size: .9375rem; }

/* title and cards */
.title-name { font: 700 clamp(1.8rem, 8vw, 2.8rem)/1.1 var(--st-font-display); text-wrap: balance; }
.title-sub { margin-top: 4px; font-size: 1.0625rem; color: var(--st-ink-soft); }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-family: var(--st-font-ui); }
.fine { margin-top: 10px; font: .8125rem/1.4 var(--st-font-ui); color: var(--st-muted); }
.scene-card { text-align: center; padding: 10px 4px; }
.card-place { font: 700 .75rem/1.4 var(--st-font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--st-ink-soft); }
.card-title { margin-top: 6px; font: 700 clamp(1.6rem, 7vw, 2.4rem)/1.15 var(--st-font-display); text-wrap: balance; }
.card-rule { width: 40%; height: 0; margin: 12px auto 0; border-top: 2px solid var(--st-lamp); }

/* gates: plan dashed, exec solid with a seal, fate a ticket. Each is paired with a word. */
.gate {
  display: inline-flex; align-items: center; gap: 8px; padding: 3px 10px; border-radius: 4px;
  font: 700 .8125rem/1.3 var(--st-font-ui); letter-spacing: .06em; text-transform: uppercase;
  color: var(--st-ink); background: transparent;
}
.gate[data-gate="plan"] { border: 2px dashed var(--st-edge); }
.gate[data-gate="exec"] { border: 2px solid var(--st-ink); }
.gate[data-gate="fate"] { border: 2px solid var(--st-lamp); color: var(--st-ink); }
.seal-glyph {
  flex: none; display: inline-block; width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid currentColor; box-shadow: inset 0 0 0 3px var(--st-scrim), inset 0 0 0 5px currentColor;
}
.star { color: var(--st-accent); font-size: 1.05em; line-height: 1; }
.ask { margin: 8px 0 6px; font: 700 1.125rem/1.35 var(--st-font-body); text-wrap: balance; }
.ask:focus { outline: none; }
.ask:focus-visible { outline: 2px dotted var(--st-accent); outline-offset: 3px; }
.opts { display: grid; gap: 8px; margin-top: 8px; font-family: var(--st-font-ui); }
.opt {
  position: relative; display: flex; align-items: flex-start; gap: 10px; width: 100%; min-height: var(--st-target);
  padding: 8px 12px; text-align: left; cursor: pointer;
  background: var(--st-card); color: var(--st-ink); border-radius: var(--st-radius);
  border: 2px solid var(--st-edge); -webkit-tap-highlight-color: transparent;
}
.opt:hover:not([aria-disabled="true"]) { background: var(--st-tint1); }
.opt[data-gate="plan"] { border-style: dashed; }
.opt[data-gate="exec"] { border-style: solid; border-color: var(--st-ink); }
.opt[data-gate="fate"] { border-style: solid; border-color: var(--st-lamp); padding-left: 20px; padding-right: 20px; }
.opt[data-gate="fate"]::before, .opt[data-gate="fate"]::after {
  content: ""; position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%;
  background: var(--st-panel); border: 2px solid var(--st-lamp);
}
.opt[data-gate="fate"]::before { left: -9px; }
.opt[data-gate="fate"]::after { right: -9px; }
.o-n {
  flex: none; display: grid; place-items: center; width: 24px; height: 24px; margin-top: 1px;
  border: 1px solid currentColor; border-radius: 50%; font-size: .8125rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
.o-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.o-label { font-weight: 700; }
.o-sub { font-size: .875rem; color: var(--st-ink-soft); }
.o-hint { font-size: .875rem; font-weight: 600; color: var(--st-bad); }
.o-hint::before { content: "Locked: "; font-weight: 700; }
.o-seal { flex: none; align-self: center; display: none; align-items: center; gap: 6px; font-size: .8125rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.opt[aria-disabled="true"] { border-style: dotted; background: transparent; cursor: not-allowed; }
.opt.spent[aria-disabled="true"] { background: var(--st-tint2); }
.opt.sealed { background: var(--st-tint1); border-style: solid; border-color: var(--st-ink); }
.opt.sealed .o-seal { display: inline-flex; }
.opt.spent { background: var(--st-tint2); opacity: .55; cursor: default; }
.sealed-note { margin-top: 8px; font: 700 .8125rem/1.4 var(--st-font-ui); letter-spacing: .04em; text-transform: uppercase; }

/* roll */
.roll-ask { font: 700 .75rem/1.4 var(--st-font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--st-ink-soft); }
.dice { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; font-family: var(--st-font-ui); }
.die {
  display: grid; place-items: center; width: 44px; height: 44px; border: 2px solid var(--st-ink); border-radius: 8px;
  background: var(--st-card); font: 700 1.25rem/1 var(--st-font-display); font-variant-numeric: tabular-nums;
}
.die.pending { border-style: dashed; color: var(--st-muted); }
.dice .op { font-weight: 700; color: var(--st-ink-soft); }
.roll-line { margin-top: 2px; font: 700 1rem/1.4 var(--st-font-ui); font-variant-numeric: tabular-nums; }
.roll-line .res { display: inline-block; margin-left: 4px; padding: 0 8px; border: 2px solid currentColor; border-radius: 4px; text-transform: uppercase; letter-spacing: .06em; }
.roll-line[data-r="success"], .roll-line[data-r="style"] { color: var(--st-good); }
.roll-line[data-r="fail"] { color: var(--st-bad); }
.roll-line[data-r="tie"], .roll-line[data-r="table"] { color: var(--st-ink); }
.roll-line.pending { color: var(--st-muted); }
.roll-line .res-s { color: inherit; }

/* input */
.field { display: block; width: 100%; min-height: var(--st-target); margin-top: 8px; padding: 8px 12px; font: 1rem/1.4 var(--st-font-ui); background: var(--st-bg); color: var(--st-ink); border: 2px solid var(--st-edge); border-radius: var(--st-radius); }
.field-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; font: .8125rem/1.4 var(--st-font-ui); color: var(--st-muted); }

/* ending */
.end-title { margin: 6px 0 4px; font: 700 clamp(1.6rem, 7vw, 2.3rem)/1.15 var(--st-font-display); text-wrap: balance; }
.end-title:focus { outline: none; }

/* flash and cue tag */
.edge { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; box-shadow: inset 0 0 0 8px var(--m-flash-color); }
.cuetag {
  position: absolute; left: 50%; top: 34px; z-index: 6; transform: translateX(-50%); pointer-events: none;
  padding: 3px 12px; border: 2px solid var(--st-lamp); border-radius: 999px; background: var(--st-panel);
  font: 700 .8125rem/1.4 var(--st-font-ui); letter-spacing: .04em; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}

/* ---------- deck ---------- */
.deck {
  position: relative; z-index: 10; background: var(--st-panel); border-top: 1px solid var(--st-line);
  padding: 8px var(--st-gutter-r) max(4px, env(safe-area-inset-bottom, 0px)) var(--st-gutter);
}
.autobar { position: absolute; left: 0; right: 0; top: -3px; height: 3px; overflow: hidden; pointer-events: none; }
.autobar i { display: block; width: 100%; height: 100%; background: var(--st-accent); transform-origin: 0 50%; transform: scaleX(0); }
.deck-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.hint { min-width: 0; text-align: center; font-size: .8125rem; line-height: 1.3; color: var(--st-ink-soft); overflow-wrap: anywhere; }
.foot { margin-top: 2px; text-align: center; font-size: .75rem; line-height: 1.4; color: var(--st-muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 400px) {
  .btn { padding: 0 10px; }
  #backBtn, #nextBtn { padding: 0 12px; }
  /* long choice panels: tighter, with no text hidden */
  .panel { --st-pad-x: 12px; padding-top: 10px; padding-bottom: 10px; }
  .opts { gap: 6px; margin-top: 6px; }
  .opt { gap: 8px; padding: 6px 10px; }
  .opt[data-gate="fate"] { padding-left: 18px; padding-right: 18px; }
  .o-body { gap: 0; }
  .o-label, .o-sub, .o-hint { line-height: 1.3; }
  .o-n { width: 22px; height: 22px; }
  .tags { margin-bottom: 4px; }
  .ask { margin: 6px 0 4px; }
}
/* On a 320px screen the hint takes a row of its own under the buttons, so that it can run to three lines. */
@media (max-width: 340px) {
  .deck-row { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "back . next" "hint hint hint"; row-gap: 4px; }
  #backBtn { grid-area: back; } #nextBtn { grid-area: next; } .hint { grid-area: hint; }
}

/* ---------- sheets ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  background: var(--st-veil); padding: max(16px, env(safe-area-inset-top, 0px)) var(--st-gutter-r) 0 var(--st-gutter);
}
@media (min-width: 760px) { .sheet { align-items: center; padding-bottom: 24px; } }
.sheet-panel {
  width: 100%; max-width: 46rem; max-height: 100%; display: flex; flex-direction: column;
  background: var(--st-panel); color: var(--st-ink); border: 1px solid var(--st-edge); border-bottom: 0; border-radius: 14px 14px 0 0;
}
@media (min-width: 760px) { .sheet-panel { border-bottom: 1px solid var(--st-edge); border-radius: 14px; max-height: 88vh; } }
.sheet-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--st-line); }
.sheet-hd h2 { font: 700 1.25rem/1.2 var(--st-font-display); }
.sheet-body { overflow-y: auto; padding: 14px 14px max(20px, env(safe-area-inset-bottom, 0px)); font: .9375rem/1.6 var(--st-font-ui); overscroll-behavior: contain; overflow-wrap: anywhere; }
.sheet-body h3 { margin: 18px 0 6px; font: 700 .8125rem/1.3 var(--st-font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--st-ink-soft); }
.sheet-body h3:first-child { margin-top: 0; }
.sheet-body p { margin: 0 0 10px; max-width: 64ch; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0 0 10px; }
.kv dt { font-weight: 700; white-space: nowrap; }
.kv dd { margin: 0; }
kbd { font: 700 .8125rem var(--st-font-mono); border: 1px solid var(--st-edge); border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; background: var(--st-card); }
.note { padding: 10px 12px; margin-bottom: 8px; background: var(--st-card); border: 1px solid var(--st-line); border-radius: var(--st-radius); }
.note:focus { outline: none; }
.note:focus-visible { outline: 3px solid var(--st-accent); }
.note.hit { border: 2px solid var(--st-accent); }
.note h4 { margin: 0 0 2px; font: 700 .9375rem/1.3 var(--st-font-ui); }
.note p { margin: 0; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.set-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 8px 0; border-bottom: 1px solid var(--st-line); }
.set-row > span { font-weight: 600; }
.set-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.facing { padding: 10px 12px; margin-bottom: 10px; background: var(--st-card); border: 1px solid var(--st-edge); border-radius: var(--st-radius); }
.facing h3 { margin-top: 0; }
.facing dd:empty::before, .facing dd.none { color: var(--st-muted); }
.asText { display: block; width: 100%; min-height: 8em; margin: 6px 0 10px; padding: 8px; font: .8125rem/1.5 var(--st-font-mono); background: var(--st-bg); color: var(--st-ink); border: 1px solid var(--st-edge); border-radius: 6px; resize: vertical; }
.ecounts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 8px 0 12px; }
.ec { padding: 6px 10px; background: var(--st-card); border: 1px solid var(--st-edge); border-radius: 6px; font-size: .8125rem; }
.ec b { display: block; font: 700 1.25rem/1.2 var(--st-font-display); font-variant-numeric: tabular-nums; }
.ec.zero { border-style: dashed; color: var(--st-bad); }
.routes { display: grid; gap: 6px; }
.route-row { display: flex; align-items: stretch; gap: 6px; }
.route-row .route { flex: 1 1 auto; min-width: 0; width: auto; }
.route-last { flex: none; align-self: flex-start; padding: 0 10px; }
.route {
  display: block; width: 100%; min-height: var(--st-target); padding: 6px 10px; text-align: left; cursor: pointer;
  background: var(--st-card); border: 1px solid var(--st-edge); border-radius: 6px; font: .8125rem/1.45 var(--st-font-ui);
}
.route:hover { background: var(--st-tint1); }
.route b { font-weight: 700; }
.route small { display: block; color: var(--st-ink-soft); font-variant-numeric: tabular-nums; }
.vlist-h { margin: 14px 0 6px; font: 700 .8125rem/1.3 var(--st-font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--st-ink-soft); }

/* ---------- short screens (a phone on its side, or a page zoomed to 400%) ----------
   The brand line and the foot go. The HUD is one row (see above). The stage keeps a floor (--st-stage-min); if the screen is
   shorter than the chrome plus that floor, the page scrolls, and everything can still be reached (WCAG 1.4.10 at 320 x 256). */
@media (max-height: 480px) {
  .brand-sub, .foot { display: none; }
  /* The text panel covers most of the stage here, and with it the kit's in-world screen: the panel shows its copy of the lines. */
  .sr-only.screen-copy {
    position: static; width: auto; height: auto; margin: 10px 0 0; padding: 8px 10px; overflow: visible; clip-path: none;
    white-space: pre-wrap; font: .875rem/1.5 var(--st-font-mono); background: var(--st-ink); color: var(--st-bg); border-radius: 4px;
  }
  .bar { padding-top: max(2px, env(safe-area-inset-top, 0px)); padding-bottom: 2px; }
  .hud { padding-top: 4px; padding-bottom: 4px; }
  .hud-tools .lbl { display: none; }
  .hud-tools .btn { padding: 0 10px; }
  .meter { padding: 2px 8px 3px; }
  .pips, .bar-track { margin-top: 2px; }
  .deck { padding-top: 4px; }
  .place { padding-top: 2px; padding-bottom: 2px; }
  .sl { padding-top: 24px; padding-bottom: 4px; gap: 6px; }
  .cuetag { top: 26px; }
  .panel { --st-pad-x: 12px; padding-top: 6px; padding-bottom: 6px; font-size: 1rem; line-height: 1.45; }
  .tags { margin-bottom: 2px; }
  .tag { padding-top: 0; padding-bottom: 0; }
  .ask { margin: 4px 0 2px; }
  .opts { gap: 6px; margin-top: 4px; }
  .opt { padding-top: 4px; padding-bottom: 4px; min-height: 40px; }
  .m-val small { display: none; }
  .m-delta { top: -16px; }
  .title-name { font-size: clamp(1.4rem, 5vw, 2rem); }
  .track { padding-top: 4px; padding-bottom: 4px; }
  .row { margin-top: 8px; }
  .end-title { margin: 2px 0; }
}

/* A short and wide screen puts the commentary beside the passage, not under it, so both keep their height. */
/* Short and wide: the commentary sits beside the passage. Not while a pull-tab shows: the room kept clear for the tab
   (mid-stage, since the book box is narrow here) leaves too little width for two columns. */
@media (max-height: 480px) and (min-width: 560px) {
  /* The HUD stays one row on a short screen: five meters too. */
  .meters:has(.meter:nth-child(5)):not(:has(.meter:nth-child(6))) { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .meters:has(.meter:nth-child(5)):not(:has(.meter:nth-child(6))) .meter,
  .meters:has(.meter:nth-child(5)):not(:has(.meter:nth-child(6))) .meter:nth-child(n+4) { grid-column: auto; }
  #stage:not(:has(.k-tab:not([hidden]))) .sl:has(> .track) { flex-direction: row; align-items: flex-end; justify-content: center; }
  #stage:not(:has(.k-tab:not([hidden]))) .sl:has(> .track) > .panel { flex: 1 1 0; width: auto; min-width: min(16rem, 100%); max-width: 34rem; max-height: 100%; }
  #stage:not(:has(.k-tab:not([hidden]))) .sl:has(> .track) > .track { flex: 0 1 15rem; width: auto; max-width: 15rem; max-height: 100%; }
}

/* ---------- forced colors: fills and marks that are backgrounds would vanish, so they take system colors ---------- */
@media (forced-colors: active) {
  .pip { border-color: CanvasText; }
  .pip.on { forced-color-adjust: none; background: CanvasText; }
  .pip.spent { background: transparent; border-style: dashed; }
  .bar-track { border-color: CanvasText; }
  .bar-track i { forced-color-adjust: none; background: CanvasText; }
  .autobar i { forced-color-adjust: none; background: Highlight; }
  .caret::after { forced-color-adjust: none; background: CanvasText; }
  .ava.ava-none::after { forced-color-adjust: none; background: CanvasText; }
  .btn.primary, .btn[aria-pressed="true"] { forced-color-adjust: none; background: Highlight; color: HighlightText; border-color: Highlight; }
  .opt.sealed { border-width: 3px; }
  .panel[data-overflow="1"]::after, .track[data-overflow="1"]::after, .panel[data-overflow="1"] > .row:last-child::before { background: linear-gradient(to bottom, transparent, Canvas); }
  .panel[data-overflow="1"] > .row:last-child, .panel[data-overflow="1"] .in-form > .row { background: Canvas; }
}

/* Reduced motion: the system setting, or the reader's Calm setting (<html data-motion="calm">). The two are the same block. */
@media (prefers-reduced-motion: reduce) {
  :root { --m-idle-scale: 1; }
  *, *::before, *::after {
    animation: none !important; transition: none !important; scroll-behavior: auto !important;
  }
}
:root[data-motion="calm"] { --m-idle-scale: 1; }
:root[data-motion="calm"] *, :root[data-motion="calm"] *::before, :root[data-motion="calm"] *::after {

<script>
window.PACK = {"id":"spring-turn","title":"The Spring Turn","subtitle":"The gnome druid","kit":"paper","resolver":"ose","start":"s0","storageKey":"fort-stage.spring-turn","meters":[{"id":"fate","label":"Fate","min":0,"max":6,"start":3,"hud":true},{"id":"stores","label":"Stores","min":0,"max":6,"start":4,"hud":true},{"id":"walls","label":"Walls","min":0,"max":6,"start":3,"hud":true},{"id":"folk","label":"Folk","min":0,"max":6,"start":4,"hud":true},{"id":"lamp","label":"Lamp","min":0,"max":6,"start":2,"hud":true}],"fields":[{"id":"name","label":"Name","side":"front"},{"id":"lens","label":"The Lens","side":"front"},{"id":"yoc","label":"Year of Change","side":"front"},{"id":"spell","label":"Level-2 spell","side":"front"},{"id":"office","label":"Fort Office","side":"front"},{"id":"bond","label":"Bond","side":"front"},{"id":"extra","label":"Kit extra","side":"front"},{"id":"public","label":"Public fact","side":"front"},{"id":"secret","label":"Secret fact","side":"front"},{"id":"size","label":"The Fort's Size","side":"front","default":"Hamlet (Folk 4)"},{"id":"land","label":"The land tells you","side":"back"},{"id":"origin","label":"Came because","side":"back"},{"id":"terminal","label":"The Terminal is","side":"back"},{"id":"know","label":"You start knowing","side":"back"},{"id":"lens1","label":"Lens 1: the pulse in the rock","side":"back"},{"id":"lens2","label":"Lens 2: the wall in the well","side":"back"},{"id":"spring","label":"Spring, the Year Between","side":"back"},{"id":"pen","label":"The Pen · Spring","side":"back"},{"id":"dir_mine","label":"Directive: yours","side":"back"},{"id":"dir_explore","label":"Directive: Explore","side":"back"},{"id":"dir_tend","label":"Directive: Tend","side":"back"},{"id":"strain","label":"Strain","side":"back","default":"None"},{"id":"fatefact","label":"Fate fact (1 Fate)","side":"back"},{"id":"event","label":"The Event","side":"back"},{"id":"oath","label":"The Oath","side":"back"},{"id":"ledger","label":"Fort ledger, Spring","side":"back"},{"id":"cassandra","label":"Cassandra, at the milestone","side":"back"},{"id":"w_tag","label":"Year Between tag","side":"back","hidden":true},{"id":"w_change","label":"Year of Change code","side":"back","hidden":true},{"id":"w_dirs","label":"Directives picked","side":"back","hidden":true},{"id":"w_tmp","label":"Event follow-up","side":"back","hidden":true}],"tallies":{"lens":["hymn","machine"]},"commentary":{"label":"How the Fort turns","kinds":["dm","rule"]},"script":{"scenes":[{"id":"s0","title":"The Book Opens","place":"The Spring Turn · Before you begin","look":"paint","set":"cover","beats":[{"kicker":"THE SPRING TURN","text":"You hold a book that plays one season of the Fort. The Fort is a character too. It has a sheet, as you do.","comment":"dm-sheet"},{"text":"Look at the top of the page. Stores, Walls, Folk and Lamp are the Fort. Fate is yours. The Fort acts through you, and you act through it.","notes":["fort-sheet"]},{"text":"The numbers are the Fort's start values: Stores 4, Walls 3, Folk 4, Lamp 2. This book plays one Spring from them, to teach the turn. The Fort at your own table may stand at other numbers."},{"kicker":"WHO YOU PLAY","text":"You play the gnome druid, level 2. You held the Pen in Spring. You listen to the land, and to what the land carries. Six short scenes follow. The third is the Fort Turn.","notes":["pen"]},{"text":"Some pages are *paint*: the Fort sees what you do. Some are *ink*: only you know. The page says which.","notes":["register"]},{"text":"Old things will show at the edge of the story. Read each as a hymn or as a machine. Neither is wrong. The book will follow you.","notes":["lens"],"comment":"dm-follows"},{"text":"The margin keeps your Fate. You start with three points. The Fort Turn will ask for one.","notes":["fate"]},{"kicker":"BEFORE THE FIRST PAGE","text":"At the end you carry away a Fort Card. Every choice writes one line on it. First, write the name the Fort calls you. This is Planning: it is free, and you can change it.","notes":["card","planning"],"comment":"dm-writes"}],"choices":[{"key":"name","ask":"What does the Fort call you?","gate":"plan","options":[{"key":"a","label":"Write your name","sub":"Typed. It goes on your card.","input":{"field":"name","prompt":"Write your name, as the Fort writes it.","max":60}}]}],"next":"s1"},{"id":"s1","title":"The Nesting Hall","place":"Year One · the Gorgon Caves","look":"ink","set":"nesting","beats":[{"kicker":"YEAR ONE","text":"Last year. The Gorgon Caves.","comment":"dm-frames"},{"text":"In the Nesting Hall the floor is warm. Something small pecks at the inside of an egg. The Glamourist is already crouched beside it, crooning.","notes":["biddy","glamourist"]},{"text":"You put your hand flat on the stone and listen. The rock has a slow pulse. It is not the Queen's. It is deeper than she is, and older, and it never misses a beat."},{"text":"You have felt it before. You felt it the day you left your burrow and came to the Fort. The land has been talking to you ever since.","notes":["land"]}],"choices":[{"key":"lens1","ask":"What is the pulse?","gate":"plan","notes":["lens"],"options":[{"key":"a","label":"A spirit of the deep earth, old and slow, older than the Queen.","sub":"Lens: hymn (a spirit)","effects":[{"tally":"lens","add":"hymn"},{"set":{"lens1":"A spirit (hymn)"}}],"then":[{"text":"You thank it, the way your grandmother taught you to thank a spring."}]},{"key":"b","label":"An engine. Something under the rock is turning, steady as a mill wheel.","sub":"Lens: machine (an engine)","effects":[{"tally":"lens","add":"machine"},{"set":{"lens1":"An engine (machine)"}}],"then":[{"text":"You count the beats. The count never changes. Living things are not so steady.","notes":["reveal"]},{"kicker":"REFEREE NOTE · LEAN IN","text":"A pulse that never misses is a count. Count it against your own heart, and against the days. A living thing drifts. A machine does not. You will know the difference again.","comment":"dm-secrets","when":{"all":[{"tally":"lens","top":"machine"},{"not":{"tally":"lens","top":"hymn"}}]},"reveal":true}]}]},{"key":"land","ask":"What does the land tell you?","gate":"plan","options":[{"key":"a","label":"The land is sick.","sub":"Writes: Year One, and what you start knowing","effects":[{"set":{"land":"The land is sick. Warning: Maren listens because she has to.","know":"Where the sickness is worst: a place near the caves where nothing grows. And one symptom the humans have not noticed yet."}}],"then":[{"text":"Something is poisoning it, slowly, from underground, spreading out from the Ridge. The burrowing animals are leaving. The water tastes wrong, if you know what right tastes like.","notes":["reveal"]},{"kicker":"YOU START KNOWING","text":"Where the sickness is worst: a place near the caves where nothing grows. And one symptom the humans have not noticed yet.","comment":"dm-hides","reveal":true}]},{"key":"b","label":"The land is waking up.","sub":"Writes: Year One, and what you start knowing","effects":[{"set":{"land":"The land is waking up. Strange: the children follow you; the adults aren't sure you're safe.","know":"A place where the waking is strongest. You go there alone. Something met you there. It did not speak. It just looked."}}],"then":[{"text":"Not sick: alive, more than it should be. New growth where it should be barren. Animals watching, not fleeing. Something old is stirring, and it is curious.","notes":["reveal"]},{"kicker":"YOU START KNOWING","text":"A place where the waking is strongest. You go there alone. Something met you there. It did not speak. It just looked.","comment":"dm-hides","reveal":true}]},{"key":"c","label":"The land is old, and it remembers.","sub":"Writes: Year One, and what you start knowing","effects":[{"set":{"land":"The land is old, and it remembers. Oracle: people ask your advice and leave unsettled.","know":"That the Terminal and the land are entangled. What happens to one happens to the other. The Minister does not know this yet."}}],"then":[{"text":"The empire built over something. The Terminals run on something. The land was here before all of it, and it is patient, and it is waiting for the machines to stop.","notes":["reveal"]},{"kicker":"YOU START KNOWING","text":"That the Terminal and the land are entangled. What happens to one happens to the other. The Minister does not know this yet.","comment":"dm-hides","reveal":true}]}]},{"key":"origin","ask":"Why did you come to the Fort?","gate":"plan","options":[{"key":"a","label":"The animals told you to.","sub":"Writes: Year One","effects":[{"set":{"origin":"The animals told you to. The land wanted you here."}}],"then":[{"text":"Not in words. A fox led you three days through the forest. The birds would not let you turn south. The land wanted you here."}]},{"key":"b","label":"Your grove was destroyed.","sub":"Writes: Year One","effects":[{"set":{"origin":"Your grove was destroyed. You need a new one."}}],"then":[{"text":"Fire, or axes, or something worse. The place you tended is gone. You need a new one. The lake shore might do, if something changes first."}]},{"key":"c","label":"You heard the Terminal from underground.","sub":"Writes: Year One","effects":[{"set":{"origin":"You heard the Terminal from underground, and followed the hum here."}}],"then":[{"text":"A hum, deep, through the rock. Gnomes hear what humans cannot. You followed it here. You do not think the Terminal knows you can hear it."}]}],"notes":["terminal"]}],"next":"s2"},{"id":"s2","title":"Spring: The Pen","place":"Spring · the Fields","look":"paint","set":"pen-spring","beats":[{"kicker":"THE YEAR BETWEEN","text":"The Year Between. The Pen came to you first, in Spring.","notes":["pen"]},{"text":"You kept the Fort's book with dirt under your nails, and you drew the weather in the margins because it mattered more than the words."},{"text":"The thaw came early. You planted with the Fort folk and walked the Fields barefoot at dawn. The Quiet came across the water in their boats to watch the kingfishers, and bowed to you, and went home. The burrowing things began to bring you news.","notes":["quiet"]},{"kicker":"THE SEASON CARD · SPRING","text":"When the thaw is done, the Fort turns a card. Spring's card says three things. Mud halves the speed of every road. The Court's Door in the Fields stands open. The Glamourist comes to visit.","notes":["season"],"comment":"dm-season"},{"kicker":"THE YEAR BETWEEN · SPRING","text":"The Pen asks what the Fort did with its Spring. Each answer leaves one tag on the Fort. The Fort Turn will use it.","notes":["tags"]}],"choices":[{"key":"yb","ask":"What did the Fort do with its Spring?","gate":"plan","options":[{"key":"a","label":"A. The Long Field","sub":"Tag: Surplus: barley","effects":[{"set":{"spring":"A. The Long Field — Surplus: barley","w_tag":"a"}}],"then":[{"text":"The Fort's book now carries one tag from your Pen. Surplus: barley."}]},{"key":"b","label":"B. The Broken Docks","sub":"Tag: Want: salt","effects":[{"set":{"spring":"B. The Broken Docks — Want: salt","w_tag":"b"}}],"then":[{"text":"The Fort's book now carries one tag from your Pen. Want: salt."}]},{"key":"c","label":"C. The First Moot","sub":"Tag: Oath: Cassandra","effects":[{"set":{"spring":"C. The First Moot — Oath: Cassandra","w_tag":"c"}}],"then":[{"text":"The Fort's book now carries one tag from your Pen. Oath: Cassandra."}]}],"notes":["surplus","want","oath"]},{"key":"yoc","ask":"How were you changed? (Year of Change) (Proposed; the DM confirms.)","gate":"plan","notes":["yoc"],"options":[{"key":"a","label":"Green Hand","sub":"Plants grow faster near you. Once a year, Stores +1 at a Fort Turn. (Proposed; the DM confirms.)","effects":[{"set":{"yoc":"Green Hand. Plants grow faster near you. Once a year, Stores +1 at a Fort Turn. (Proposed; the DM confirms.)","w_change":"g"}}],"then":[{"text":"Whatever you planted came up a week early and twice as thick. The Fort ate better for it."}]},{"key":"b","label":"Lake-Speaker","sub":"Once a day, ask the fish or the birds one question. They answer truly, as far as they know. (Proposed; the DM confirms.)","effects":[{"set":{"yoc":"Lake-Speaker. Once a day, ask the fish or the birds one question. They answer truly, as far as they know. (Proposed; the DM confirms.)","w_change":"l"}}],"then":[{"text":"You sat at the end of the jetty every evening until the herons began to answer."}]},{"key":"c","label":"Small Friend","sub":"A small animal follows you. HD ½, 1 hp, cannot fight. Once per hex it scouts ahead, and the party cannot be surprised there. (Proposed; the DM confirms.)","effects":[{"set":{"yoc":"Small Friend (choose the animal). A small animal follows you. HD ½, 1 hp, cannot fight. Once per hex it scouts ahead, and the party cannot be surprised there. (Proposed; the DM confirms.)","w_change":"s"}}],"then":[{"text":"Something small followed you home from the Fields and would not leave."}]}]},{"key":"friend","ask":"What follows you?","gate":"plan","options":[{"key":"a","label":"A stoat","sub":"Your small friend","when":{"field":"w_change","is":"s"},"effects":[{"set":{"yoc":"Small Friend (a stoat). A small animal follows you. HD ½, 1 hp, cannot fight. Once per hex it scouts ahead, and the party cannot be surprised there. (Proposed; the DM confirms.)"}}],"then":[{"text":"It sits at the edge of the Fields, watching you plant. By evening it is on your shoulder."}]},{"key":"b","label":"A crow","sub":"Your small friend","when":{"field":"w_change","is":"s"},"effects":[{"set":{"yoc":"Small Friend (a crow). A small animal follows you. HD ½, 1 hp, cannot fight. Once per hex it scouts ahead, and the party cannot be surprised there. (Proposed; the DM confirms.)"}}],"then":[{"text":"It sits at the edge of the Fields, watching you plant. By evening it is on your shoulder."}]},{"key":"c","label":"A toad","sub":"Your small friend","when":{"field":"w_change","is":"s"},"effects":[{"set":{"yoc":"Small Friend (a toad). A small animal follows you. HD ½, 1 hp, cannot fight. Once per hex it scouts ahead, and the party cannot be surprised there. (Proposed; the DM confirms.)"}}],"then":[{"text":"It sits at the edge of the Fields, watching you plant. By evening it is on your shoulder."}]}]},{"key":"spell","ask":"The land taught you one more spell. Which, for good?","gate":"plan","notes":["spell2"],"options":[{"key":"a","label":"Warp Wood","sub":"Writes: level-2 spell","effects":[{"set":{"spell":"Warp Wood"}}],"then":[{"text":"Wood bends for you. A gate, a ladder, a bow."}]},{"key":"b","label":"Heat Metal","sub":"Writes: level-2 spell","effects":[{"set":{"spell":"Heat Metal"}}],"then":[{"text":"Iron remembers the fire it came from, when you remind it."}]}]},{"key":"pen","ask":"Write one thing you wrote in Spring that is still true at the Fort.","gate":"plan","options":[{"key":"a","label":"Write the line","sub":"The Pen line. Typed.","input":{"field":"pen","prompt":"Write one thing you wrote in Spring that is still true at the Fort.","max":200}}]}],"next":"s3"},{"id":"s3","title":"The Fort Turn","place":"Spring · the Fort Turn","look":"paint","set":"ledger","beats":[{"kicker":"THE FORT TURN","text":"Spring is ending. The Fort turns its page. A Fort Turn comes four times a year, in six steps. You will play each one.","notes":["turn"],"comment":"dm-turn"},{"kicker":"1 · THE SEASON","text":"You read the card already. Mud halves road speed. The Court's Door stands open. The Glamourist will visit."},{"kicker":"2 · THE REPORT","text":"Maren and the Minister stand at the table with the Fort's book. Each will say one track in one sentence. Nobody rolls. No time passes.","notes":["planning"],"comment":"dm-report"},{"kicker":"MAREN","text":"“Stores stand at four. We eat until midsummer, if the road opens.”","notes":["tracks"]},{"kicker":"MAREN","text":"“Walls stand at three. The palisade holds, and the north corner leans.”"},{"kicker":"THE MINISTER","text":"“Folk stand at four. A Hamlet, by the old count of heads.”","notes":["size"]},{"kicker":"THE MINISTER","text":"“Lamp stands at two. Wick trims it each night, and the glass in the Shrine is faint.”"},{"kicker":"THE FORT'S BOOK","text":"The Fort's book carries one tag from your Pen. Surplus: barley.","comment":"dm-remembers","when":{"field":"w_tag","is":"a"}},{"kicker":"THE FORT'S BOOK","text":"The Fort's book carries one tag from your Pen. Want: salt.","comment":"dm-remembers","when":{"field":"w_tag","is":"b"}},{"kicker":"THE FORT'S BOOK","text":"The Fort's book carries one tag from your Pen. Oath: Cassandra.","comment":"dm-remembers","when":{"field":"w_tag","is":"c"}},{"kicker":"3 · THE DIRECTIVES","text":"Now the Fort acts. A Directive is one job for the Fort this season. There are five: Build, Defend, Trade, Explore and Tend. Each of you proposes one. The table picks two.","notes":["directives"]}],"choices":[{"key":"propose","ask":"What do you propose?","gate":"plan","options":[{"key":"a","label":"Build. Start a project.","sub":"Start a 4-segment project. Done: +1 to one track.","effects":[{"set":{"w_dirs":"p:bu"}}],"then":[{"kicker":"YOUR PROPOSAL","text":"You propose Build. The Fields have wanted water since the thaw."},{"kicker":"THE THIEF","text":"The thief proposes Explore. She reads places, and a hex is a place to read."},{"kicker":"THE CLERIC","text":"The cleric proposes Tend. She keeps the Terminal, and the Lamp is low."},{"kicker":"THE BOOK SPEAKS FOR THEM","text":"The book chose these two for them, as proposals that suit them. At your table they would choose for themselves.","comment":"dm-propose"},{"kicker":"EXECUTION","text":"Until now the Fort has only talked. That was Planning, and it is free. Choosing the Directives is Execution. Each effect takes hold at once, and none can be undone."}]},{"key":"b","label":"Defend. Mend the palisade.","sub":"Walls +1, or +2 for 1 Stores.","effects":[{"set":{"w_dirs":"p:de"}}],"then":[{"kicker":"YOUR PROPOSAL","text":"You propose Defend. The north corner leans, and you can feel it from the Fields."},{"kicker":"THE THIEF","text":"The thief proposes Explore. She reads places, and a hex is a place to read."},{"kicker":"THE CLERIC","text":"The cleric proposes Tend. She keeps the Terminal, and the Lamp is low."},{"kicker":"THE BOOK SPEAKS FOR THEM","text":"The book chose these two for them, as proposals that suit them. At your table they would choose for themselves.","comment":"dm-propose"},{"kicker":"EXECUTION","text":"Until now the Fort has only talked. That was Planning, and it is free. Choosing the Directives is Execution. Each effect takes hold at once, and none can be undone."}]},{"key":"c","label":"Trade. Send a cart.","sub":"Roll 1d6 for the cart to the coast.","effects":[{"set":{"w_dirs":"p:tr"}}],"then":[{"kicker":"YOUR PROPOSAL","text":"You propose Trade. The road is mud, but a cart can still get through."},{"kicker":"THE THIEF","text":"The thief proposes Explore. She reads places, and a hex is a place to read."},{"kicker":"THE CLERIC","text":"The cleric proposes Tend. She keeps the Terminal, and the Lamp is low."},{"kicker":"THE BOOK SPEAKS FOR THEM","text":"The book chose these two for them, as proposals that suit them. At your table they would choose for themselves.","comment":"dm-propose"},{"kicker":"EXECUTION","text":"Until now the Fort has only talked. That was Planning, and it is free. Choosing the Directives is Execution. Each effect takes hold at once, and none can be undone."}]}],"notes":["trade","tend"]},{"key":"pick","ask":"The table picks two. Which?","gate":"exec","notes":["gate"],"comment":"dm-resolve","options":[{"key":"a","label":"Yours (Build), and the thief's Explore.","sub":"Sealed. Tend waits for next season.","when":{"field":"w_dirs","is":"p:bu"},"effects":[{"set":{"w_dirs":"bu-ex"}}],"then":[{"kicker":"THE PICK","text":"The table picks your Directive, Build, and the thief's Explore. The Fort acts."}]},{"key":"b","label":"Yours (Build), and the cleric's Tend.","sub":"Sealed. Explore waits for next season.","when":{"field":"w_dirs","is":"p:bu"},"effects":  The Fort pays for the stakes and the hands. Walls +2, Stores −1."}]}]},{"key":"trade","ask":"Trade. What goes on the cart?","gate":"exec","options":[{"key":"a","label":"Send the cart","sub":"1d6: 1–2 Stores −1 · 3–4 Stores +1 · 5–6 Stores +2 and a rumour","when":{"any":[{"field":"w_dirs","is":"tr-ex"},{"field":"w_dirs","is":"tr-te"}]},"then":[{"kicker":"TRADE","text":"The cart is loaded in the yard. Maren counts it. Wick counts it again.","set":"cart"},{"text":"The cart goes for salt. The Want is met.","when":{"field":"w_tag","is":"b"}}],"roll":{"dice":"1d6","table":true,"results":{"1-2":{"label":"Stores −1","effects":[{"meter":"stores","add":-1},{"set":{"dir_mine":"Trade: a cart to the coast. Stores −1."}}],"then":[{"text":"The carter comes home with less than he took. The road was mud, and the buyers knew it. Stores −1.","set":"ledger"}]},"3-4":{"label":"Stores +1","effects":[{"meter":"stores","add":1},{"set":{"dir_mine":"Trade: a cart to the coast. Stores +1."}}],"then":[{"text":"A fair day's trade. The carter comes home with salt, cloth and a small profit. Stores +1.","set":"ledger"}]},"5-6":{"label":"Stores +2 and a rumour","effects":[{"meter":"stores","add":2},{"set":{"dir_mine":"Trade: a cart to the coast. Stores +2 and a rumour."}}],"then":[{"text":"A good trade, and a rumour. Boatmen at the coast say the water at the Weirs has not moved in weeks. The table decides what else the carter heard. Stores +2.","set":"ledger"}]}}}},{"key":"b","label":"Send the cart and the barley","sub":"Surplus: Stores +1 first. 1d6: 1–2 Stores −1 · 3–4 Stores +1 · 5–6 Stores +2 and a rumour","when":{"all":[{"any":[{"field":"w_dirs","is":"tr-ex"},{"field":"w_dirs","is":"tr-te"}]},{"field":"w_tag","is":"a"}]},"effects":[{"meter":"stores","add":1}],"then":[{"kicker":"TRADE","text":"The cart is loaded in the yard, and the barley goes on top. Maren counts it. Wick counts it again. The Surplus pays at once: Stores +1.","set":"cart"}],"roll":{"dice":"1d6","table":true,"results":{"1-2":
