"sub":"Spend 1 Fate. Typed.","when":{"all":[{"field":"w_tmp","is":"fate"},{"any":[{"field":"w_dirs","is":"bu-te"},{"field":"w_dirs","is":"de-te"},{"field":"w_dirs","is":"tr-te"},{"field":"w_dirs","is":"ex-te"}]}]},"effects":[{"set":{"w_tmp":""}}],"input":{"field":"fatefact","prompt":"State one true thing about the Lamp, or the Shrine.","max":200},"then":[{"kicker":"THE DM MUST USE IT","text":"The DM must use it. It is true in the Fort now, and it is on the sheet."}]}]},{"key":"event","ask":"5 · The Event. Something always happens in a season. Roll the d12.","gate":"exec","notes":["event"],"comment":"dm-event","options":[{"key":"a","label":"Roll the Event","sub":"1d12. Twelve results, one for each face.","then":[{"kicker":"THE EVENT","text":"The DM rolls a d12 for the Fort. One line on the table will come true.","set":"event"},{"text":"The table has twelve lines. A raid asks a Walls test. A sickness or a stranger moves Folk. A form may come from Mile-House 13, and Harrow may come early. The rest are prompts.","notes":["walls-test","mile-house","harrow"]}],"roll":{"dice":"1d12","table":true,"results":{"1":{"label":"A raid","effects":[{"set":{"w_tmp":"raid"}},{"set":{"event":"1 · A raid"}}],"then":[{"kicker":"A RAID","text":"Torches at the north corner, where the palisade leans. Wick rings the Gate bell, and the Fort wakes.","set":"ledger"}]},"2":{"label":"Sickness: Folk −1","effects":[{"meter":"folk","add":-1},{"set":{"size":"Camp (Folk 3)"}},{"set":{"event":"2 · Sickness: Folk −1"}}],"then":[{"kicker":"SICKNESS","text":"A fever goes through the low houses. You stabilise the worst with your herb pouch. Not all of them. Folk −1.","set":"ledger"}]},"3":{"label":"A quarrel","effects":[{"set":{"event":"3 · A quarrel"}}],"then":[{"kicker":"A QUARREL","text":"Maren and the Minister quarrel in the yard, where everyone can hear. About what, the table decides. The tracks do not move.","notes":["muster"],"set":"ledger"}]},"4":{"label":"A form from Mile-House 13","effects":[{"set":{"event":"4 · A form from Mile-House 13"}}],"then":[{"kicker":"A FORM","text":"A rider from Mile-House 13 brings a form for the Fort to fill in. The Bureau of Imperial Anomalies wants a count of heads. What the Fort writes, the table decides. The tracks do not move.","set":"ledger"}]},"5":{"label":"A stranger: Folk +1","effects":[{"meter":"folk","add":1},{"set":{"size":"Hamlet (Folk 5)"}},{"set":{"event":"5 · A stranger: Folk +1"}}],"then":[{"kicker":"A STRANGER","text":"A stranger comes to the Gate at dusk and asks for a bed. The Paladin lets them in. By morning they have asked the cook for work. Folk +1.","set":"ledger"}]},"6":{"label":"A new line on the Terminal","effects":[{"set":{"event":"6 · A new line on the Terminal"}}],"then":[{"kicker":"A NEW LINE","text":"In the Shrine, the glass prints a line nobody asked for. It is short, and it goes away.","set":"glass","screen":["New line.","Unread: 1."]},{"kicker":"REFEREE NOTE · LEAN IN","text":"A line that arrives unasked is a rule that ran. Someone, long ago, chose the hour it runs. A rule can be watched, and its hour can be learned.","comment":"dm-secrets","when":{"all":[{"tally":"lens","top":"machine"},{"not":{"tally":"lens","top":"hymn"}}]},"reveal":true},{"text":"The Minister copies it into the Fort's book. What it means, the table decides. The tracks do not move.","set":"ledger"}]},"7":{"label":"Harrow early: Stores +1","effects":[{"meter":"stores","add":1},{"set":{"event":"7 · Harrow early: Stores +1"}}],"then":[{"kicker":"HARROW EARLY","text":"Harrow's wagons come up the road a week early, through the mud. He buys what the Fort can spare, and pays in coin and cloth. Stores +1.","set":"ledger"}]},"8":{"label":"A find in the reeds","effects":[{"set":{"event":"8 · A find in the reeds"}}],"then":[{"kicker":"A FIND","text":"Wick finds something in the Reed Shore, and counts it twice. What it is, the table decides. The tracks do not move.","notes":["wick"],"set":"ledger"}]},"9":{"label":"A good catch: Stores +1","effects":[{"meter":"stores","add":1},{"set":{"event":"9 · A good catch: Stores +1"}}],"then":[{"kicker":"A GOOD CATCH","text":"The nets come up full three days running, and the smoke-house is busy. Stores +1.","set":"ledger"}]},"10":{"label":"A hard case for the Paladin","effects":[{"set":{"event":"10 · A hard case for the Paladin"}}],"then":[{"kicker":"A HARD CASE","text":"A hard case comes to the Gate: someone took a sack from the stores to feed a neighbour. The Paladin asks the Fort what to do. The table decides. The tracks do not move.","set":"ledger"}]},"11":{"label":"The Glamourist's bargain","effects":[{"set":{"w_tmp":"bargain"}},{"set":{"event":"11 · The Glamourist's bargain"}}],"then":[{"kicker":"A BARGAIN","text":"The Glamourist is here for her spring visit, and she has brought an offer. She smiles when she makes it.","set":"ledger"}]},"12":{"label":"The lake sings","effects":[{"set":{"w_tmp":"sing"}},{"set":{"event":"12 · The lake sings"}}],"then":[{"kicker":"THE LAKE SINGS","text":"At night the lake sings. One long note rolls up the shore, and the Fort goes out on the wall to hear it. Wick wants to light the Lamp to answer. The Minister wants the shutters closed.","set":"ledger"}]}}}}]},{"key":"raid","ask":"A raid is a Walls test. A raid succeeds only at Walls 0. At Walls 1 or more the palisade holds, though the table may still play the fight.","gate":"exec","options":[{"key":"a","label":"Man the Walls","sub":"Walls 1 or more: the palisade holds. At 0 a raid succeeds.","when":{"field":"w_tmp","is":"raid"},"then":[{"kicker":"THE PALISADE HOLDS","text":"The palisade holds. The raiders find it whole, and go away cold. The table may still play the fight."}]}]},{"key":"bargain","ask":"The Glamourist offers a hedge of thorn along the north corner. She will say her price. Do you take it?","gate":"exec","options":[{"key":"a","label":"Take the bargain","sub":"Walls +2, Stores −1.","when":{"field":"w_tmp","is":"bargain"},"effects":[{"meter":"walls","add":2},{"meter":"stores","add":-1}],"then":[{"kicker":"THE BARGAIN","text":"A hedge of thorn comes up along the north corner in one night. The Glamourist takes the first jar from the stores. What else she asks, the table decides. Walls +2, Stores −1.","notes":["glamourist"]}]},{"key":"b","label":"Refuse politely","sub":"No change.","when":{"field":"w_tmp","is":"bargain"},"then":[{"kicker":"THE BARGAIN","text":"She laughs, and curtseys, and you cannot tell whether she is pleased."}]}]},{"key":"sing","ask":"The lake sings. What does the Fort do?","gate":"exec","options":[{"key":"a","label":"Light the Lamp to answer it","sub":"Lamp +1","when":{"field":"w_tmp","is":"sing"},"effects":[{"meter":"lamp","add":1}],"then":[{"kicker":"THE LAKE SINGS","text":"Wick lights the Lamp's second wick. The note comes back off the water, a little higher. Lamp +1."}]},{"key":"b","label":"Shutter the Fort and say nothing","sub":"Folk −1","when":{"field":"w_tmp","is":"sing"},"effects":[{"meter":"folk","add":-1},{"set":{"size":"Camp (Folk 3)"}}],"then":[{"kicker":"THE LAKE SINGS","text":"The shutters go up. A family that heard the note, and was afraid of it, leaves in the night. Folk −1."}]}]},{"key":"oath","ask":"Your tag is an Oath. Call it in now, or keep it?","gate":"plan","options":[{"key":"a","label":"Call in the Oath","sub":"Once only. Cassandra asks one question, and the table writes it.","when":{"field":"w_tag","is":"c"},"effects":[{"set":{"oath":"Called in, Spring."}}],"then":[{"kicker":"THE OATH","text":"Cassandra comes down from the wall, and looks at the Fort's book for a long moment."},{"kicker":"CASSANDRA","text":"She asks one question. The table writes it."}]},{"key":"b","label":"Hold it for later","sub":"The Oath stays on the sheet.","when":{"field":"w_tag","is":"c"}}]},{"key":"refresh","ask":"6 · Refresh. Fate comes back to 3. The tracks stay where the turn left them.","gate":"plan","notes":["refresh"],"comment":"dm-refresh","options":[{"key":"a","label":"Refresh","sub":"Fate is full.","when":{"all":[{"meter":"fate","gte":3},{"not":{"field":"w_change","is":"g"}}]},"then":[{"kicker":"REFRESH","text":"Fate is full. The page turns."},{"kicker":"STORES AT 6","text":"Stores stand at 6: a feast, and a project.","when":{"meter":"stores","gte":6}}]},{"key":"b","label":"Refresh","sub":"Fate +1, back to 3.","when":{"all":[{"meter":"fate","lte":2},{"not":{"field":"w_change","is":"g"}}]},"effects":[{"meter":"fate","add":1}],"then":[{"kicker":"REFRESH","text":"Your Fate point comes back. The page turns."},{"kicker":"STORES AT 6","text":"Stores stand at 6: a feast, and a project.","when":{"meter":"stores","gte":6}}]},{"key":"c","label":"Refresh","sub":"Fate is full. Green Hand: Stores +1.","when":{"all":[{"meter":"fate","gte":3},{"field":"w_change","is":"g"}]},"effects":[{"meter":"stores","add":1}],"then":[{"kicker":"REFRESH","text":"Fate is full. Green Hand: the early row comes up in the Fields. Stores +1."},{"kicker":"STORES AT 6","text":"Stores stand at 6: a feast, and a project.","when":{"meter":"stores","gte":6}}]},{"key":"d","label":"Refresh","sub":"Fate +1, back to 3. Green Hand: Stores +1.","when":{"all":[{"meter":"fate","lte":2},{"field":"w_change","is":"g"}]},"effects":[{"meter":"fate","add":1},{"meter":"stores","add":1}],"then":[{"kicker":"REFRESH","text":"Your Fate point comes back. Green Hand: the early row comes up in the Fields. Stores +1."},{"kicker":"STORES AT 6","text":"Stores stand at 6: a feast, and a project.","when":{"meter":"stores","gte":6}}]}]},{"key":"ledger","ask":"Write one line in the Fort ledger. It is the Fort's book, and the line is true.","gate":"plan","options":[{"key":"a","label":"Write the line","sub":"The Fort ledger. Typed.","effects":[{"set":{"w_tag":"","w_change":"","w_dirs":"","w_tmp":""}}],"input":{"field":"ledger","prompt":"Write one line for the Fort ledger.","max":160},"then":[{"kicker":"THE SHEET","text":"Read the sheet at the top of the page. A track at 0 costs the Fort. A track at 6 pays it. Folk sets the Fort's Size: a Camp, a Hamlet or a Village.","notes":["tracks"]},{"kicker":"THE TURN ENDS","text":"The turn is done. The next one starts from these numbers, not from the start values."}]}]}],"next":"s4"},{"id":"s4","title":"The Singing Well","place":"The same Spring · the Fields","look":"paint","set":"well","beats":[{"kicker":"THE SAME SPRING","text":"The same Spring. The Fort has dug a new well in the Fields."},{"text":"It is the well you began in the Turn. The first line was straight. The diggers hurried the rest of it.","when":{"flag":"well_project"}},{"text":"At the bottom the diggers struck a curved wall of fitted stone, smooth as an eggshell, with water running behind it. They broke through, and the well filled in an hour."},{"text":"On its first night the water sings: one low note, like a wet finger on the rim of a glass. It does not stop."},{"text":"Folk gather at the fence with lanterns and come no closer. Wick has climbed the well-frame to see. Cassandra is not there. Somehow that is worse.","notes":["wick"]}],"choices":[{"key":"lens2","ask":"What has the well found?","gate":"plan","options":[{"key":"a","label":"A spring with a spirit in it, singing because it was woken.","sub":"Lens: hymn (a woken spring)","effects":[{"tally":"lens","add":"hymn"},{"set":{"lens2":"A woken spring (hymn)"}}],"then":[{"text":"You decide it is lonely, not angry."}]},{"key":"b","label":"An old pipe. The empire moved water under the Fields, and some of it still runs.","sub":"Lens: machine (an old pipe)","effects":[{"tally":"lens","add":"machine"},{"set":{"lens2":"An old pipe (machine)"}}],"then":[{"text":"You decide the note is the water, and the pipe is the glass."},{"kicker":"REFEREE NOTE · LEAN IN","text":"A pipe has a bore, and the bore sets the note. Measure the note, and you can measure the pipe. A wet finger on the rim of a glass does the same.","comment":"dm-secrets","when":{"all":[{"tally":"lens","top":"machine"},{"not":{"tally":"lens","top":"hymn"}}]},"reveal":true}]}]},{"key":"reg","ask":"Do you let them see?","gate":"exec","options":[{"key":"a","label":"Walk up to the well in front of everyone, and answer the note.","sub":"Sealed. Witnessed: paint, and a public fact.","effects":[{"flag":"witnessed"}],"then":[{"text":"Witnessed. The Fort sees what the water does when you speak to it.","look":"paint"},{"kicker":"A PUBLIC FACT","text":"The Fort saw. Now say what the whole Fort knows.","notes":["facts"],"comment":"dm-asks","look":"paint"}]},{"key":"b","label":"Wait until the lanterns go home. Then climb down alone.","sub":"Sealed. Unwitnessed: ink, and a secret fact.","effects":[{"flag":"unwitnessed"}],"then":[{"text":"Unwitnessed. Only you know what is at the bottom.","look":"ink"},{"kicker":"A SECRET FACT","text":"No one saw. Now say what only you know.","notes":["facts"],"comment":"dm-asks","look":"ink"}]}]},{"key":"fact4","ask":"Write it down.","gate":"plan","options":[{"key":"a","label":"Write what the whole Fort now knows","sub":"Public fact. Typed.","when":{"flag":"witnessed"},"input":{"field":"public","prompt":"Write one thing the whole Fort now knows about you, since that day.","max":200}},{"key":"b","label":"Write what only you know","sub":"Secret fact. Typed.","when":{"flag":"unwitnessed"},"input":{"field":"secret","prompt":"Write one true thing that only you know. It may be about you, or about the well.","max":200}}]}],"next":"s5"},{"id":"s5","title":"Maren's Last Muster","place":"Autumn · the yard","look":"paint","set":"muster","beats":[{"kicker":"AUTUMN","text":"Autumn. Captain Maren is retiring, and she wants the Fort in order before she goes."},{"text":"She calls the muster in the yard. The Paladin stands at the Gate. The Minister stands at Maren's left hand and does not look at her. From the Beast Pen, Biddy watches the crowd with one cold eye.","notes":["muster","biddy"]},{"text":"Maren reads four offices off a slate: Warden, Scout, Steward, Lorekeeper. The Fort keeps its own book now, and its own tracks: Stores, Walls, Folk, Lamp. Each office keeps one of them honest."},{"text":"She comes to you last, and has to look down. “The children follow you everywhere,” she says. “You may as well have a title. Pick one.” Beside her, the Minister asks you the question she has asked all year."}],"choices":[{"key":"terminal","ask":"The Minister asks, in the end: what do you think of the Terminal?","gate":"plan","options":[{"key":"a","label":"It's a tool.","sub":"Writes: Year One","effects":[{"set":{"terminal":"A tool. Useful, maybe. Holy, no."}}],"then":[{"text":"Like a plough or a loom. Useful, maybe. Holy, no. The power comes from the land; the screen only redirects it."}]},{"key":"b","label":"It's a wound.","sub":"Writes: Year One","effects":[{"set":{"terminal":"A wound. The hymns are a siphon."}}],"then":[{"text":"Something was driven into the earth here, and it is still drawing from it. The hymns are a siphon, and nobody asks the land if that is all right."}]},{"key":"c","label":"It's a conversation.","sub":"Writes: Year One","effects":[{"set":{"terminal":"A conversation between the land and the empire. You hear both sides."}}],"then":[{"text":"The Terminal and the land are talking, slowly, in a language neither side fully speaks. You hear both. You understand neither."}]}]},{"key":"office","ask":"Which office do you take?","gate":"plan","notes":["office"],"options":[{"key":"a","label":"Warden","sub":"Walls +1 when you take the Defend directive.","effects":[{"set":{"office":"Warden. Walls +1 when you take the Defend directive."}}],"then":[{"text":"Walls of stone, or hedges of thorn. You can grow the second kind."}]},{"key":"b","label":"Scout","sub":"One extra clue per hex you explore.","effects":[{"set":{"office":"Scout. One extra clue per hex you explore."}}],"then":[{"text":"You walk every hex anyway, barefoot."}]},{"key":"c","label":"Steward","sub":"You see the Fort's tracks (Stores, Walls, Folk, Lamp) before the DM reports them.","effects":[{"set":{"office":"Steward. You see the Fort's tracks (Stores, Walls, Folk, Lamp) before the DM reports them."}}],"then":[{"text":"You kept the book in Spring. You know what the Fields will give."}]},{"key":"d","label":"Lorekeeper","sub":"One free hint per puzzle.","effects":[{"set":{"office":"Lorekeeper. One free hint per puzzle."}}],"then":[{"text":"The land is old. It remembers what the books forgot."}]}]},{"key":"fact5","ask":"Write it down.","gate":"plan","options":[{"key":"a","label":"Write what Maren says about you","sub":"Public fact. Typed.","when":{"flag":"unwitnessed"},"input":{"field":"public","prompt":"Maren says one more thing about you, loud enough for the whole yard. Everyone hears it. Write it.","max":200}}]}],"next":"s6"},{"id":"s6","title":"The Night Before the Road","place":"The night before · the pear tree","look":"ink","set":"road-pack","beats":[{"kicker":"NIGHT","text":"Night. The Fort sleeps. Wick's lamps burn along the wall, one by one, and an owl counts them with him.","notes":["wick"]},{"text":"You lay your kit out under the pear tree and count it twice: staff, sling, stones, herb pouch, a waterskin filled at a spring and not the well. No torches. Before dawn you will walk out on the Old Road. The moles have been telling you so all week. They do not like the hum.","notes":["road"]},{"text":"Somebody here is tied to you.","notes":["bond"]}],"choices":[{"key":"bond","ask":"Who is your bond?","gate":"plan","options":[{"key":"a","label":"The Elven Thief","sub":"Mutual if their card names you","effects":[{"set":{"bond":"The Elven Thief: The thief and I argue about which of us is quieter. Nobody has won."}}],"then":[{"text":"Nobody hears either of you coming. You have argued about which of you is quieter. Nobody has won."}]},{"key":"b","label":"The Elf Cleric","sub":"Mutual if their card names you","effects":[{"set":{"bond":"The Elf Cleric: The cleric and I argue every night about where the power comes from."}}],"then":[{"text":"The opposition, and a friend. The cleric says the power is in the network. You say the land. You argue every night, and both of you like it."}]},{"key":"c","label":"Cassandra","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"Cassandra: Cassandra brings me dreams to read. I bring her roots."}}],"then":[{"text":"Cassandra brings you dreams to read. You bring her roots to taste."}]},{"key":"d","label":"Wick","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"Wick: Wick counts the things I grow. He is never wrong."}}],"then":[{"text":"Wick follows you on your walks and counts the things you grow. He is never wrong."}]},{"key":"e","label":"The Paladin","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"The Paladin: I planted a rowan by the Gate. The Paladin keeps it watered."}}],"then":[{"text":"Your power does not come from an oath. That bothers the Paladin. You planted a rowan by the Gate anyway, and the Paladin keeps it watered."}]},{"key":"f","label":"Captain Maren","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"Captain Maren: My weather saved Maren's harvest. She remembers."}}],"then":[{"text":"Maren listened to your weather, and it saved the harvest. She retires soon. She remembers."}]},{"key":"g","label":"The Minister","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"The Minister: The Minister fears what I stand for. I mended her garden anyway."}}],"then":[{"text":"The Minister fears what you stand for. You mended her garden anyway."}]},{"key":"h","label":"The Glamourist","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"The Glamourist: The Glamourist showed me the ring at the Court's Door. I keep it weeded."}}],"then":[{"text":"The Glamourist showed you the mushroom ring at the Court's Door. You keep it weeded."}]},{"key":"i","label":"Biddy","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"Biddy: Biddy is pleased that everyone keeps clear of her beak. The animals told me."}}],"then":[{"text":"Everyone keeps clear of her beak. The animals tell you what she thinks of that. She is pleased."}]}]},{"key":"kit","ask":"Your kit is the playbook's. What one thing do you add?","gate":"plan","options":[{"key":"a","label":"A bag of seeds.","sub":"Writes: Gear","effects":[{"set":{"extra":"a bag of seeds"}}],"then":[{"text":"Something always needs planting."}]},{"key":"b","label":"A willow whistle.","sub":"Writes: Gear","effects":[{"set":{"extra":"a willow bird-whistle"}}],"then":[{"text":"Three notes. The birds know all three."}]},{"key":"c","label":"A jar of wild honey.","sub":"Writes: Gear","effects":[{"set":{"extra":"a jar of wild honey"}}],"then":[{"text":"For wounds, for bargains, and for bears."}]}]},{"key":"secret6","ask":"Nobody sees you pack. Write one true thing that only you know.","gate":"plan","options":[{"key":"a","label":"Write what only you know","sub":"Secret fact. Typed.","when":{"flag":"witnessed"},"input":{"field":"secret","prompt":"Nobody sees you pack. Write one true thing that only you know.","max":200}}]},{"key":"go","ask":"Before dawn, you walk out on the Old Road. Do you go?","gate":"exec","comment":"dm-people","options":[{"key":"a","label":"Walk out onto the Old Road.","sub":"Sealed. The book reads your Lens and turns the page.","when":{"tally":"lens","value":"machine","lte":0},"effects":[{"set":{"lens":"Hymn","cassandra":"The lake breathes in at the Shallows and out under the Weirs, little one. It has not breathed out for a long time. Put your ear to the dry place, and count. Why do you think it is holding its breath?"}}]},{"key":"b","label":"Walk out onto the Old Road.","sub":"Sealed. The book reads your Lens and turns the page.","when":{"tally":"lens","value":"hymn","lte":0},"effects":[{"set":{"lens":"Machine","cassandra":"The lake breathes in at the Shallows and out under the Weirs, little one. It has not breathed out for a long time. Put your ear to the dry place, and count. Why do you think it is holding its breath?"}}]},{"key":"c","label":"Walk out onto the Old Road.","sub":"Sealed. The book reads your Lens and turns the page.","when":{"all":[{"tally":"lens","value":"machine","gte":1},{"tally":"lens","value":"hymn","gte":1}]},"effects":[{"set":{"lens":"Both","cassandra":"The lake breathes in at the Shallows and out under the Weirs, little one. It has not breathed out for a long time. Put your ear to the dry place, and count. Why do you think it is holding its breath?"}}]}]}],"route":[{"when":{"tally":"lens","value":"machine","lte":0},"to":"milestone-hymn"},{"when":{"tally":"lens","value":"hymn","lte":0},"to":"milestone-machine"},{"to":"milestone-both"}]}],"endings":{"milestone-hymn":{"title":"The Milestone: Hymn","look":"paint","set":"milestone","beats":[{"kicker":"BEFORE DAWN","text":"Before dawn you walk out on the Old Road. Mist lies on the Fields. The new well is quiet."},{"text":"The milestone stands where it always has, older than the Fort, cut with numbers nobody reads. It hums. You feel it in your teeth and in the soles of your feet."},{"text":"Cassandra is already there, wrapped in grey, as if she had waited all night. She does not look at the stone. She looks at you, and she says one true thing."},{"kicker":"CASSANDRA","text":"“The lake breathes in at the Shallows and out under the Weirs, little one. It has not breathed out for a long time. Put your ear to the dry place, and count. Why do you think it is holding its breath?”","notes":["cassandra"],"comment":"dm-people"},{"text":"You kneel, and lay your palm on the stone, as you laid it on the warm rock in the Nesting Hall. It hums under your hand. You thank it, and it goes on."},{"text":"Behind you, in the Fields, the well you began is quiet. Its first line is still straight.","when":{"flag":"well_project"}},{"kicker":"END OF THE BOOK","text":"The book closes. Your Fort Card holds every choice, and the Fort's sheet holds the Spring. Open it, copy it as text, and bring it to session zero. There you may change any choice.","notes":["card"],"comment":"dm-writes"}]},"milestone-machine":{"title":"The Milestone: Machine","look":"paint","set":"milestone","beats":[{"kicker":"BEFORE DAWN","text":"Before dawn you walk out on the Old Road. Mist lies on the Fields. The new well is quiet."},{"text":"The milestone stands where it always has, older than the Fort, cut with numbers nobody reads. It hums. You feel it in your teeth and in the soles of your feet."},{"text":"Cassandra is already there, wrapped in grey, as if she had waited all night. She does not look at the stone. She looks at you, and she says one true thing."},{"kicker":"CASSANDRA","text":"“The lake breathes in at the Shallows and out under the Weirs, little one. It has not breathed out for a long time. Put your ear to the dry place, and count. Why do you think it is holding its breath?”","notes":["cassandra"],"comment":"dm-people"},{"text":"You lay your ear to the stone and count the hum. It does not drift. Behind the count, you think, someone set a rule."},{"text":"Behind you, in the Fields, the well you began is quiet. Its first line is still straight.","when":{"flag":"well_project"}},{"kicker":"END OF THE BOOK","text":"The book closes. Your Fort Card holds every choice, and the Fort's sheet holds the Spring. Open it, copy it as text, and bring it to session zero. There you may change any choice.","notes":["card"],"comment":"dm-writes"}]},"milestone-both":{"title":"The Milestone: Both","look":"paint","set":"milestone","beats":[{"kicker":"BEFORE DAWN","text":"Before dawn you walk out on the Old Road. Mist lies on the Fields. The new well is quiet."},{"text":"The milestone stands where it always has, older than the Fort, cut with numbers nobody reads. It hums. You feel it in your teeth and in the soles of your feet."},{"text":"Cassandra is already there, wrapped in grey, as if she had waited all night. She does not look at the stone. She looks at you, and she says one true thing."},{"kicker":"CASSANDRA","text":"“The lake breathes in at the Shallows and out under the Weirs, little one. It has not breathed out for a long time. Put your ear to the dry place, and count. Why do you think it is holding its breath?”","notes":["cassandra"],"comment":"dm-people"},{"text":"You lay your palm on the stone, and your ear beside it. The land and the count say the same thing in two voices, and neither argues. It hums, and waits."},{"text":"Behind you, in the Fields, the well you began is quiet. Its first line is still straight.","when":{"flag":"well_project"}},{"kicker":"END OF THE BOOK","text":"The book closes. Your Fort Card holds every choice, and the Fort's sheet holds the Spring. Open it, copy it as text, and bring it to session zero. There you may change any choice.","notes":["card"],"comment":"dm-writes"}]}}},"notes":{"dm-sheet":{"kind":"dm","term":"The Fort has a sheet","text":"A character has a sheet. So does the Fort. The DM keeps it at the table. Here it is the row at the top: Stores, Walls, Folk and Lamp, with your Fate beside them."},"dm-follows":{"kind":"dm","term":"The DM follows the table","text":"A good DM follows the players. If the table leans toward the machines, the DM gives it more machines. If not, the Fort stays a place with old ruins. The book watches your Lens the same way."},"dm-frames":{"kind":"dm","term":"The DM frames the scene","text":"The DM says where and when before anything happens. The line at the top of the page does it here."},"dm-secrets":{"kind":"dm","term":"A Referee Note","text":"A Referee Note holds what the DM knows and has not said. The flap opens only if you lift it. It tells you how to look, not what is there."},"dm-hides":{"kind":"dm","term":"The DM keeps a secret","text":"A DM hides a thing until you have earned it. The reveal ink does it here. The line was always on the page. You could not read it until you chose to."},"dm-turn":{"kind":"dm","term":"The DM runs the turn","text":"The DM runs a Fort Turn four times a year. It has six steps, always in order. The DM names each step aloud, so the table knows whether it is talking or rolling."},"dm-season":{"kind":"dm","term":"The DM opens with a season card","text":"The DM opens a turn with a season card: one weather rule and one fixed visit. Weather changes how the party travels. The visit is a guest you can plan for."},"dm-report":{"kind":"dm","term":"The DM reads the Report","text":"The DM has Maren and the Minister read the Fort aloud, one sentence for each track. Nobody rolls and no time passes. It is the moment to ask what a number means."},"dm-propose":{"kind":"dm","term":"Everyone proposes","text":"At the table, every player proposes a Directive. Here the book speaks for the thief and the cleric, with proposals that suit them. It says so, so you know they are the book's words."},"dm-resolve":{"kind":"dm","term":"The DM resolves at once","text":"The DM applies each Directive as soon as the table picks it. A track moves now, not at the end of the turn. The sheet at the top shows it."},"dm-fate":{"kind":"dm","term":"The DM must use it","text":"When you state a Fate fact, the DM must use it. It becomes true in the Fort, and the DM builds on it. You have not bought a result. You have written one line of the world."},"dm-event":{"kind":"dm","term":"The DM rolls the Event","text":"The DM rolls the Event on a d12 table. Each result is a prompt, not a story. The DM and the table decide the rest. This book writes one short ending for each prompt."},"dm-remembers":{"kind":"dm","term":"The DM remembers","text":"A DM remembers every tag the Fort carries. The book does it with flags. Your Year Between choice is still on the sheet, and the turn uses it."},"dm-refresh":{"kind":"dm","term":"The DM closes the turn","text":"The DM closes the turn: Fate comes back and one line goes in the Fort ledger. The next turn starts from these numbers, not from the start values."},"dm-asks":{"kind":"dm","term":"The DM asks you to say","text":"A DM asks you to say what is true. The book does it with a line you type. The Fort Card keeps it."},"dm-people":{"kind":"dm","term":"The DM plays the people","text":"A DM speaks for every person at the Fort. The book quotes them. Cassandra's lines are true, and half a riddle."},"dm-writes":{"kind":"dm","term":"The DM writes it down","text":"A DM keeps the Fort's book. The Fort Card is yours: every choice is one line on it."},"fort-sheet":{"kind":"rule","term":"The sheet","text":"The row at the top is the Fort's sheet. Stores, Walls, Folk and Lamp are the Fort. Fate is yours. A number moves the moment the book says so, and the Fort Card copies all of them."},"tracks":{"kind":"rule","term":"The four tracks","text":"Each track runs 0 to 6. At 0: Stores, hunger and Folk −1. Walls, a raid succeeds. Folk, the Fort splits. Lamp, the Terminal goes dark. At 6: Stores, a feast and a project. Walls, a garrison tower. Folk, new families. Lamp, the Terminal answers one question. A track stops at 6, and points past it are lost."},"size":{"kind":"rule","term":"Size","text":"Size follows Folk. At 0 to 3 the Fort is a Camp. At 4 or 5 it is a Hamlet. At 6 it is a Village. Folk stands at 4, so the Fort is a Hamlet."},"turn":{"kind":"rule","term":"The Fort Turn","text":"A Fort Turn comes four times a year. Its steps: season card, report, two Directives, a Fate fact, the Event, refresh. The report is Planning. The Directives are Execution."},"season":{"kind":"rule","term":"The season card","text":"The season card gives one weather rule and one fixed visit. Spring: mud halves road speed. The Court's Door opens. The Glamourist visits."},"planning":{"kind":"rule","term":"Planning","text":"Planning is free: talk, look, plan. No dice, no time. You can go back and change your mind. The Report is Planning."},"gate":{"kind":"rule","term":"Planning and Execution","text":"Planning is free: talk, look, plan. You can go back. Execution is final: dice and consequences, and nothing can be undone. The Report was Planning. The Directives are Execution. Once the table picks, the effects are real."},"directives":{"kind":"rule","term":"The five Directives","text":"Build: start a 4-segment project; done, +1 to one track. Defend: Walls +1, or +2 for 1 Stores. Trade: send a cart; roll 1d6. Explore: name a hex, learn one fact, lower its encounter risk until the next turn. Tend: Lamp +1."},"build":{"kind":"rule","term":"Build","text":"Build starts a project with four segments: a well, a tower, a boat or a smithy. A turn can fill one segment. When all four are full, the project is done, and one track gains +1."},"defend":{"kind":"rule","term":"Defend","text":"Defend raises Walls by 1. Or pay 1 Stores, and Walls rise by 2. At Walls 1 or more the palisade holds against a raid. Walls at 0 means a raid succeeds."},"trade":{"kind":"rule","term":"Trade","text":"Trade sends a cart to the coast. Roll 1d6 and read the line for that face. 1 or 2: Stores −1. 3 or 4: Stores +1. 5 or 6: Stores +2 and a rumour. A table roll is not pass or fail."},"explore":{"kind":"rule","term":"Explore","text":"Explore names a hex. You learn one fact about it, and its encounter risk is lower until the next turn. The Reed Shore, the Standing Stones and the Weirs are hexes near the Fort."},"tend":{"kind":"rule","term":"Tend","text":"Tend raises Lamp by 1. The cleric reads a hymn at the Shrine, and the Terminal shows one new line. A line is output. It prints; it does not speak."},"surplus":{"kind":"rule","term":"Surplus","text":"A Surplus is a tag from the Year Between. It gives +1 Stores to one Trade in a season. Barley is yours. Send it with the cart, and Stores rise by 1 before the dice."},"want":{"kind":"rule","term":"Want and Strain","text":"A Want is a tag that asks for something. Salt is yours. If no Directive meets it in a turn, the book marks Strain. Three Strain makes an Event. A Trade cart can bring salt. At your table the DM decides what meets a Want."},"oath":{"kind":"rule","term":"Oath","text":"An Oath is a tag you can call in once. Cassandra asks one question, and the table writes it. At your table the DM decides what an Oath buys. An Enmity, which Spring does not give, spoils one Event a turn."},"tags":{"kind":"rule","term":"Tags","text":"A Year Between choice leaves a tag on the Fort: a Surplus, a Want, an Oath or an Enmity. The Fort Turn uses it. The tag is a name and a rule, not a story."},"fate":{"kind":"rule","term":"Fate","text":"You have 3 Fate. Spend 1 to reroll, to add +4 to a save, or to state one true fact in your lane. Spend 2 to cheat death. Fate comes back at each Fort Turn."},"fate-fact":{"kind":"rule","term":"The Fate fact","text":"Spend 1 Fate to state one true fact about a Directive. The DM must use it. Fate falls to 2 and comes back at Refresh. A fact is not a roll. You choose what is true, and it stays true."},"event":{"kind":"rule","term":"The Event","text":"The Event is one roll of d12 on the Event table. Each face has its own line. A table roll is not pass or fail. You read the line for the face that shows. Most lines are prompts, and the table decides the rest."},"walls-test":{"kind":"rule","term":"A Walls test","text":"A raid asks one question of the Walls. A raid succeeds only at Walls 0. At Walls 1 or more the palisade holds, though the table may still play the fight. At your table the DM decides how a raid runs."},"refresh":{"kind":"rule","term":"Refresh","text":"Refresh brings Fate back to 3. The tracks stay where the turn left them. Growth: Stores and Folk both at 5 or more at the end of two turns running adds a family and a building."},"lens":{"kind":"rule","term":"The Lens","text":"Old things show at the edge. You read each as a hymn, a spirit or a mystery; or as a machine, an engine or a mechanism. Neither is wrong. Your card keeps the reading."},"register":{"kind":"rule","term":"Paint and ink","text":"Paint is witnessed: the Fort sees it, and a public fact comes from it. Ink is unwitnessed: nobody tells the Fort, and a secret fact comes from it. The page says which."},"facts":{"kind":"rule","term":"Public and secret facts","text":"A public fact is one the whole Fort knows. A secret fact is true, and only you know it. Each is one sentence, typed by you. The other one is typed in a later scene of the other kind."},"reveal":{"kind":"rule","term":"Reveal ink","text":"Some lines stay hidden until you reveal them. Press R, or tap. A reveal is never forced. The line was always there."},"land":{"kind":"rule","term":"The Land Speaks","text":"The Land Speaks is your Fate ability. In a natural place, declare one true fact about what the land knows: the earth, the water, the roots, the animals. Your lane is natural places."},"yoc":{"kind":"rule","term":"Year of Change","text":"A Year of Change is what the Year Between made of you. A gnome has three. The numbers are proposed. The DM confirms them at session zero."},"spell2":{"kind":"rule","term":"The level-2 spell","text":"At level 2 you learn one more spell, for good. Warp Wood bends wood. Heat Metal makes iron hot. It fills a 1st-level slot."},"office":{"kind":"rule","term":"Fort Office","text":"A Fort Office keeps one track honest. Warden: Walls +1 when you Defend. Scout: one extra clue per hex you explore. Steward: you see the tracks before the DM reports them. Lorekeeper: one free hint per puzzle."},"bond":{"kind":"rule","term":"Bonds","text":"A bond ties you to another character or to someone at the Fort. If two cards name each other, each gets 1 extra Fate, spent only to help the other."},"card":{"kind":"rule","term":"The Fort Card","text":"The Fort Card is what you carry away: every choice, one line each, and the Fort's sheet. Copy it as text, print it, and bring it to session zero. There you may change any choice."},"pen":{"kind":"lore","term":"The Pen","text":"The Pen is the Fort's book and the right to write in it. One of you holds it each season of the Year Between: the druid in Spring, the thief in Summer, the cleric in Autumn, all three in Winter."},"quiet":{"kind":"lore","term":"The Quiet","text":"The Quiet are lake-folk who pray to the kingfisher. They cross the water in boats. They keep to their shrines, and they watch the lake."},"biddy":{"kind":"lore","term":"Biddy","text":"A cockatrice chick's cry paralysed the Gorgon Queen. The chick is Biddy. Wick keeps her now, in the Beast Pen."},"glamourist":{"kind":"lore","term":"The Glamourist","text":"The Glamourist is fae. She visits the Fort at the solstices and the equinoxes, and she was in the Nesting Hall in Year One."},"terminal":{"kind":"lore","term":"The Terminal","text":"The Terminal is a screen in the Shrine that prints hymns. It prints; it does not speak. The Minister and the cleric tend it. Some say it is holy. Some say it is a machine."},"harrow":{"kind":"lore","term":"Harrow","text":"Harrow drives wagons up the Old Road. He buys what the Fort can spare. He pays in coin, and does not say what he does with the rest."},"mile-house":{"kind":"lore","term":"Mile-House 13","text":"Mile-House 13 is the post of the Bureau of Imperial Anomalies, on the Old Road. The Bureau files things, and it likes a form."},"wick":{"kind":"lore","term":"Wick","text":"Wick is twelve. He lights the lamps along the wall and keeps Biddy. He counts everything."},"cassandra":{"kind":"lore","term":"Cassandra","text":"Cassandra is the seer at the Shrine. Her rumours are true, and half a riddle. When she hints, she asks a question."},"muster":{"kind":"lore","term":"Maren and the Minister","text":"Captain Maren leads the Fort and is about to retire. The Minister keeps the Terminal. They do not agree, and the Fort knows it."},"road":{"kind":"lore","term":"The Old Road","text":"The Old Road runs past the Fort. A milestone stands on it, cut with numbers nobody reads. It hums."}},"sets":{"cover":{"kit":"paper","layers":[{"prim":"spread","art":"art/cover-ground.svg"},{"prim":"plate","art":"art/cover-plate.svg","look":"paint","x":0.5,"y":0.335,"w":0.6},{"prim":"vfold","art":"art/cover-spine.svg","x":0.5,"y":0.085,"w":0.74}]},"nesti .1,"w":0.24,"opensOn":"reveal"},{"prim":"pulltab","art":"art/glass-wick.svg","under":"art/glass-log.svg","tally":"lens","value":"machine","x":0.86,"y":0.3,"w":0.16,"words":["Lamp","Log"]}]},"well":{"kit":"paper","layers":[{"prim":"spread","art":"art/well-ground.svg"},{"prim":"tunnel","art":"art/well-fence.svg","art2":"art/well-frame.svg","art3":"art/well-mouth.svg","art4":"art/well-wall.svg","x":0.5,"y":0.3,"w":0.8},{"prim":"plate","art":"art/well-rings.svg","look":"ink","x":0.17,"y":0.13,"w":0.26},{"prim":"flap","art":"art/tag.svg","under":"art/well-note.svg","x":0.76,"y":0.1,"w":0.24,"opensOn":"reveal"},{"prim":"pulltab","art":"art/well-drop.svg","under":"art/well-pipe.svg","tally":"lens","value":"machine","x":0.86,"y":0.32,"w":0.17,"words":["Spring","Pipe"]}]},"muster":{"kit":"paper","layers":[{"prim":"spread","art":"art/muster-ground.svg"},{"prim":"parallel","art":"art/muster-yard.svg","x":0.5,"y":0.3,"w":0.9},{"prim":"vfold","art":"art/muster-maren.svg","x":0.44,"y":0.28,"w":0.74},{"prim":"plate","art":"art/muster-cockatrice.svg","look":"paint","x":0.86,"y":0.36,"w":0.2}]},"road-pack":{"kit":"paper","layers":[{"prim":"spread","art":"art/road-ground.svg"},{"prim":"vfold","art":"art/road-tree.svg","x":0.5,"y":0.24,"w":0.8},{"prim":"parallel","art":"art/road-kit.svg","x":0.5,"y":0.39,"w":0.7}]},"milestone":{"kit":"paper","layers":[{"prim":"spread","art":"art/milestone-ground.svg"},{"prim":"tunnel","art":"art/milestone-sky.svg","art2":"art/milestone-fields.svg","art3":"art/milestone-well.svg","art4":"art/milestone-road.svg","art5":"art/milestone-mist.svg","x":0.5,"y":0.28,"w":0.94},{"prim":"vfold","art":"art/milestone-stone.svg","x":0.36,"y":0.3,"w":0.28},{"prim":"plate","art":"art/milestone-cassandra.svg","look":"paint","x":0.66,"y":0.32,"w":0.2}]}},"theme":{"light":{"paper":"#fbfaf6","ink":"#111111","ink-2":"#4a4844","on-ink":"#fbfaf6","tint-1":"#efece5","tint-2":"#d6d2c8","rule":"#86837b","blueline":"#2f6fa8","blueline-wash":"#cfe0ef","cover-basic":"#b5232c","co     view,
    next() {
      if (S.node === "beat" && hidden()) return game.reveal();
      if (S.node !== "beat" && S.node !== "roll") { S.cues = []; return view(); }
      S.cues = [];
      S.node = null;
      settle(S, X, env); afterSettle(); commit(false);
      return view();
    },
    choose(key) {
      S.cues = [];
      if (S.node !== "choice") return refused("There is no choice to make");
      const gate = X.groups.get(split(S.cur)[1]).group.gate;
      const before = snap(S);
      const why = pick(S, X, key, env);
      if (why) { S = { ...before, cues: [] }; return refused(why); }
      afterSettle();
      commit(gate === "exec" || gate === "fate");
      return view();
    },
    reveal() {
      S.cues = [];
      if (!hidden()) return view();
      S.revealed = true; S.opened = true; // a secret in this set is open until the set changes
      S.lookShown = "ink"; // a revealed beat always inks, and the ink holds until a beat of another look
      S.cues.push({ type: "ink" });
      meet(X.beats.get(split(S.cur)[1]));
      hist[hist.length - 1] = snap(S);
      return view();
    },
    input(text) {
      S.cues = [];
      if (S.node !== "input") return refused("There is nothing to type here");
      const o = X.options.get(split(S.cur)[1]).option;
      S.fields[o.input.field] = String(text == null ? "" : text).replace(/\s+/g, " ").trim().slice(0, o.input.max || 140);
      S.node = null;
      settle(S, X, env); afterSettle(); commit(false);
      return view();
    },
    back() {
      const old = S;
      if (!(hist.length - 1 > floor)) { S.cues = []; return view(); }
      hist.pop();
      S = { ...clone(hist[hist.length - 1]), cues: [] };
      if (idOf(old) !== idOf(S)) S.cues.push({ type: "turn", dir: -1 });
      else if (old.set !== S.set) S.cues.push({ type: "shift" });
      return view();
    },
    save() {
      const drop = Math.max(0, hist.length - SAVE_HIST);
      return JSON.stringify({ v: SAVE_VERSION, pack: pack.id, seed: S.seed, floor: Math.max(0, floor - drop), hist: hist.slice(drop), met: meta.met, found: meta.found });
    },
  };
  return game;
}

// Replay a route from Stage.simulate: a route object {ending, count, steps} or its steps.
// A step is { opt: "group.option" } (with result: "<tier>" when the pick rolls) or { input: "text" }.
// A step's result forces that roll tier. `upTo` stops at the choice after that many picks.
function replay(pack, route, opts) {
  opts = opts || {};
  const steps = Array.isArray(route) ? route : route && Array.isArray(route.steps) ? route.steps : null;
  if (!steps) throw new Error("replay: a route is a list of steps, or an object with steps");
  steps.forEach((x, i) => {
    if (!isObj(x) || !(typeof x.opt === "string" && x.opt.includes(".") || has(x, "input"))) throw new Error(`replay: step ${i} must be { opt: "group.option" } or { input }, not ${JSON.stringify(x)}`);
  });
  const picks = steps.filter(x => has(x, "opt"));
  const forces = picks.filter(x => x.result != null).map(x => x.result);
  const typed = steps.filter(x => has(x, "input")).map(x => String(x.input));
  const g = create(pack, { seed: opts.seed, force: forces });
  let pi = 0, ti = 0;
  for (let guard = 0; guard < 100000; guard++) {
    const v = g.view();
    if (v.node === "ending") break;
    if (v.node === "choice") {
      if (pi >= picks.length || (opts.upTo != null && pi >= opts.upTo)) break;
      const dot = picks[pi].opt.indexOf(".");
      const gk = picks[pi].opt.slice(0, dot), ok = picks[pi].opt.slice(dot + 1);
      if (v.group.key !== gk) throw new Error(`replay: expected group "${gk}" but the game asks "${v.group.key}"`);
      pi++;
      const r = g.choose(ok);
      if (r.refused) throw new Error(`replay: ${r.refused}`);
    } else if (v.node === "input") g.input(ti < typed.length ? typed[ti++] : "(typed)");
    else g.next();
  }
  return g;
}

// ---- simulate (SPEC section 3, Simulation) ----
function walkConds(pack, fn) {
  const script = pack.script || {};
  const beats = bs => { for (const b of bs || []) if (b.when) fn(b.when); };
  for (const sc of script.scenes || []) {
    beats(sc.beats);
    for (const r of sc.route || []) if (r.when) fn(r.when);
    for (const g of sc.choices || []) for (const o of g.options || []) {
      if (o.when) fn(o.when);
      if (o.lock) fn(o.lock);
      beats(o.then);
      for (const res of Object.values((o.roll && o.roll.results) || {})) beats(res.then);
    }
  }
  for (const e of Object.values(script.endings || {})) beats(e.beats);
}
function collectReads(pack) {
  const reads = { flags: new Set(), fields: new Set(), meters: new Set(), tallies: new Set() };
  const go = c => {
    if (!isObj(c)) return;
    if (has(c, "flag")) reads.flags.add(c.flag);
    else if (has(c, "field")) reads.fields.add(c.field);
    else if (has(c, "meter")) reads.meters.add(c.meter);
    else if (has(c, "tally")) reads.tallies.add(c.tally);
    else if (has(c, "all")) (c.all || []).forEach(go);
    else if (has(c, "any")) (c.any || []).forEach(go);
    else if (has(c, "not")) go(c.not);
  };
  walkConds(pack, go);
  // A group's cost and a roll's add are read too: they decide what can be afforded and which tiers the dice reach.
  const meterIds = new Set(list(pack.meters).map(m => m && m.id));
  for (const sc of (pack.script && pack.script.scenes) || []) for (const g of sc.choices || []) {
    if (g.cost && g.cost.meter) reads.meters.add(g.cost.meter);
    for (const o of g.options || []) {
      const a = o.roll && o.roll.add;
      if (typeof a === "string") (meterIds.has(a) ? reads.meters : reads.fields).add(a);
    }
  }
  return { flags: [...reads.flags].sort(), fields: [...reads.fields].sort(), meters: [...reads.meters].sort(), tallies: [...reads.tallies].sort() };
}

function simulate(pack) {
  const X = index(pack);
  if (!X.scenes.has(pack.start)) throw new Error(`Stage.simulate: start scene "${pack.start}" does not exist`);
  const reads = collectReads(pack);
  const seen = { scenes: new Set(), beats: new Set(), options: new Set(), endings: new Set(), notes: new Set(), locked: new Set() };
  const env = {
    scene: id => seen.scenes.add(id),
    beat: (ref, b) => { seen.beats.add(ref); for (const n of b.notes || []) seen.notes.add(n); if (b.comment) seen.notes.add(b.comment); },
    group: (ref, g) => { for (const n of g.notes || []) seen.notes.add(n); if (g.comment) seen.notes.add(g.comment); },
    pick: ref => seen.options.add(ref),
    locked: ref => seen.locked.add(ref),
    ending: id => seen.endings.add(id),
  };
  // The state key: where we are, plus only the values some condition reads.
  const keyOf = S => {
    let k = `${S.scene || ""}|${S.ending || ""}|${S.node}|${S.cur}|${S.q.join(",")}|`;
    for (const f of reads.flags) k += S.flags[f] ? "1" : "0";
    k += "|";
    for (const f of reads.fields) k += `${S.fields[f]}\u0001`;
    k += "|";
    for (const m of reads.meters) k += `${S.meters[m]},`;
    k += "|";
    for (const t of reads.tallies) { const tt = S.tallies[t] || {}; k += `${Object.keys(tt).sort().map(v => `${v}=${tt[v]}`).join(";")}/`; }
    return k;
  };
  const recs = new Map();
  const mk = S => {
    const key = keyOf(S);
    let r = recs.get(key);
    if (!r) {
      if (recs.size >= MAX_STATES) throw new Error("Stage.simulate: too many states; the story reads too much state to walk");
      r = { key, S, edges: null, color: 0, ways: 0, terminal: false, ending: null, parent: null };
      recs.set(key, r);
    }
    return r;
  };
  const expand = r => {
    const S = r.S;
    r.S = null;
    const edges = [];
    const go = (S2, label) => { settle(S2, X, env); edges.push({ to: mk(S2), label, dead: false }); };
    if (S.node === "ending") { r.terminal = true; r.ending = S.ending == null ? "(dead end)" : S.ending; return edges; }
    if (S.node === "beat" || S.node === "roll" && S.rollRes) { const S2 = cloneS(S); S2.node = null; go(S2, null); }
    else if (S.node === "choice") {
      const { scene, group } = X.groups.get(split(S.cur)[1]);
      for (const { o, locked } of optionStates(S, group)) {
        if (locked) continue;
        const S2 = cloneS(S);
        const why = pick(S2, X, o.key, env);
        if (why) throw new Error(`Stage.simulate: ${scene.id}:${group.key}.${o.key}: ${why}`);
        edges.push({ to: mk(S2), label: { opt: `${group.key}.${o.key}` }, dead: false });
      }
    } else if (S.node === "input") {
      const S2 = cloneS(S);
      const o = X.options.get(split(S.cur)[1]).option;
      S2.fields[o.input.field] = "(typed)";
      S2.node = null;
      go(S2, { input: "(typed)" });
    } else if (S.node === "roll") {
      const oref = split(S.cur)[1];
      const spec = X.options.get(oref).option.roll;
      const add = addValue(S, X, spec.add);
      for (const key of reachableTiers(X.resolver, spec, add)) { // only tiers the dice can reach from this modifier
        const S2 = cloneS(S);
        applyRoll(S2, X, oref, spec, { dice: spec.dice, faces: [], add, total: 0, vs: spec.vs, result: key, used: key });
        S2.node = null;
        go(S2, { result: key });
      }
    }
    return edges;
  };

  const S0 = newState(X, 1);
  enterScene(S0, X, pack.start, env, true);
  settle(S0, X, env);
  const start = mk(S0);
  const post = [];
  let cycles = 0;
  start.color = 1; start.edges = expand(start);
  const stack = [{ r: start, i: 0 }];
  while (stack.length) {
    const top = stack[stack.length - 1], r = top.r;
    if (top.i < r.edges.length) {
      const e = r.edges[top.i++], c = e.to;
      if (c.color === 1) { e.dead = true; cycles++; continue; }
      if (c.color === 0) { c.color = 1; c.edges = expand(c); stack.push({ r: c, i: 0 }); }
    } else { r.color = 2; post.push(r); stack.pop(); }
  }
  // Count paths forward in topological order (reverse post-order).
  start.ways = 1;
  for (let i = post.length - 1; i >= 0; i--) {
    const r = post[i];
    for (const e of r.edges) if (!e.dead) e.to.ways += r.ways;
  }
  const endings = {};
  for (const id of Object.keys(X.endings)) endings[id] = 0;
  let paths = 0;
  for (const r of post) if (r.terminal) { endings[r.ending] = (endings[r.ending] || 0) + r.ways; paths += r.ways; }
  // One shortest route to each terminal state (breadth first).
  const fifo = [start];
  start.parent = false;
  for (let h = 0; h < fifo.length; h++) {
    const r = fifo[h];
    for (const e of r.edges) if (!e.dead && e.to.parent === null) { e.to.parent = { r, label: e.label }; fifo.push(e.to); }
  }
  const routes = [];
  for (const r of post.slice().reverse()) {
    if (!r.terminal) continue;
    const labels = [];
    for (let c = r; c.parent; c = c.parent.r) if (c.parent.label) labels.push(c.parent.label);
    const steps = [];
    let last = null; // the pick a roll belongs to
    for (const l of labels.reverse()) {
      if (l.opt) steps.push(last = { opt: l.opt });
      else if (l.input) steps.push({ input: l.input });
      else if (l.result && last) last.result = l.result;
    }
    routes.push({ ending: r.ending, count: r.ways, steps });
  }

  // What was never reached.
  const by = { scenes: [], beats: [], options: [], endings: [], notes: [] };
  for (const id of X.scenes.keys()) if (!seen.scenes.has(id)) by.scenes.push(id);
  for (const ref of X.beats.keys()) if (!seen.beats.has(ref)) by.beats.push(ref);
  for (const ref of X.options.keys()) if (!seen.options.has(ref)) by.options.push(ref);
  for (const id of Object.keys(X.endings)) if (!seen.endings.has(id)) by.endings.push(id);
  for (const id of Object.keys(pack.notes || {})) if (!seen.notes.has(id)) by.notes.push(id);
  const unreachable = [...by.scenes, ...by.beats, ...by.options, ...by.endings.map(id => `ending:${id}`), ...by.notes.map(id => `note:${id}`)];
  return { paths, endings, routes, unreachable, unreachableBy: by, locked: [...seen.locked].sort(), states: recs.size, cycles };
}

// ---- validate (SPEC section 2) ----
const ID = /^[A-Za-z0-9_-]+$/;
const KINDS = ["rule", "dm", "lore", "handler", "algorithm", "guide"];
const KITS = { paper: ["spread", "vfold", "parallel", "tunnel", "flap", "pulltab", "volvelle", "ticket", "plate"], feed: ["frame", "track", "scan", "log", "redact", "plate"] };
const words = s => String(s).trim().split(/\s+/).filter(Boolean).length;

// check(pack) -> { errors, warnings }. A speaker missing from cast.json is a warning while the pack has no
// cast.json (a script can be finished before its cast art) and an error once it has one.
function check(pack) {
  const errors = [], warnings = [];
  const err = (where, msg) => errors.push(`${where}: ${msg}`);
  const done = () => ({ errors, warnings });
  if (!isObj(pack)) { errors.push("pack: not an object"); return done(); }
  const str = v => typeof v === "string" && v.trim() !== "";
  const num = v => typeof v === "number" && Number.isFinite(v);

  // pack.json
  if (!str(pack.id) || !/^[a-z0-9-]+$/.test(pack.id)) err("pack.json", `id must be lower-kebab-case, not ${JSON.stringify(pack.id)}`);
  if (!str(pack.title)) err("pack.json", "title is missing");
  if (!["paper", "feed"].includes(pack.kit)) err("pack.json", `kit must be "paper" or "feed", not ${JSON.stringify(pack.kit)}`);
  if (!["ose", "fate4df"].includes(pack.resolver)) err("pack.json", `resolver must be "ose" or "fate4df", not ${JSON.stringify(pack.resolver)}`);
  if (!str(pack.storageKey) || !/^(fort-stage|htll)\.[a-z0-9.-]+$/.test(pack.storageKey)) err("pack.json", `storageKey must start with "fort-stage." or "htll.", not ${JSON.stringify(pack.storageKey)}`);
  const meterIds = new Set(), badMeters = new Set(), fieldIds = new Set(), tallyVals = new Map();
  if (!Array.isArray(pack.meters)) err("pack.json", "meters must be a list (it may be empty)");
  for (const m of list(pack.meters)) {
    const w = `pack.json meter ${m && m.id}`;
    if (!isObj(m) || !str(m.id) || !ID.test(m.id)) { err("pack.json", `a meter has a bad id: ${JSON.stringify(m)}`); continue; }
    if (meterIds.has(m.id)) err(w, "duplicate id");
    meterIds.add(m.id);
    if (!str(m.label)) err(w, "label is missing");
    if (!num(m.min) || !num(m.max) || m.min > m.max) err(w, "min and max must be numbers with min <= max");
    else if (!num(m.start) || m.start < m.min || m.start > m.max) err(w, "start must be a number between min and max");
    if (m.bad != null && typeof m.bad !== "boolean") err(w, "bad must be true or false");
    if (m.bad === true) badMeters.add(m.id);
  }
  if (!Array.isArray(pack.fields)) err("pack.json", "fields must be a list (it may be empty)");
  for (const f of list(pack.fields)) {
    if (!isObj(f) || !str(f.id) || !ID.test(f.id)) { err("pack.json", `a field has a bad id: ${JSON.stringify(f)}`); continue; }
    if (fieldIds.has(f.id)) err(`pack.json field ${f.id}`, "duplicate id");
    if (meterIds.has(f.id)) err(`pack.json field ${f.id}`, "a field and a meter share an id");
    fieldIds.add(f.id);
    if (!str(f.label)) err(`pack.json field ${f.id}`, "label is missing");
    if (f.side != null && !["front", "back"].includes(f.side)) err(`pack.json field ${f.id}`, `side must be "front" or "back", not ${JSON.stringify(f.side)}`);
    if (f.hidden != null && typeof f.hidden !== "boolean") err(`pack.json field ${f.id}`, "hidden must be true or false");
  }
  // tallies: a map of tally id to its allowed values. Never a list of ids.
  if (pack.tallies != null) {
    if (!isObj(pack.tallies)) err("pack.json", "tallies must be a map of tally id to its list of allowed values, not a list");
    else for (const [id, vals] of Object.entries(pack.tallies)) {
      if (!ID.test(id)) { err("pack.json", `tally id ${JSON.stringify(id)} is not a plain id`); continue; }
      if (!Array.isArray(vals) || !vals.length || !vals.every(v => str(v) && ID.test(v)) || new Set(vals).size !== vals.length) err("pack.json", `tally "${id}" must be a non-empty list of distinct value names`);
      else tallyVals.set(id, new Set(vals));
    }
  }
  const commentKinds = pack.commentary && Array.isArray(pack.commentary.kinds) ? pack.commentary.kinds : null;
  if (pack.commentary != null) {
    if (!isObj(pack.commentary) || !str(pack.commentary.label)) err("pack.json", "commentary.label is missing");
    if (!commentKinds || commentKinds.some(k => !KINDS.includes(k))) err("pack.json", `commentary.kinds must be a list drawn from ${KINDS.join(", ")}`);
  }

  // notes.json
  const notes = isObj(pack.notes) ? pack.notes : null;
  if (!notes) err("notes.json", "is missing or is not an object");
  for (const [id, n] of Object.entries(notes || {})) {
    const w = `notes.json ${id}`;
    if (!isObj(n)) { err(w, "must be an object"); continue; }
    if (!KINDS.includes(n.kind)) err(w, `kind must be one of ${KINDS.join(", ")}`);
    if (!str(n.term)) err(w, "term is missing");
    if (!str(n.text)) err(w, "text is missing");
    else if (words(n.text) > 60) err(w, `text has ${words(n.text)} words; the limit is 60`);
  }

  // cast.json: a person with no x, y and r has no portrait (the kit draws a placeholder); sheet is needed only if someone has a crop
  const people = pack.cast && isObj(pack.cast.people) ? pack.cast.people : null;
  if (pack.cast) {
    if (!isObj(pack.cast)) err("cast.json", "must be an object");
    else {
      if (!people) err("cast.json", "people is missing");
      let crops = 0;
      for (const [id, p] of Object.entries(people || {})) {
        if (!isObj(p) || !str(p.name)) { err(`cast.json ${id}`, "needs a name"); continue; }
        const given = ["x", "y", "r"].filter(k => p[k] != null);
        if (given.length === 3) { if (["x", "y", "r"].every(k => num(p[k]))) crops++; else err(`cast.json ${id}`, "x, y and r must be numbers"); }
        else if (given.length) err(`cast.json ${id}`, "x, y and r go together: give all three for a portrait, none for a placeholder");
      }
      if (crops) {
        if (!str(pack.cast.sheet)) err("cast.json", "sheet is missing (a person has a portrait crop)");
        if (!num(pack.cast.w) || !num(pack.cast.h)) err("cast.json", "w and h must be numbers (a person has a portrait crop)");
      } else {
        if (pack.cast.sheet != null && !str(pack.cast.sheet)) err("cast.json", "sheet must be a path");
        for (const k of ["w", "h"]) if (pack.cast[k] != null && !num(pack.cast[k])) err("cast.json", `${k} must be a number`);
      }
    }
  }

  // sets.json
  const sets = isObj(pack.sets) ? pack.sets : null;
  if (!sets) err("sets.json", "is missing or is not an object");
  for (const [id, s] of Object.entries(sets || {})) {
    const w = `sets.json ${id}`;
    if (!isObj(s)) { err(w, "must be an object"); continue; }
    if (s.kit !== pack.kit) err(w, `kit "${s.kit}" does not match the pack's kit "${pack.kit}"`);
    if (!Array.isArray(s.layers) || !s.layers.length) { err(w, "layers must be a non-empty list"); continue; }
    s.layers.forEach((l, i) => {
      const lw = `${w} layer ${i}`;
      if (!isObj(l)) return err(lw, "must be an object");
      const prims = KITS[pack.kit];
      if (prims && !prims.includes(l.prim)) err(lw, `prim "${l.prim}" is not a ${pack.kit} primitive (${prims.join(", ")})`);
      if (l.tally != null) {
        if (!tallyVals.has(l.tally)) err(lw, `tally "${l.tally}" is not in pack.tallies`);
        else if (!tallyVals.get(l.tally).has(l.value)) err(lw, `a layer bound to tally "${l.tally}" needs a value from ${[...tallyVals.get(l.tally)].join(", ")}, not ${JSON.stringify(l.value)}`);
      }
      for (const k of ["x", "y", "w", "h"]) if (l[k] != null && !(num(l[k]) && l[k] >= 0 && l[k] <= 1)) err(lw, `${k} must be a fraction from 0 to 1`);
    });
  }

  // script.json
  const script = isObj(pack.script) ? pack.script : null;
  if (!script || !Array.isArray(script.scenes) || !script.scenes.length) { err("script.json", "needs a non-empty scenes list"); return done(); }
  const endings = isObj(script.endings) ? script.endings : {};
  if (!isObj(script.endings) || !Object.keys(endings).length) err("script.json", "needs at least one ending");
  const sceneIds = new Set();
  for (const sc of script.scenes) {
    if (!isObj(sc) || !str(sc.id) || !ID.test(sc.id)) { err("script.json", `a scene has a bad id: ${JSON.stringify(sc && sc.id)}`); continue; }
    if (sceneIds.has(sc.id)) err(`scene ${sc.id}`, "duplicate id");
    sceneIds.add(sc.id);
  }
  if (!sceneIds.has(pack.start)) err("pack.json", `start "${pack.start}" is not a scene`);
  const target = id => sceneIds.has(id) || has(endings, id);

  // The card fields an input writes: no condition may read them, because typed text cannot be explored.
  const inputFields = new Set();
  for (const sc of script.scenes) for (const g of (isObj(sc) && Array.isArray(sc.choices) ? sc.choices : [])) for (const o of (isObj(g) && Array.isArray(g.options) ? g.options : [])) {
    if (isObj(o) && isObj(o.input) && str(o.input.field)) inputFields.add(o.input.field);
  }

  const checkCond = (w, c) => {
    if (!isObj(c)) return err(w, "a condition must be an object");
    const ks = ["flag", "field", "meter", "tally", "all", "any", "not"].filter(k => has(c, k));
    if (ks.length !== 1) return err(w, `a condition needs exactly one of flag, field, meter, tally, all, any, not: ${JSON.stringify(c)}`);
    const k = ks[0];
    if (k === "flag") { if (!str(c.flag)) err(w, "flag must be a name"); }
    else if (k === "field") {
      if (!fieldIds.has(c.field)) err(w, `field "${c.field}" is not in pack.fields`);
      else if (inputFields.has(c.field)) err(w, `a condition reads field "${c.field}", which an input writes; typed text cannot be explored`);

   A kit (ui/kits/<kit>.js) draws the set behind the text and plays each cue.
   The engine (Stage, from engine/stage.js) holds the rules. This file has no rules in it.

   How a step runs:   engine call -> view -> present()
     1. show the new set to the kit (so it can lay it under the old one)
     2. play the step's cues one at a time; each cue is a shell effect plus kit.cue(); wait for both
     3. sync the HUD and kit.update(state), then show the card or the next panel and start the line
   A tap during the cues skips the rest of them. Under reduced motion no animation is started.
   Text panels slide only on a `turn`; any other new panel crossfades over --m-state (MOTION.md, "beat"). The page carries window.SIM (Stage.simulate, embedded by the build) for Verify.

   Kit notes for wave 2:
     - Call order is show() then cue(): for `turn` and `shift` the kit gets the new set first and animates the swap in cue().
       After the step's last cue the shell calls update(state); it also calls update(state) after back, load, Continue and a Verify replay.
     - A tap during a cue calls the kit's finish(): jump the active cue to its end state and resolve its Promise now.
     - A kit element that should react to a tap must be a <button> or carry data-kit-hit; any other tap on the stage is "go on".
     - The engine sends `ink` and `bloom` only when the look changes (and `ink` on a reveal). The shell plays every cue it is given.
     - Map style: <html data-map="ink|blueline"> and a window "stage:map" event; the shell also calls setMap(style) if the kit has it.
     - A beat's `screen` lines: the shell calls screen(lines) if the kit has it (and screen([]) when no beat shows one),

     - The state a kit gets (show, update): meters, fields, tallies, flags, look (the look on show), revealed (a secret is open) and

     - Motion: <html data-motion="full|calm">. Calm behaves exactly as prefers-reduced-motion: reduce. A kit that decides for itself
