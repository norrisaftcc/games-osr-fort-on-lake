<script>
window.PACK = {"id":"two-in-six","title":"Two in Six","subtitle":"The elven thief","kit":"paper","resolver":"ose","start":"s0","storageKey":"fort-stage.two-in-six","meters":[{"id":"fate","label":"Fate","min":0,"max":6,"start":3,"hud":true},{"id":"turns","label":"Turns","min":0,"max":6,"start":0,"hud":true,"bad":true}],"fields":[{"id":"name","label":"Name","side":"front"},{"id":"lens","label":"The Lens","side":"front"},{"id":"yoc","label":"Year of Change","side":"front"},{"id":"office","label":"Fort Office","side":"front"},{"id":"bond","label":"Bond","side":"front"},{"id":"public","label":"Public fact","side":"front"},{"id":"secret","label":"Secret fact","side":"front"},{"id":"odds","label":"Your odds (level 2)","side":"front"},{"id":"origin","label":"Came from","side":"back"},{"id":"know","label":"You start knowing","side":"back"},{"id":"took","label":"Took from the caves","side":"back"},{"id":"stay","label":"Stays because","side":"back"},{"id":"lens1","label":"Lens 1: the iron plate","side":"back"},{"id":"lens2","label":"Lens 2: the singing Shallows","side":"back"},{"id":"summer","label":"Summer, the Year Between","side":"back"},{"id":"pen","label":"The Pen · Summer","side":"back"},{"id":"plate","label":"The plate (the book's rolls)","side":"back"},{"id":"box","label":"The iron box (the book's rolls)","side":"back"},{"id":"night","label":"The walk in the dark (the book's roll)","side":"back"},{"id":"eyeplus","label":"Locksmith's Eye, written (1 Fate)","side":"back"},{"id":"extra","label":"Kit extra","side":"back"},{"id":"cassandra","label":"Cassandra, at the milestone","side":"back"}],"tallies":{"lens":["hymn","machine"]},"commentary":{"label":"How the odds work","kinds":["dm","rule"]},"script":{"scenes":[{"id":"s0","title":"The Odds","place":"Two in Six · Before you begin","look":"paint","set":"cover","beats":[{"text":"You hold a book that plays the game with you. It rolls small, honest dice. And it shows you every chance before you choose.","kicker":"TWO IN SIX","comment":"odds-printed"},{"text":"A chance is printed like this: *2-in-6*. Or like this: *20 %*. You read it first. Then you pick. Nothing is hidden. The book uses your level-2 odds throughout. The Year One scene uses them too."},{"text":"Some picks need no roll at all. The book always offers one. The playbook says it: *make a plan that still works if the roll fails*.","comment":"plans"},{"text":"You play the elven thief, level 2: *The One Who Opens*. Last year you went into the Gorgon Caves behind the others and came out ahead of them. Five short scenes follow.","kicker":"WHO YOU PLAY","notes":["thief"]},{"text":"Some pages are *paint*: the Fort sees what you do. Some are *ink*: only you know. The page says which.","notes":["register"]},{"text":"Old things show at the edge. Read each one as *hymn*, or as *machine*. Neither is wrong. The book will follow you.","notes":["lens"],"comment":"dm-follows"},{"text":"The margin keeps two counts. *Fate* starts at three. *Turns* counts the minutes in a dungeon, ten at a time. It starts at none.","notes":["fate"]},{"text":"At the end you carry away a Fort Card. Every choice writes one line on it. First, write the name the Fort calls you. This is Planning: it is free, and you can change it.","kicker":"BEFORE THE FIRST PAGE","notes":["card","planning"],"comment":"dm-writes"}],"choices":[{"key":"name","ask":"What does the Fort call you?","gate":"plan","options":[{"key":"a","label":"Write your name","sub":"Typed. It goes on your card.","input":{"field":"name","prompt":"Write your name, as the Fort writes it.","max":60}}]}],"next":"s1"},{"id":"s1","title":"The Squeeze","place":"Year One · the Gorgon Caves, behind the Garden of Stone","look":"ink","set":"crack","beats":[{"text":"Last year. The Gorgon Caves.","kicker":"YEAR ONE"},{"text":"The others stand in the Garden of Stone and argue about who walks first. In the torchlight the stone deer looks as if it breathes. You are not with them. You found the crack in the north wall an hour ago."},{"text":"It is a long squeeze. Cold air comes up it from somewhere below."},{"text":"Halfway down, the crack ends at a plate of old iron set into the rock. It has no keyhole. It has a ring of small glass eyes, and one of them is lit, faint as a coal. When you breathe on it, something inside the plate clicks once.","set":"plate"},{"text":"This is not the first wall you have slipped through. And you will not come out of these caves with empty pockets."}],"choices":[{"key":"lens1","ask":"What is the plate?","gate":"plan","options":[{"key":"a","label":"A ward. Old words keep it shut, and the lit eye is its watchman.","sub":"Lens: hymn","effects":[{"tally":"lens","add":"hymn"},{"set":{"lens1":"A ward (hymn)"}}],"then":[{"text":"You whisper an apology to it, as you would to any old door. It clicks again, softer."},{"text":"Until now you have only looked and thought. That is Planning, and it is free. Now the book prints the odds, and you pick. In a dungeon every act takes time, and the margin counts it.","kicker":"EXECUTION","comment":"turn-clock","notes":["under6","percent"]}]},{"key":"b","label":"A lock. The eye is how it reads a key, and your breath was nearly the right one.","sub":"Lens: machine","effects":[{"tally":"lens","add":"machine"},{"set":{"lens1":"A lock (machine)"}}],"then":[{"text":"You count the click, and the pause after it. A lock that counts can be counted back.","notes":["reveal"]},{"text":"A lock with no keyhole reads its key some other way. The lit eye is the reader. Watch what makes it click, and you have learned how it reads. You have not yet tested one.","kicker":"REFEREE NOTE · LEAN IN","reveal":true,"comment":"dm-follows","when":{"all":[{"tally":"lens","top":"machine"},{"not":{"tally":"lens","top":"hymn"}}]}},{"text":"Until now you have only looked and thought. That is Planning, and it is free. Now the book prints the odds, and you pick. In a dungeon every act takes time, and the margin counts it.","kicker":"EXECUTION","comment":"turn-clock","notes":["under6","percent"]}]}]},{"key":"plate","ask":"The plate is under your hand. What do you do?","gate":"exec","notes":["gate"],"comment":"dm-rolls","options":[{"key":"lock","label":"Work the plate with your tools.","sub":"Sealed. Open Locks 20 %: roll 1d100, 20 or under. One try. 1 turn.","effects":[{"meter":"turns","add":1},{"flag":"plate_done"}],"then":[{"text":"You take your tools from their oilcloth. The lit eye watches your hands."}],"roll":{"dice":"1d100","under":true,"vs":20,"results":{"fail":{"effects":[{"set":{"plate":"Open Locks 20 %: failed. That lock beats you until you gain a level."}}],"then":[{"text":"The pick slips. The plate clicks once, harder, and the lit eye goes dark for the length of a breath. That lock has beaten you, until you gain a level. You back out the way you came."}]},"success":{"effects":[{"set":{"plate":"Open Locks 20 %: it opened. You shut it again."}}],"then":[{"text":"The pick finds the catch, and the plate gives a finger's width. Cold air breathes out, smelling of wet iron. Behind it, dark. You shut it again. The eye lights, as if nothing happened. You back out the way you came."}]}}}},{"key":"listen","label":"Listen at the plate first.","sub":"Sealed. Hear noise 2-in-6: roll 1d6, 2 or under. 1 turn.","effects":[{"meter":"turns","add":1}],"then":[{"text":"You put your ear to the iron and hold your breath."}],"roll":{"dice":"1d6","under":true,"vs":2,"results":{"fail":{"then":[{"text":"You hear your own blood, and the drip of water. Nothing else."}]},"success":{"effects":[{"flag":"heard"}],"then":[{"text":"Behind the click there is a pause. Behind the pause, a count. You hold it in your head."}]}}}},{"key":"search","label":"Search the crack for another way.","sub":"Sealed. An elf's search, 2-in-6: roll 1d6, 2 or under. 1 turn.","effects":[{"meter":"turns","add":1}],"then":[{"text":"You run your fingers along the rock, slowly."}],"roll":{"dice":"1d6","under":true,"vs":2,"results":{"fail":{"then":[{"text":"Rock, and rock, and more rock."}]},"success":{"effects":[{"flag":"found"}],"then":[{"text":"Beside the plate, behind a flake of rock, there is a seam a hand wide. It goes down. You mark it with chalk, where only you will see it."}]}}}},{"key":"wait","label":"Wait for the others. Make a plan.","sub":"Sealed. No roll. 2 turns. Patience earns 1 Fate.","effects":[{"meter":"turns","add":2},{"meter":"fate","add":1},{"flag":"plate_done"},{"set":{"plate":"Waited two turns, planned, and left the plate alone. 1 Fate for patience."}}],"then":[{"text":"You go back up and wait in the dark until the others stop arguing. You tell them about the plate. They have three plans, and none of them is good. Nobody opens anything. The plate can wait, and so can you."},{"text":"The book counts two turns. It gives you a Fate point for them. Then you back out the way you came.","comment":"patient"}]}]},{"key":"wander1","ask":"Two turns have gone. The book checks the dark.","gate":"exec","notes":["wander"],"options":[{"key":"a","label":"Let the book check for wandering monsters.","sub":"Sealed. 1-in-6: roll 1d6. On a 1, something comes by.","when":{"all":[{"meter":"turns","gte":2},{"not":{"flag":"wc1"}}]},"effects":[{"flag":"wc1"}],"roll":{"dice":"1d6","table":true,"results":{"1":{"then":[{"text":"Something passes in the dark beyond the rock: slow, large, not looking for you. You press yourself against the rock and do not breathe. Far off, a chick cries once, thin and high. The slow sound stops, and does not start again.","notes":["biddy"]}],"label":"Something comes"},"2-6":{"then":[{"text":"The dark stays quiet. Water drips somewhere below."}],"label":"The dark is quiet"}}}}]},{"key":"plate2","ask":"A turn has gone. The plate has not changed. What now?","gate":"exec","comment":"counted","options":[{"key":"lock20","label":"Try the lock.","sub":"Sealed. Open Locks 20 %: roll 1d100, 20 or under. One try. 1 turn.","when":{"all":[{"not":{"flag":"plate_done"}},{"not":{"flag":"heard"}}]},"effects":[{"meter":"turns","add":1},{"flag":"plate_done"}],"then":[{"text":"You take your tools from their oilcloth. The lit eye watches your hands."}],"roll":{"dice":"1d100","under":true,"vs":20,"results":{"fail":{"effects":[{"set":{"plate":"Open Locks 20 %: failed. That lock beats you until you gain a level."}}],"then":[{"text":"The pick slips. The plate clicks once, harder, and the lit eye goes dark for the length of a breath. That lock has beaten you, until you gain a level. You back out the way you came."}]},"success":{"effects":[{"set":{"plate":"Open Locks 20 %: it opened. You shut it again."}}],"then":[{"text":"The pick finds the catch, and the plate gives a finger's width. Cold air breathes out, smelling of wet iron. Behind it, dark. You shut it again. The eye lights, as if nothing happened. You back out the way you came."}]}}}},{"key":"lock40","label":"Try the lock, counting the clicks.","sub":"Sealed. Open Locks 40 %: 20, and 20 for the count. Roll 1d100, 40 or under. One try. 1 turn.","when":{"all":[{"not":{"flag":"plate_done"}},{"flag":"heard"}]},"effects":[{"meter":"turns","add":1},{"flag":"plate_done"}],"then":[{"text":"You take your tools from their oilcloth. This time you know the count."}],"roll":{"dice":"1d100","under":true,"vs":40,"results":{"fail":{"effects":[{"set":{"plate":"Open Locks 40 %, with the count: failed. That lock beats you until you gain a level."}}],"then":[{"text":"The pick slips. The plate clicks once, harder, and the lit eye goes dark for the length of a breath. That lock has beaten you, until you gain a level. You back out the way you came."}]},"success":{"effects":[{"set":{"plate":"Open Locks 40 %, with the count: it opened. You shut it again."}}],"then":[{"text":"The pick finds the catch, and the plate gives a finger's width. Cold air breathes out, smelling of wet iron. Behind it, dark. You shut it again. The eye lights, as if nothing happened. You back out the way you came."}]}}}},{"key":"leave1","label":"Leave the plate and the seam, and back out.","sub":"Sealed. No roll. No turn.","when":{"all":[{"not":{"flag":"plate_done"}},{"flag":"found"}]},"effects":[{"flag":"plate_done"},{"set":{"plate":"Found a seam beside the plate, chalked it, and left the plate alone."}}],"then":[{"text":"You leave the plate alone, and the seam too. The chalk will keep them for another day. You back out the way you came."}]},{"key":"leave2","label":"Leave the plate and back out.","sub":"Sealed. No roll. No turn.","when":{"all":[{"not":{"flag":"plate_done"}},{"not":{"flag":"found"}}]},"effects":[{"flag":"plate_done"},{"set":{"plate":"Left the plate alone."}}],"then":[{"text":"You leave the plate alone. It clicks once more as you go. You back out the way you came."}]}]},{"key":"wander2","ask":"Two turns have gone. The book checks the dark.","gate":"exec","notes":["wander"],"options":[{"key":"a","label":"Let the book check for wandering monsters.","sub":"Sealed. 1-in-6: roll 1d6. On a 1, something comes by.","when":{"all":[{"meter":"turns","gte":2},{"not":{"flag":"wc1"}}]},"effects":[{"flag":"wc1"}],"roll":{"dice":"1d6","table":true,"results":{"1":{"then":[{"text":"Something passes in the dark beyond the rock: slow, large, not looking for you. You press yourself against the rock and do not breathe. Far off, a chick cries once, thin and high. The slow sound stops, and does not start again.","notes":["biddy"]}],"label":"Something comes"},"2-6":{"then":[{"text":"The dark stays quiet. Water drips somewhere below."}],"label":"The dark is quiet"}}}}]},{"key":"origin","ask":"On the climb out you think of the road that brought you here. Before the Fort, where did you come from?","gate":"plan","options":[{"key":"a","label":"The coast.","sub":"Writes: Year One, and what you start knowing","effects":[{"set":{"origin":"The coast. Smuggler: Harrow nods to you and says nothing; Maren counts the stores after you visit.","know":"Who on the coast buys Fort goods with no questions asked, and what they pay for a cockatrice egg."}}],"then":[{"text":"You came up from the fishing village in the bottom of old Harrow's cart, under the dried fish. You owed money on the coast. You still do. The sum has grown.","set":"crack","notes":["reveal"]},{"text":"Who on the coast buys Fort goods with no questions asked, and what they pay for a cockatrice egg.","kicker":"YOU START KNOWING","reveal":true,"comment":"dm-hides"}]},{"key":"b","label":"The old foundations in the forest.","sub":"Writes: Year One, and what you start knowing","effects":[{"set":{"origin":"The old foundations in the forest. Ghost: the children say you can walk through the palisade. You cannot. You know where it is weak.","know":"One way over the palisade that does not use the Gate. It is not a gap. It is better than a gap."}}],"then":[{"text":"Your people left the wood long ago. You did not. You lived alone in the stone footings deep in the trees, and you came to the Fort for salt. You stayed for the caves.","set":"crack","notes":["reveal"]},{"text":"One way over the palisade that does not use the Gate. It is not a gap. It is better than a gap.","kicker":"YOU START KNOWING","reveal":true,"comment":"dm-hides"}]},{"key":"c","label":"A file at Mile-House 13.","sub":"Writes: Year One, and what you start knowing","effects":[{"set":{"origin":"A file at Mile-House 13. Wanted, politely. The Fort finds this funny. You find it useful.","know":"The day of the week the agents walk the Old Road, and the name they think is yours."}}],"then":[{"text":"The Bureau of Imperial Anomalies has a file on you. It says: Elf. Anomalous. Light of finger. The two Junior Men in Red who carry it are polite, and they have your description wrong.","set":"crack","notes":["reveal"]},{"text":"The day of the week the agents walk the Old Road, and the name they think is yours.","kicker":"YOU START KNOWING","reveal":true,"comment":"dm-hides"}]}]},{"key":"took","ask":"You are out of the crack, and the book stops counting turns. What did you take from the Gorgon Caves?","gate":"plan","options":[{"key":"a","label":"A ward-eye.","sub":"Writes: Gear","effects":[{"set":{"took":"A ward-eye. It went cold when the wards went dark. Some nights it is warm again."}},{"meter":"turns","add":-6}],"then":[{"text":"A glass eye the size of a plum, prised from the Queen's wards. It went cold when the wards went dark. Some nights it is warm again."},{"text":"You come out ahead of the others. Your hands are full. Your face is empty."}]},{"key":"b","label":"A key that fits nothing.","sub":"Writes: Gear","effects":[{"set":{"took":"A bronze key that fits nothing. Yet."}},{"meter":"turns","add":-6}],"then":[{"text":"Bronze, as long as your finger, from a niche nobody else saw. You have tried it in every lock at the Fort. You have not tried it in every lock in the world."},{"text":"You come out ahead of the others. Your hands are full. Your face is empty."}]},{"key":"c","label":"Nothing.","sub":"Writes: Gear","effects":[{"set":{"took":"Nothing, and everyone believed you. Except Wick."}},{"meter":"turns","add":-6}],"then":[{"text":"You came out with empty hands, and everyone believed you. Except Wick. Wick counts everything. He has not said what he counted."},{"text":"You come out ahead of the others, hands full of nothing, face empty."}]}]}],"next":"s2"},{"id":"s2","title":"Summer: The Pen","place":"The Year Between · Summer","look":"paint","set":"pen-summer","beats":[{"text":"The Year Between. The druid held the Pen in Spring. In Summer it was yours.","kicker":"THE YEAR BETWEEN","notes":["year-between","pen"]},{"text":"You kept the Fort's book. Each night you wrote down what the Fort had done that day, in a small, neat hand. Wick said you must have forged it."},{"text":"The lake was low and warm. The Tin Dozen came up the road twice for salt, rattling in their old tin, and paid in coin that was nearly good. After dark the Shallows sang: one long note under the water, every night at the same hour. You wrote the hour in the margin each night. It never moved by more than a minute.","notes":["tin-dozen"]},{"text":"By the time you passed the Pen to the cleric, you were not the same."}],"choices":[{"key":"lens2","ask":"What do you write beside the hour?","gate":"plan","options":[{"key":"a","label":"“Spirits of the lake. They keep their own hours.”","sub":"Lens: hymn","effects":[{"tally":"lens","add":"hymn"},{"set":{"lens2":"Spirits (hymn)"}}],"then":[{"text":"Wick reads it over your shoulder and nods, as if he knew all along."}]},{"key":"b","label":"“A signal. Something under the water keeps time.”","sub":"Lens: machine","effects":[{"tally":"lens","add":"machine"},{"set":{"lens2":"A signal (machine)"}}],"then":[{"text":"Wick reads it over your shoulder, and from that night he times it too.","notes":["reveal"]},{"text":"A signal that keeps one hour can be tested. Time it against a bell for a month. If it never drifts, something is keeping it. You have written the hour down. That is the start of a test.","kicker":"REFEREE NOTE · LEAN IN","reveal":true,"comment":"dm-follows","when":{"all":[{"tally":"lens","top":"machine"},{"not":{"tally":"lens","top":"hymn"}}]}}]}]},{"key":"summer","ask":"You held the Pen. What did the Fort do with its Summer?","gate":"plan","notes":["harrow"],"options":[{"key":"a","label":"A. The Tin Dozen","sub":"Leaves a tag on the Fort","effects":[{"set":{"summer":"A. The Tin Dozen — Oath: Tin Dozen"}}],"then":[{"text":"You gave the Tin Dozen a page of their own in the Fort's book."},{"text":"Tag on the Fort: Oath. The Tin Dozen.","kicker":"THE FORT'S BOOK","notes":["fort-tags"],"comment":"dm-writes"}]},{"key":"b","label":"B. Harrow's Wagons","sub":"Leaves a tag on the Fort","effects":[{"set":{"summer":"B. Harrow's Wagons — Want: iron"}}],"then":[{"text":"You gave Harrow's wagons a page of their own in the Fort's book."},{"text":"Tag on the Fort: Want. Iron.","kicker":"THE FORT'S BOOK","notes":["fort-tags"],"comment":"dm-writes"}]},{"key":"c","label":"C. The Lamplighter","sub":"Leaves a tag on the Fort","effects":[{"set":{"summer":"C. The Lamplighter — Oath: Wick"}}],"then":[{"text":"You gave Wick, the Lamplighter, a page of his own in the Fort's book."},{"text":"Tag on the Fort: Oath. Wick.","kicker":"THE FORT'S BOOK","notes":["fort-tags"],"comment":"dm-writes"}]}]},{"key":"yoc","ask":"What changed in you? (Year of Change)","gate":"plan","notes":["yoc"],"comment":"bonus","options":[{"key":"a","label":"Locksmith's Eye","sub":"Once per room, ask the DM one question about a lock or a trap. The answer is true. (Proposed)","effects":[{"flag":"eye"},{"set":{"yoc":"Locksmith's Eye. Once per room, ask the DM one question about a lock or a trap. The answer is true. (Proposed; the DM confirms.)","odds":"CS 88 TR 15 HN 2-in-6 HS 15 MS 25 (45 with Quiet Feet) OL 20 PP 25 · Search 2-in-6 (elf) · Backstab +4, ×2"}}],"then":[{"text":"You took apart every lock in the Fort that Summer, and put each one back better than you found it."}]},{"key":"b","label":"Quiet Feet","sub":"Move Silently +20%: 25 % becomes 45 %. Old stone never gives you away. (Proposed)","effects":[{"flag":"quiet_feet"},{"set":{"yoc":"Quiet Feet. Move Silently +20% (45% at level 2). Old stone never gives you away: no loose flag, no grating step. (Proposed; the DM confirms.)","odds":"CS 88 TR 15 HN 2-in-6 HS 15 MS 45 (Quiet Feet) OL 20 PP 25 · Search 2-in-6 (elf) · Backstab +4, ×2"}}],"then":[{"text":"You walked the walls every night, until the old stones knew your step and stopped telling anyone."}]},{"key":"c","label":"Fence","sub":"Trade directives roll +1 at a Fort Turn. Loot sells for 10% more. (Proposed)","effects":[{"flag":"fence"},{"set":{"yoc":"Fence. Trade directives roll +1 at a Fort Turn. Loot sells for 10% more. (Proposed; the DM confirms.)","odds":"CS 88 TR 15 HN 2-in-6 HS 15 MS 25 (45 with Quiet Feet) OL 20 PP 25 · Search 2-in-6 (elf) · Backstab +4, ×2"}}],"then":[{"text":"You sold the Fort's surplus to the Tin Dozen and the river traders, and got more for it than anyone thought there was."}]}]},{"key":"pen","ask":"The Pen is yours. What do you write in the Fort's book?","gate":"plan","options":[{"key":"a","label":"Write one line in the Fort's book","sub":"Typed. It goes on your card.","input":{"field":"pen","prompt":"Write one thing you wrote in Summer that is still true at the Fort.","max":200}}]}],"next":"s3"},{"id":"s3","title":"Salt for a Box","place":"Late Summer · the Gate","look":"ink","set":"salt","beats":[{"text":"Late Summer. The Tin Dozen are at the Gate again: twelve deserters in tin, wanting salt.","kicker":"LATE SUMMER"},{"text":"This time the sergeant has no coin. He sets a small iron box on the salt scale instead. It is locked. He says nobody has the key, and he says it too fast."},{"text":"You price the salt ten in the hundred above the Gate's rate, and the sergeant pays it, and curses.","when":{"flag":"fence"}},{"text":"Wick counts the salt sacks twice and frowns at the box. Across the yard, at the Shrine door, Cassandra watches you look at the lock.","notes":["wick","cassandra"]},{"text":"You can open it at the Gate, with the whole yard watching. Or you can take it home and open it alone, after dark. The Gate sees. The dark does not."}],"choices":[{"key":"reg","ask":"Do you let them see?","gate":"exec","comment":"sure","options":[{"key":"a","label":"Open it at the Gate, with the whole yard watching.","sub":"Sealed. Witnessed: paint, and a public fact.","effects":[{"flag":"witnessed"}],"then":[{"text":"Witnessed. The Fort will see what your hands can do, and what is in the box.","look":"paint","when":{"flag":"witnessed"}}]},{"key":"b","label":"Buy the box with your own salt, and open it alone after dark.","sub":"Sealed. Unwitnessed: ink, and a secret fact.","effects":[{"flag":"unwitnessed"}],"then":[{"text":"Unwitnessed. Nobody will see what is inside, or what you do with it.","look":"ink","when":{"flag":"unwitnessed"}},{"text":"After dark you carry the box to the loft over the storehouse. To reach it, you must cross the yard under Wick's lamps.","look":"ink","when":{"flag":"unwitnessed"}}]}]},{"key":"sneak","ask":"Can you cross the yard unheard?","gate":"exec","comment":"hidden-roll","options":[{"key":"a","label":"Cross the yard.","sub":"Sealed. Move Silently 25 %: roll 1d100, 25 or under.","when":{"all":[{"flag":"unwitnessed"},{"not":{"flag":"quiet_feet"}}]},"roll":{"dice":"1d100","under":true,"vs":25,"results":{"fail":{"effects":[{"flag":"wick_heard"},{"set":{"night":"Heard. You thought it worked. Wick counted your steps."}}],"then":[{"text":"You cross the yard like water. You are sure nobody heard.","look":"ink","when":{"flag":"unwitnessed"}},{"text":"A rung of the loft ladder spoke under your hand. Wick's lamp-pole stopped for a count of three, and went on. He did not call out.","look":"ink","when":{"flag":"unwitnessed"},"kicker":"REFEREE NOTE","reveal":true,"comment":"dm-secrets"}]},"success":{"effects":[{"set":{"night":"Unheard."}}],"then":[{"text":"You cross the yard like water. Nobody hears.","look":"ink","when":{"flag":"unwitnessed"}}]}}}},{"key":"b","label":"Cross the yard, on Quiet Feet.","sub":"Sealed. Move Silently 45 %: 25, and 20 for Quiet Feet. Roll 1d100, 45 or under.","when":{"all":[{"flag":"unwitnessed"},{"flag":"quiet_feet"}]},"roll":{"dice":"1d100","under":true,"vs":45,"results":{"fail":{"effects":[{"flag":"wick_heard"},{"set":{"night":"Heard, even on Quiet Feet. You thought it worked. Wick counted your steps."}}],"then":[{"text":"You cross the yard like water. You are sure nobody heard.","look":"ink","when":{"flag":"unwitnessed"}},{"text":"A rung of the loft ladder spoke under your hand. Old stone keeps your secrets. Old wood does not. Wick's lamp-pole stopped for a count of three, and went on.","look":"ink","when":{"flag":"unwitnessed"},"kicker":"REFEREE NOTE","reveal":true,"comment":"dm-secrets"}]},"success":{"effects":[{"set":{"night":"Unheard, on Quiet Feet."}}],"then":[{"text":"You cross the yard like water. Old stone says nothing. Nobody hears.","look":"ink","when":{"flag":"unwitnessed"}}]}}}}]},{"key":"lock","ask":"The lock is small and worn. What do you do about it?","gate":"exec","comment":"plan-cost","options":[{"key":"pick","label":"Pick the lock.","sub":"Sealed. Open Locks 20 %: roll 1d100, 20 or under. One try.","then":[{"text":"You take your tools from their oilcloth. The yard goes quiet.","look":"paint","when":{"flag":"witnessed"}},{"text":"You take your tools from their oilcloth. The candle shakes with your breath.","look":"ink","when":{"flag":"unwitnessed"}}],"roll":{"dice":"1d100","under":true,"vs":20,"results":{"fail":{"effects":[{"flag":"box_failed"},{"set":{"box":"Open Locks 20 %: failed. That lock beats you until you gain a level."}}],"then":[{"text":"The pick slips. The yard sighs. That lock has beaten you, until you gain a level, and everyone saw.","look":"paint","when":{"flag":"witnessed"}},{"text":"The pick slips. The lock snaps shut harder than before. That lock has beaten you, until you gain a level. Nobody saw.","look":"ink","when":{"flag":"unwitnessed"}}]},"success":{"effects":[{"set":{"box":"Picked it. Open Locks 20 %."}}],"then":[{"text":"The lock turns. The lid lifts. The yard leans in.","look":"paint","when":{"flag":"witnessed"}},{"text":"The lock turns. The lid lifts. You are the only one who looks.","look":"ink","when":{"flag":"unwitnessed"}}]}}}},{"key":"eye","label":"Use Locksmith's Eye: ask the DM one question about the lock.","sub":"Sealed. No roll. Once per room. The answer is true.","when":{"flag":"eye"},"effects":[{"flag":"eye_used"},{"set":{"box":"Locksmith's Eye. No roll: the lock is a decoy, and the hinge pins are soft tin."}}],"then":[{"text":"You ask how the box opens. The DM answers, and the answer is true: the lock is a decoy. The hinge pins are soft tin. A thumb will push them out."},{"text":"You push the pins out with your thumb. The lid lifts. The yard leans in.","look":"paint","when":{"flag":"witnessed"}},{"text":"You push the pins out with your thumb. The lid lifts. You are the only one who looks.","look":"ink","when":{"flag":"unwitnessed"}}]},{"key":"pins","label":"Take the hinge pins out instead.","sub":"Sealed. No roll. It takes an hour. In the open the count stops; in a dungeon an hour would be six turns.","when":{"not":{"flag":"eye"}},"effects":[{"set":{"box":"Hinge pins, the long way. No roll. It took an hour."}}],"then":[{"text":"You work at the pins with your thin bar while the yard watches. They are soft tin, as the Tin Dozen make everything. It takes an hour. The lid lifts.","look":"paint","when":{"flag":"witnessed"}},{"text":"You work at the pins with your thin bar, by candle. They are soft tin, as the Tin Dozen make everything. It takes an hour. The lid lifts.","look":"ink","when":{"flag":"unwitnessed"}}]}]},{"key":"fallback","ask":"The lock has beaten you. Your plan has not.","gate":"exec","options":[{"key":"a","label":"Fall back on the hinge pins.","sub":"Sealed. No roll. It takes an hour.","when":{"flag":"box_failed"},"effects":[{"set":{"box":"Open Locks 20 %: failed. Then the hinge pins. No roll. It took an hour."}}],"then":[{"text":"You work at the pins with your thin bar while the yard watches. They are soft tin. The lock beat you. The hinges do not. It takes an hour, and the lid lifts.","look":"paint","when":{"flag":"witnessed"}},{"text":"You work at the pins with your thin bar, by candle. They are soft tin. The lock beat you. The hinges do not. It takes an hour, and the lid lifts.","look":"ink","when":{"flag":"unwitnessed"}}]}]},{"key":"eyeask","ask":"You used Locksmith's Eye. You may spend 1 Fate to write part of the answer. Do you?","gate":"plan","options":[{"key":"a","label":"Yes. Write part of the answer.","sub":"Next: costs 1 Fate","when":{"flag":"eye_used"},"effects":[{"flag":"want_plus"}]},{"key":"b","label":"No. The answer is enough.","sub":"Keeps your Fate","when":{"flag":"eye_used"}}]},{"key":"eyeplus","ask":"What do you add to the answer?","gate":"fate","cost":{"meter":"fate","n":1},"notes":["eye-fate"],"options":[{"key":"a","label":"…and the sergeant has the real key on a cord round his neck. He lied.","sub":"Costs 1 Fate. You write a true thing.","when":{"flag":"want_plus"},"effects":[{"set":{"eyeplus":"The sergeant has the real key on a cord round his neck. He lied."}}],"then":[{"text":"You add it, and the DM must use it. The sergeant's hand goes to his neck. Half the yard sees him do it.","look":"paint","when":{"flag":"witnessed"}},{"text":"You add it, and the DM must use it. The sergeant's hand will go to his neck, the next time he sees you.","look":"ink","when":{"flag":"unwitnessed"}}]},{"key":"b","label":"…and the lock is newer than the box. Someone locked it last winter.","sub":"Costs 1 Fate. You write a true thing.","when":{"flag":"want_plus"},"effects":[{"set":{"eyeplus":"The lock is newer than the box. Someone locked it last winter."}}],"then":[{"text":"You add it, and the DM must use it. Someone locked this box last winter. You do not yet know who."}]}]},{"key":"fact3p","ask":"Write one thing the whole Fort now knows about you, since that day.","gate":"plan","notes":["facts"],"comment":"dm-asks","options":[{"key":"a","label":"Write what the whole Fort now knows","sub":"Public fact. Typed.","when":{"flag":"witnessed"},"input":{"field":"public","prompt":"Write one thing the whole Fort now knows about you, since that day.","max":200}}]},{"key":"fact3s","ask":"Write one true thing that only you know. It may be about you, or about what the box held.","gate":"plan","notes":["facts"],"comment":"dm-asks","options":[{"key":"a","label":"Write what only you know","sub":"Secret fact. Typed.","when":{"flag":"unwitnessed"},"input":{"field":"secret","prompt":"Write one true thing that only you know. It may be about you, or about what the box held.","max":200}}]}],"next":"s4"},{"id":"s4","title":"Maren's Last Muster","place":"Autumn · the yard","look":"paint","set":"muster","beats":[{"text":"Autumn. Captain Maren is retiring, and she wants the Fort in order before she goes.","kicker":"AUTUMN"},{"text":"She calls the muster in the yard. The Paladin stands at the Gate. The Minister stands at Maren's left hand and does not look at her. From the Beast Pen, Biddy watches the crowd with one cold eye.","notes":["biddy"]},{"text":"Wick catches your eye across the yard. He holds up three fingers, and says nothing.","when":{"flag":"wick_heard"},"comment":"secret-roll-later"},{"text":"Maren reads four offices off a slate: Warden, Scout, Steward, Lorekeeper. The Fort keeps its own book now, and its own tracks: Stores, Walls, Folk, Lamp. Each office keeps one of them honest.","notes":["office"]},{"text":"She comes to you last. “You could have left any morning this year,” she says. “You didn't. You have walked every wall here at night, too. Don't tell me you haven't. Pick one.”"}],"choices":[{"key":"stay","ask":"A thief can leave any place by morning. Why do you stay?","gate":"plan","options":[{"key":"a","label":"Wick counted you.","sub":"Writes: Year One","effects":[{"set":{"stay":"Wick counted you. Your name is on his list of the Fort's folk."}}],"then":[{"text":"When Wick wrote the list of the Fort's folk, he wrote your name on it. Nobody has listed you as belonging anywhere before."}]},{"key":"b","label":"Maren gave you a key.","sub":"Writes: Year One","effects":[{"set":{"stay":"Maren gave you the storehouse key. You want to give it back to her yourself."}}],"then":[{"text":"In the Year Between the Captain gave you the key to the storehouse. She did not ask you to promise anything. That is why you have kept it. She retires soon. You want to give it back to her yourself."}]},{"key":"c","label":"There is a city under the lake.","sub":"Writes: Year One","effects":[{"set":{"stay":"There is a city under the lake, and cities have doors."}}],"then":[{"text":"People say a city lies drowned under the Deep. Cities have doors. You have never met a door you could leave alone."}]}]},{"key":"office","ask":"Which office do you take?","gate":"plan","options":[{"key":"a","label":"Warden","sub":"Writes: Fort Office","effects":[{"set":{"office":"Warden. Walls +1 when you take the Defend directive."}}],"then":[{"text":"You know where the walls are weak. You found every gap by using it."}]},{"key":"b","label":"Scout","sub":"Writes: Fort Office","effects":[{"set":{"office":"Scout. One extra clue per hex you explore."}}],"then":[{"text":"You were already out there. Now it is your job."}]},{"key":"c","label":"Steward","sub":"Writes: Fort Office","effects":[{"set":{"office":"Steward. You see the Fort's tracks (Stores, Walls, Folk, Lamp) before the DM reports them."}}],"then":[{"text":"You kept the book in Summer. You know what is in the stores, to the sack."}]},{"key":"d","label":"Lorekeeper","sub":"Writes: Fort Office","effects":[{"set":{"office":"Lorekeeper. One free hint per puzzle."}}],"then":[{"text":"Locks are puzzles. So is most of the rest."}]}]},{"key":"fact4","ask":"Maren says one more thing about you, loud enough for the whole yard. Everyone hears it. Write it.","gate":"plan","notes":["facts"],"comment":"dm-asks","options":[{"key":"a","label":"Write what Maren says","sub":"Public fact. Typed.","when":{"flag":"unwitnessed"},"input":{"field":"public","prompt":"Maren says one more thing about you, loud enough for the whole yard. Everyone hears it. Write it.","max":200}}]}],"next":"s5"},{"id":"s5","title":"The Night Before the Road","place":"The night before · the loft","look":"ink","set":"loft","beats":[{"text":"Night. The Fort sleeps, except for Wick, who walks the wall with his lamp-pole and counts the lamps.","kicker":"NIGHT","notes":["wick"]},{"text":"You lay your kit out on a blanket in the loft and count it twice: the short sword, the bow, the two daggers, the tools in their oilcloth. Before dawn you will walk out on the Old Road. You do not know yet why. You only know you will.","notes":["road"]},{"text":"Somebody here is tied to you.","notes":["bond"]}],"choices":[{"key":"bond","ask":"Who is your bond?","gate":"plan","options":[{"key":"a","label":"The Elf Cleric","sub":"Mutual if their card names you","effects":[{"set":{"bond":"The Elf Cleric: The cleric knows what I took in Summer, and said nothing."}}],"then":[{"text":"The cleric found out what you took in Summer, and said nothing to anyone."}]},{"key":"b","label":"The Gnome Druid","sub":"Mutual if their card names you","effects":[{"set":{"bond":"The Gnome Druid: The druid and I argue about which of us is quieter. Nobody has won."}}],"then":[{"text":"Nobody hears either of you coming. You have argued about which of you is quieter. Nobody has won."}]},{"key":"c","label":"Cassandra","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"Cassandra: Cassandra knows a true thing about my past that she should not."}}],"then":[{"text":"She once told you a true thing about your past that nobody at the Fort could know."}]},{"key":"d","label":"Wick","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"Wick: Wick counts everything, me included. I cannot fool him, and I keep trying."}}],"then":[{"text":"He counts everything, you included. The one person at the Fort you cannot fool, and the one you most want to."}]},{"key":"e","label":"The Paladin","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"The Paladin: The Paladin holds the Gate. I know three other ways in, and have not said so."}}],"then":[{"text":"The Paladin holds the Gate. You know three other ways in. You have not said so. Not yet."}]},{"key":"f","label":"Captain Maren","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"Captain Maren: Maren gave me work once, and I did it. I owe her before she retires."}}],"then":[{"text":"Maren gave you work once, and you did it. She counts the stores anyway. You owe her before she retires."}]},{"key":"g","label":"The Minister","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"The Minister: The Minister pays me to watch the Shrine at night. Neither of us says why."}}],"then":[{"text":"The Minister pays you to watch the Shrine at night. Neither of you says why."}]},{"key":"h","label":"The Glamourist","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"The Glamourist: I lost a bet to the Glamourist. She has not said what I owe."}}],"then":[{"text":"You lost a bet to the Glamourist at midsummer. She has not yet said what you owe."}]},{"key":"i","label":"Biddy","sub":"A bond with a person of the Fort","effects":[{"set":{"bond":"Biddy: Biddy lets me into the Beast Pen. Nobody else gets that."}}],"then":[{"text":"Biddy lets you into the Beast Pen. Nobody else gets that."}]}]},{"key":"kit","ask":"Your kit is the playbook's. What one thing do you add?","gate":"plan","options":[{"key":"a","label":"A hooded lantern and two flasks of oil.","sub":"Writes: Gear","effects":[{"set":{"extra":"hooded lantern and 2 flasks of oil"}}],"then":[{"text":"Light you can shut with one thumb."}]},{"key":"b","label":"A grapnel and 30' of cord.","sub":"Writes: Gear","effects":[{"set":{"extra":"grapnel and 30' of cord"}}],"then":[{"text":"For high places, and for leaving them fast."}]},{"key":"c","label":"A short iron bar.","sub":"Writes: Gear","effects":[{"set":{"extra":"short iron bar"}}],"then":[{"text":"For doors that will not listen to reason."}]}]},{"key":"secret5","ask":"Nobody sees you pack. Write one true thing that only you know.","gate":"plan","notes":["facts"],"comment":"dm-asks","options":[{"key":"a","label":"Write what only you know","sub":"Secret fact. Typed.","when":{"flag":"witnessed"},"input":{"field":"secret","prompt":"Nobody sees you pack. Write one true thing that only you know.","max":200}}]},{"key":"go","ask":"Before dawn, you walk out on the Old Road. Do you go?","gate":"exec","comment":"odds-card","options":[{"key":"a","label":"Walk out onto the Old Road.","sub":"Sealed. The book reads your Lens and turns the page.","when":{"tally":"lens","value":"machine","lte":0},"effects":[{"set":{"lens":"Hymn","cassandra":"The hunter in Boar Hollow nailed his map to the wall and never went back for it. He drew one door too few. You were already there, weren't you? You only haven't gone yet."}}]},{"key":"b","label":"Walk out onto the Old Road.","sub":"Sealed. The book reads your Lens and turns the page.","when":{"tally":"lens","value":"hymn","lte":0},"effects":[{"set":{"lens":"Machine","cassandra":"The hunter in Boar Hollow nailed his map to the wall and never went back for it. He drew one door too few. You were already there, weren't you? You only haven't gone yet."}}]},{"key":"c","label":"Walk out onto the Old Road.","sub":"Sealed. The book reads your Lens and turns the page.","when":{"all":[{"tally":"lens","value":"hymn","gte":1},{"tally":"lens","value":"machine","gte":1}]},"effects":[{"set":{"lens":"Both","cassandra":"The hunter in Boar Hollow nailed his map to the wall and never went back for it. He drew one door too few. You were already there, weren't you? You only haven't gone yet."}}]}]}],"route":[{"when":{"tally":"lens","value":"machine","lte":0},"to":"milestone-hymn"},{"when":{"tally":"lens","value":"hymn","lte":0},"to":"milestone-machine"},{"to":"milestone-both"}]}],"endings":{"milestone-hymn":{"title":"The Milestone: Hymn","look":"paint","set":"milestone","beats":[{"text":"Before dawn you walk out on the Old Road. Mist lies on the Fields. The new well is quiet.","kicker":"BEFORE DAWN"},{"text":"The milestone stands where it always has, older than the Fort, cut with numbers nobody reads. It hums. You feel it in your teeth and in the soles of your feet."},{"text":"Cassandra is already there, wrapped in grey, as if she had waited all night. She does not look at the stone. She looks at you, and she says one true thing."},{"text":"“The hunter in Boar Hollow nailed his map to the wall and never went back for it. He drew one door too few. You were already there, weren't you? You only haven't gone yet.”","kicker":"CASSANDRA","comment":"dm-people"},{"text":"You put your palm on the stone. It hums one held note, like a bell that was struck once and left to ring."},{"text":"Behind the Garden of Stone, a chalk arrow waits on the rock, where only you will see it.","when":{"flag":"found"}},{"text":"You think of Wick's three fingers. You were never as quiet as you thought.","when":{"flag":"wick_heard"}},{"text":"The book closes. Your Fort Card holds every choice, and your odds. Two in six is not much. You made plans. Open the card, copy it as text, and bring it to session zero. There you may change any choice.","kicker":"END OF THE BOOK","notes":["card"],"comment":"odds-card"}]},"milestone-machine":{"title":"The Milestone: Machine","look":"paint","set":"milestone","beats":[{"text":"Before dawn you walk out on the Old Road. Mist lies on the Fields. The new well is quiet.","kicker":"BEFORE DAWN"},{"text":"The milestone stands where it always has, older than the Fort, cut with numbers nobody reads. It hums. You feel it in your teeth and in the soles of your feet."},{"text":"Cassandra is already there, wrapped in grey, as if she had waited all night. She does not look at the stone. She looks at you, and she says one true thing."},{"text":"“The hunter in Boar Hollow nailed his map to the wall and never went back for it. He drew one door too few. You were already there, weren't you? You only haven't gone yet.”","kicker":"CASSANDRA","comment":"dm-people"},{"text":"You put your ear to the stone. The hum holds one pitch, and does not waver. Something keeps it steady."},{"text":"Behind the Garden of Stone, a chalk arrow waits on the rock, where only you will see it.","when":{"flag":"found"}},{"text":"You think of Wick's three fingers. You were never as quiet as you thought.","when":{"flag":"wick_heard"}},{"text":"The book closes. Your Fort Card holds every choice, and your odds. Two in six is not much. You made plans. Open the card, copy it as text, and bring it to session zero. There you may change any choice.","kicker":"END OF THE BOOK","notes":["card"],"comment":"odds-card"}]},"milestone-both":{"title":"The Milestone: Both","look":"paint","set":"milestone","beats":[{"text":"Before dawn you walk out on the Old Road. Mist lies on the Fields. The new well is quiet.","kicker":"BEFORE DAWN"},{"text":"The milestone stands where it always has, older than the Fort, cut with numbers nobody reads. It hums. You feel it in your teeth and in the soles of your feet."},{"text":"Cassandra is already there, wrapped in grey, as if she had waited all night. She does not look at the stone. She looks at you, and she says one true thing."},{"text":"“The hunter in Boar Hollow nailed his map to the wall and never went back for it. He drew one door too few. You were already there, weren't you? You only haven't gone yet.”","kicker":"CASSANDRA","comment":"dm-people"},{"text":"You put your palm on the stone, and your ear beside it. The hum holds one pitch, steady as a held breath. You do not say which of your two readings it fits."},{"text":"Behind the Garden of Stone, a chalk arrow waits on the rock, where only you will see it.","when":{"flag":"found"}},{"text":"You think of Wick's three fingers. You were never as quiet as you thought.","when":{"flag":"wick_heard"}},{"text":"The book closes. Your Fort Card holds every choice, and your odds. Two in six is not much. You made plans. Open the card, copy it as text, and bring it to session zero. There you may change any choice.","kicker":"END OF THE BOOK","notes":["card"],"comment":"odds-card"}]}}},"notes":{"odds-printed":{"kind":"dm","term":"The DM tells you the odds","text":"A fair DM tells you the odds when the odds are known. In this book they always are. Every chance is printed before you pick, so you can plan around it. At the table, ask. A good DM will say."},"plans":{"kind":"dm","term":"The DM offers a plan","text":"A good module always has a way that needs no roll. The playbook says: make a plan that still works if the roll fails. Dice are for what you cannot plan. This book offers a plan in every Execution scene."},"turn-clock":{"kind":"rule","term":"The turn","text":"In a dungeon, time runs in turns. One turn is ten minutes. Looking, listening and trying a lock each take one. The margin counts them. Every second turn, the DM checks for wandering monsters. Out in the open, the count stops."},"dm-rolls":{"kind":"dm","term":"The DM rolls when it is uncertain","text":"A DM rolls only when the answer is unknown and failing matters. If a plan is sound and nothing is at risk, the DM just says yes. The book rolls here because the plate might beat you, and you might not get a second try."},"counted":{"kind":"dm","term":"A good plan changes the odds","text":"At the table, a DM may raise your number for a good plan. That is the DM's call, not a rule of the book. Here, if you heard the count, Open Locks rises from 20 % to 40 %. The book shows it as a new option with a new number."},"patient":{"kind":"dm","term":"The DM rewards patience","text":"The playbook says the DM awards 1 Fate for something quiet or patient. Waiting cost two turns and no luck. A DM pays for good plans in points, not dice."},"bonus":{"kind":"rule","term":"A bonus raises the number","text":"A bonus to a percentage raises your number. Quiet Feet takes Move Silently from 25 % to 45 %. When your odds change, the book shows a second option with the new number. Locksmith's Eye adds no number. It buys a true answer."},"sure":{"kind":"dm","term":"The DM asks: are you sure","text":"Before a final act, a good DM asks once: are you sure? This book asks with a seal. Planning is free. Once you break the seal, the choice is made. Here the Fort will either see it or not."},"hidden-roll":{"kind":"dm","term":"The DM rolls Move Silently in secret","text":"Hide in Shadows and Move Silently are rolled by the DM, in secret. If it fails, you still think it worked. This book rolls it in the open. The panel shows it only for teaching. Your table will not."},"secret-roll-later":{"kind":"dm","term":"The DM keeps the result","text":"You thought the walk went well. The DM knew it had not, and kept the result. A fair DM uses such a result later, to tell the truth about the world, never to punish."},"plan-cost":{"kind":"dm","term":"A plan costs time","text":"A plan that cannot fail costs something else. The slow way costs an hour. In a dungeon, an hour is six turns, and three wandering checks. Time is the DM's coin. Spend it on purpose."},"eye-fate":{"kind":"rule","term":"Fate and a limited power","text":"Spend 1 Fate when you use a power with a limit, such as Locksmith's Eye. The power works as written. Then you write part of its effect: one more true thing. The DM tells you if you reach too far."},"odds-card":{"kind":"dm","term":"The odds go on the card","text":"Your card lists your odds: Open Locks, Move Silently, Hear Noise. A DM keeps them in mind for you. Every roll you saw in this book is on the card. They are low. That is why you made plans."},"dm-asks":{"kind":"dm","term":"The DM asks you to say","text":"A DM sometimes asks the player to say what is true. The book does it with a typed line. Whatever you write, the book keeps. It does not judge it."},"dm-writes":{"kind":"dm","term":"The DM writes it down","text":"After play, a DM writes up what happened. The Fort Card does it here. Every choice writes one line on it. Bring the card to the table."},"dm-follows":{"kind":"dm","term":"The DM follows you","text":"Old things show only at the edge. If you read one as machine, a Referee Note may open one step further. If you read it as hymn, the story stays a story. The DM follows your lead and does not push."},"dm-secrets":{"kind":"dm","term":"The DM keeps secrets","text":"A DM knows things you do not. The flap holds them until you ask. The Referee Note under it is what a DM would tell you if you leaned in. Lift it only if you want to."},"dm-hides":{"kind":"dm","term":"The DM hides the result","text":"The result was always on the page. You could not see it until you chose. A DM does this with a screen. The book does it with reveal ink."},"dm-people":{"kind":"dm","term":"The DM plays the people","text":"A DM speaks for everyone but you. The book does it with quoted lines, here for Cassandra. Her words are true, and they ask more than they tell. A live DM answers back. These lines are fixed."},"planning":{"kind":"rule","term":"Planning","text":"Planning is looking, reading, talking and thinking. It takes no dice and no time. You can go back and change a Planning choice. Its option has a dashed edge."},"gate":{"kind":"rule","term":"Planning and Execution","text":"Planning is free: look, read, talk. You can go back. Execution costs time and risks dice, and it cannot be undone. Once you pick, the book seals the page. Think in Planning. Act in Execution."},"under6":{"kind":"rule","term":"X-in-6: roll under","text":"A 2-in-6 chance is one six-sided die. Roll 2 or lower and it works. You roll *under*. Elves hear noise and find secret doors on 2-in-6. A DM uses 1-in-6 to check for wandering monsters."},"percent":{"kind":"rule","term":"Thief skills are percentages","text":"Roll 1d100 and get your number or lower. Open Locks is 20 % at level 2. It needs your tools, and you get one try per lock. Fail, and that lock beats you until you gain a level."},"wander":{"kind":"rule","term":"Wandering monsters","text":"Every second turn the DM rolls 1d6. On a 1, something comes by. It may not want you. The book rolls it against you, in the open. At the table the DM may roll it behind the screen."},"register":{"kind":"rule","term":"Paint and ink","text":"Two looks. Paint is witnessed: the Fort sees it, and it can become a public fact. Ink is unwitnessed: only you know, and it can become a secret fact. The page tells you which."},"lens":{"kind":"rule","term":"The Lens","text":"Old things show at the edge. You read each one as hymn or machine. Neither is wrong. The tally shows how you lean. The Fort Card keeps each reading."},"fate":{"kind":"rule","term":"Fate","text":"Fate is a point you spend when it matters. You start with three. The margin holds six. The DM awards a point for something quiet, patient or generous. Points refill at each Fort Turn and at the start of each session."},"reveal":{"kind":"rule","term":"Reveal ink","text":"Some lines stay hidden until you ask. Tap, or press R, to lift them. AUTO play stops there. The line was always on the page."},"facts":{"kind":"rule","term":"Public and secret facts","text":"A public fact is something the whole Fort knows about you. A secret fact is something only you know. You write each in one sentence. Your DM will use them."},"card":{"kind":"rule","term":"The Fort Card","text":"The card holds what you chose. You carry it to the table. At session zero you may change any choice. The card is yours, and the DM reads it."},"yoc":{"kind":"rule","term":"Year of Change","text":"The Year Between changed you. Your Year of Change is one gift. The numbers here are proposed. The DM confirms them at the table."},"office":{"kind":"rule","term":"Fort Office","text":"Maren gives out four offices. Warden: Walls +1 when you take the Defend directive. Scout: one extra clue per hex. Steward: you see the Fort's tracks first. Lorekeeper: one free hint per puzzle."},"bond":{"kind":"rule","term":"Bond","text":"Your bond is the one person tied to you. If two players name each other, each gets one extra Fate, spent only to help the other. You pick from the people of the Fort."},"thief":{"kind":"lore","term":"The One Who Opens","text":"An elven thief, level 2. You see in the dark. A thief's skills are low at first: one in four, one in five. Your best tool is a plan, not a roll."},"year-between":{"kind":"lore","term":"The Year Between","text":"The year before this one, played with a zine. The Pen passed round: the druid in Spring, you in Summer, the cleric in Autumn. Each season left a tag on the Fort."},"pen":{"kind":"lore","term":"The Pen","text":"Whoever holds the Pen writes the Fort's book for a season and makes one choice for the Fort. You held it in Summer. The whole Fort saw you choose."},"fort-tags":{"kind":"lore","term":"Oath, Want, Enmity","text":"The Year Between leaves a tag on the Fort. An Oath binds someone to the Fort, and is called in once. A Want is a need; unmet, it marks Strain. An Enmity is an enemy. The DM must use them."},"tin-dozen":{"kind":"lore","term":"The Tin Dozen","text":"Twelve deserters in old tin armour. They come up the road for salt and pay in coin that is nearly good. Their sergeant does the talking."},"harrow":{"kind":"lore","term":"Harrow's Wagons","text":"Old Harrow drives the wagons between the coast and the Fort. He buys cockatrice eggs and will not say for whom."},"wick":{"kind":"lore","term":"Wick","text":"Wick is twelve. He lights the Fort's lamps, keeps Biddy, and counts everything he sees."},"biddy":{"kind":"lore","term":"Biddy","text":"Biddy is a cockatrice. As a chick, her cry paralysed the Gorgon Queen where she stood. Wick keeps her now, in the Beast Pen. Everyone keeps clear of her beak."},"cassandra":{"kind":"lore","term":"Cassandra","text":"The seer at the Shrine. What she says is true, but only half of it makes sense at first. Her hints never tell. They ask. She comes and goes unseen."},"road":{"kind":"lore","term":"The Old Road","text":"The road that runs past the Fort, older than the Fort. Its milestone is cut with numbers nobody reads. Travellers say it hums."}},"sets":{"cover":{"kit":"paper","layers":[{"prim":"spread","art":"art/cover-ground.svg"},{"prim":"plate","art":"art/cover-plate.svg","look":"paint","x":0.5,"y":0.32,"w":0.6},{"prim":"vfold","art":"art/cover-spine.svg","x":0.5,"y":0.115,"w":0.72}]},"crack":{"kit":"paper","layers":[{"prim":"spread","art":"art/crack-ground.svg"},{"prim":"tunnel","art":"art/crack-t1.svg","art2":"art/crack-t2.svg","art3":"art/crack-t3.svg","art4":"art/crack-t4.svg","x":0.5,"y":0.27,"w":0.94},{"prim":"flap","art":"art/tag.svg","under":"art/crack-slip.svg","x":0.84,"y":0.14,"w":0.26,"opensOn":"reveal"}]},       if (pi >= picks.length || (opts.upTo != null && pi >= opts.upTo)) break;
      const dot = picks[pi].opt.indexOf(".");
      const gk = picks[pi].opt.slice(0, dot), ok = picks[pi].opt.slice(dot + 1);
      if (v.group.key !== gk) throw new Error(`replay: expected group "${gk}" but the game asks "${v.group.key}"`);
      pi++;
      const r = g.choose(ok);
      if (r.refused) throw new Error(`replay: ${r.refused}`);
    } else if (v.node === "input") g.input(ti < typed.length ? typed[ti++] : "(typed)");
    else g.next();
  }
  return g;
}

// ---- simulate (SPEC section 3, Simulation) ----
function walkConds(pack, fn) {
  const script = pack.script || {};
  const beats = bs => { for (const b of bs || []) if (b.when) fn(b.when); };
  for (const sc of script.scenes || []) {
    beats(sc.beats);
    for (const r of sc.route || []) if (r.when) fn(r.when);
    for (const g of sc.choices || []) for (const o of g.options || []) {
      if (o.when) fn(o.when);
      if (o.lock) fn(o.lock);
      beats(o.then);
      for (const res of Object.values((o.roll && o.roll.results) || {})) beats(res.then);
    }
  }
  for (const e of Object.values(script.endings || {})) beats(e.beats);
}
function collectReads(pack) {
  const reads = { flags: new Set(), fields: new Set(), meters: new Set(), tallies: new Set() };
  const go = c => {
    if (!isObj(c)) return;
    if (has(c, "flag")) reads.flags.add(c.flag);
    else if (has(c, "field")) reads.fields.add(c.field);
    else if (has(c, "meter")) reads.meters.add(c.meter);
    else if (has(c, "tally")) reads.tallies.add(c.tally);
    else if (has(c, "all")) (c.all || []).forEach(go);
    else if (has(c, "any")) (c.any || []).forEach(go);
    else if (has(c, "not")) go(c.not);
  };
  walkConds(pack, go);
  // A group's cost and a roll's add are read too: they decide what can be afforded and which tiers the dice reach.
  const meterIds = new Set(list(pack.meters).map(m => m && m.id));
  for (const sc of (pack.script && pack.script.scenes) || []) for (const g of sc.choices || []) {
    if (g.cost && g.cost.meter) reads.meters.add(g.cost.meter);
    for (const o of g.options || []) {
      const a = o.roll && o.roll.add;
      if (typeof a === "string") (meterIds.has(a) ? reads.meters : reads.fields).add(a);
    }
  }
  return { flags: [...reads.flags].sort(), fields: [...reads.fields].sort(), meters: [...reads.meters].sort(), tallies: [...reads.tallies].sort() };
}

function simulate(pack) {
  const X = index(pack);
  if (!X.scenes.has(pack.start)) throw new Error(`Stage.simulate: start scene "${pack.start}" does not exist`);
  const reads = collectReads(pack);
  const seen = { scenes: new Set(), beats: new Set(), options: new Set(), endings: new Set(), notes: new Set(), locked: new Set() };
  const env = {
    scene: id => seen.scenes.add(id),
    beat: (ref, b) => { seen.beats.add(ref); for (const n of b.notes || []) seen.notes.add(n); if (b.comment) seen.notes.add(b.comment); },
    group: (ref, g) => { for (const n of g.notes || []) seen.notes.add(n); if (g.comment) seen.notes.add(g.comment); },
    pick: ref => seen.options.add(ref),
    locked: ref => seen.locked.add(ref),
    ending: id => seen.endings.add(id),
  };
  // The state key: where we are, plus only the values some condition reads.
  const keyOf = S => {
    let k = `${S.scene || ""}|${S.ending || ""}|${S.node}|${S.cur}|${S.q.join(",")}|`;
    for (const f of reads.flags) k += S.flags[f] ? "1" : "0";
    k += "|";
    for (const f of reads.fields) k += `${S.fields[f]}\u0001`;
    k += "|";
    for (const m of reads.meters) k += `${S.meters[m]},`;
    k += "|";
    for (const t of reads.tallies) { const tt = S.tallies[t] || {}; k += `${Object.keys(tt).sort().map(v => `${v}=${tt[v]}`).join(";")}/`; }
    return k;
  };
  const recs = new Map();
  const mk = S => {
    const key = keyOf(S);
    let r = recs.get(key);
    if (!r) {
      if (recs.size >= MAX_STATES) throw new Error("Stage.simulate: too many states; the story reads too much state to walk");
      r = { key, S, edges: null, color: 0, ways: 0, terminal: false, ending: null, parent: null };
      recs.set(key, r);
    }
    return r;
  };
  const expand = r => {
    const S = r.S;
    r.S = null;
    const edges = [];
    const go = (S2, label) => { settle(S2, X, env); edges.push({ to: mk(S2), label, dead: false }); };
    if (S.node === "ending") { r.terminal = true; r.ending = S.ending == null ? "(dead end)" : S.ending; return edges; }
    if (S.node === "beat" || S.node === "roll" && S.rollRes) { const S2 = cloneS(S); S2.node = null; go(S2, null); }
    else if (S.node === "choice") {
      const { scene, group } = X.groups.get(split(S.cur)[1]);
      for (const { o, locked } of optionStates(S, group)) {
        if (locked) continue;
        const S2 = cloneS(S);
        const why = pick(S2, X, o.key, env);
        if (why) throw new Error(`Stage.simulate: ${scene.id}:${group.key}.${o.key}: ${why}`);
        edges.push({ to: mk(S2), label: { opt: `${group.key}.${o.key}` }, dead: false });
      }
    } else if (S.node === "input") {
      const S2 = cloneS(S);
      const o = X.options.get(split(S.cur)[1]).option;
      S2.fields[o.input.field] = "(typed)";
      S2.node = null;
      go(S2, { input: "(typed)" });
    } else if (S.node === "roll") {
      const oref = split(S.cur)[1];
      const spec = X.options.get(oref).option.roll;
      const add = addValue(S, X, spec.add);
      for (const key of reachableTiers(X.resolver, spec, add)) { // only tiers the dice can reach from this modifier
        const S2 = cloneS(S);
        applyRoll(S2, X, oref, spec, { dice: spec.dice, faces: [], add, total: 0, vs: spec.vs, result: key, used: key });
        S2.node = null;
        go(S2, { result: key });
      }
    }
    return edges;
  };

  const S0 = newState(X, 1);
  enterScene(S0, X, pack.start, env, true);
  settle(S0, X, env);
  const start = mk(S0);
  const post = [];
  let cycles = 0;
  start.color = 1; start.edges = expand(start);
  const stack = [{ r: start, i: 0 }];
  while (stack.length) {
    const top = stack[stack.length - 1], r = top.r;
    if (top.i < r.edges.length) {
      const e = r.edges[top.i++], c = e.to;
      if (c.color === 1) { e.dead = true; cycles++; continue; }
      if (c.color === 0) { c.color = 1; c.edges = expand(c); stack.push({ r: c, i: 0 }); }
    } else { r.color = 2; post.push(r); stack.pop(); }
  }
  // Count paths forward in topological order (reverse post-order).
  start.ways = 1;
  for (let i = post.length - 1; i >= 0; i--) {
    const r = post[i];
    for (const e of r.edges) if (!e.dead) e.to.ways += r.ways;
  }
  const endings = {};
  for (const id of Object.keys(X.endings)) endings[id] = 0;
  let paths = 0;
  for (const r of post) if (r.terminal) { endings[r.ending] = (endings[r.ending] || 0) + r.ways; paths += r.ways; }
  // One shortest route to each terminal state (breadth first).
  const fifo = [start];
  start.parent = false;
  for (let h = 0; h < fifo.length; h++) {
    const r = fifo[h];
    for (const e of r.edges) if (!e.dead && e.to.parent === null) { e.to.parent = { r, label: e.label }; fifo.push(e.to); }
  }
  const routes = [];
  for (const r of post.slice().reverse()) {
    if (!r.terminal) continue;
    const labels = [];
    for (let c = r; c.parent; c = c.parent.r) if (c.parent.label) labels.push(c.parent.label);
    const steps = [];
    let last = null; // the pick a roll belongs to
    for (const l of labels.reverse()) {
      if (l.opt) steps.push(last = { opt: l.opt });
      else if (l.input) steps.push({ input: l.input });
      else if (l.result && last) last.result = l.result;
    }
    routes.push({ ending: r.ending, count: r.ways, steps });
  }

  // What was never reached.
  const by = { scenes: [], beats: [], options: [], endings: [], notes: [] };
  for (const id of X.scenes.keys()) if (!seen.scenes.has(id)) by.scenes.push(id);
  for (const ref of X.beats.keys()) if (!seen.beats.has(ref)) by.beats.push(ref);
  for (const ref of X.options.keys()) if (!seen.options.has(ref)) by.options.push(ref);
  for (const id of Object.keys(X.endings)) if (!seen.endings.has(id)) by.endings.push(id);
  for (const id of Object.keys(pack.notes || {})) if (!seen.notes.has(id)) by.notes.push(id);
  const unreachable = [...by.scenes, ...by.beats, ...by.options, ...by.endings.map(id => `ending:${id}`), ...by.notes.map(id => `note:${id}`)];
  return { paths, endings, routes, unreachable, unreachableBy: by, locked: [...seen.locked].sort(), states: recs.size, cycles };
}

// ---- validate (SPEC section 2) ----
const ID = /^[A-Za-z0-9_-]+$/;
const KINDS = ["rule", "dm", "lore", "handler", "algorithm", "guide"];
const KITS = { paper: ["spread", "vfold", "parallel", "tunnel", "flap", "pulltab", "volvelle", "ticket", "plate"], feed: ["frame", "track", "scan", "log", "redact", "plate"] };
const words = s => String(s).trim().split(/\s+/).filter(Boolean).length;

// check(pack) -> { errors, warnings }. A speaker missing from cast.json is a warning while the pack has no
// cast.json (a script can be finished before its cast art) and an error once it has one.
function check(pack) {
  const errors = [], warnings = [];
  const err = (where, msg) => errors.push(`${where}: ${msg}`);
  const done = () => ({ errors, warnings });
  if (!isObj(pack)) { errors.push("pack: not an object"); return done(); }
  const str = v => typeof v === "string" && v.trim() !== "";
  const num = v => typeof v === "number" && Number.isFinite(v);

  // pack.json
  if (!str(pack.id) || !/^[a-z0-9-]+$/.test(pack.id)) err("pack.json", `id must be lower-kebab-case, not ${JSON.stringify(pack.id)}`);
  if (!str(pack.title)) err("pack.json", "title is missing");
  if (!["paper", "feed"].includes(pack.kit)) err("pack.json", `kit must be "paper" or "feed", not ${JSON.stringify(pack.kit)}`);
  if (!["ose", "fate4df"].includes(pack.resolver)) err("pack.json", `resolver must be "ose" or "fate4df", not ${JSON.stringify(pack.resolver)}`);
  if (!str(pack.storageKey) || !/^(fort-stage|htll)\.[a-z0-9.-]+$/.test(pack.storageKey)) err("pack.json", `storageKey must start with "fort-stage." or "htll.", not ${JSON.stringify(pack.storageKey)}`);
  const meterIds = new Set(), badMeters = new Set(), fieldIds = new Set(), tallyVals = new Map();
  if (!Array.isArray(pack.meters)) err("pack.json", "meters must be a list (it may be empty)");
  for (const m of list(pack.meters)) {
    const w = `pack.json meter ${m && m.id}`;
    if (!isObj(m) || !str(m.id) || !ID.test(m.id)) { err("pack.json", `a meter has a bad id: ${JSON.stringify(m)}`); continue; }
    if (meterIds.has(m.id)) err(w, "duplicate id");
    meterIds.add(m.id);
    if (!str(m.label)) err(w, "label is missing");
    if (!num(m.min) || !num(m.max) || m.min > m.max) err(w, "min and max must be numbers with min <= max");
    else if (!num(m.start) || m.start < m.min || m.start > m.max) err(w, "start must be a number between min and max");
    if (m.bad != null && typeof m.bad !== "boolean") err(w, "bad must be true or false");
    if (m.bad === true) badMeters.add(m.id);
  }
  if (!Array.isArray(pack.fields)) err("pack.json", "fields must be a list (it may be empty)");
  for (const f of list(pack.fields)) {
    if (!isObj(f) || !str(f.id) || !ID.test(f.id)) { err("pack.json", `a field has a bad id: ${JSON.stringify(f)}`); continue; }
    if (fieldIds.has(f.id)) err(`pack.json field ${f.id}`, "duplicate id");
    if (meterIds.has(f.id)) err(`pack.json field ${f.id}`, "a field and a meter share an id");
    fieldIds.add(f.id);
    if (!str(f.label)) err(`pack.json field ${f.id}`, "label is missing");
    if (f.side != null && !["front", "back"].includes(f.side)) err(`pack.json field ${f.id}`, `side must be "front" or "back", not ${JSON.stringify(f.side)}`);
    if (f.hidden != null && typeof f.hidden !== "boolean") err(`pack.json field ${f.id}`, "hidden must be true or false");
  }
  // tallies: a map of tally id to its allowed values. Never a list of ids.
  if (pack.tallies != null) {
    if (!isObj(pack.tallies)) err("pack.json", "tallies must be a map of tally id to its list of allowed values, not a list");
    else for (const [id, vals] of Object.entries(pack.tallies)) {
      if (!ID.test(id)) { err("pack.json", `tally id ${JSON.stringify(id)} is not a plain id`); continue; }
      if (!Array.isArray(vals) || !vals.length || !vals.every(v => str(v) && ID.test(v)) || new Set(vals).size !== vals.length) err("pack.json", `tally "${id}" must be a non-empty list of distinct value names`);
      else tallyVals.set(id, new Set(vals));
    }
  }
  const commentKinds = pack.commentary && Array.isArray(pack.commentary.kinds) ? pack.commentary.kinds : null;
  if (pack.commentary != null) {
    if (!isObj(pack.commentary) || !str(pack.commentary.label)) err("pack.json", "commentary.label is missing");
    if (!commentKinds || commentKinds.some(k => !KINDS.includes(k))) err("pack.json", `commentary.kinds must be a list drawn from ${KINDS.join(", ")}`);
  }

  // notes.json
  const notes = isObj(pack.notes) ? pack.notes : null;
  if (!notes) err("notes.json", "is missing or is not an object");
  for (const [id, n] of Object.entries(notes || {})) {
    const w = `notes.json ${id}`;
    if (!isObj(n)) { err(w, "must be an object"); continue; }
    if (!KINDS.includes(n.kind)) err(w, `kind must be one of ${KINDS.join(", ")}`);
    if (!str(n.term)) err(w, "term is missing");
    if (!str(n.text)) err(w, "text is missing");
    else if (words(n.text) > 60) err(w, `text has ${words(n.text)} words; the limit is 60`);
  }

  // cast.json: a person with no x, y and r has no portrait (the kit draws a placeholder); sheet is needed only if someone has a crop
  const people = pack.cast && isObj(pack.cast.people) ? pack.cast.people : null;
  if (pack.cast) {
    if (!isObj(pack.cast)) err("cast.json", "must be an object");
    else {
      if (!people) err("cast.json", "people is missing");
      let crops = 0;
      for (const [id, p] of Object.entries(people || {})) {
        if (!isObj(p) || !str(p.name)) { err(`cast.json ${id}`, "needs a name"); continue; }
        const given = ["x", "y", "r"].filter(k => p[k] != null);
        if (given.length === 3) { if (["x", "y", "r"].every(k => num(p[k]))) crops++; else err(`cast.json ${id}`, "x, y and r must be numbers"); }
        else if (given.length) err(`cast.json ${id}`, "x, y and r go together: give all three for a portrait, none for a placeholder");
      }
      if (crops) {
        if (!str(pack.cast.sheet)) err("cast.json", "sheet is missing (a person has a portrait crop)");
        if (!num(pack.cast.w) || !num(pack.cast.h)) err("cast.json", "w and h must be numbers (a person has a portrait crop)");
      } else {
        if (pack.cast.sheet != null && !str(pack.cast.sheet)) err("cast.json", "sheet must be a path");
        for (const k of ["w", "h"]) if (pack.cast[k] != null && !num(pack.cast[k])) err("cast.json", `${k} must be a number`);
      }
    }
  }

  // sets.json
  const sets = isObj(pack.sets) ? pack.sets : null;
  if (!sets) err("sets.json", "is missing or is not an object");
  for (const [id, s] of Object.entries(sets || {})) {
    const w = `sets.json ${id}`;
    if (!isObj(s)) { err(w, "must be an object"); continue; }
    if (s.kit !== pack.kit) err(w, `kit "${s.kit}" does not match the pack's kit "${pack.kit}"`);
    if (!Array.isArray(s.layers) || !s.layers.length) { err(w, "layers must be a non-empty list"); continue; }
    s.layers.forEach((l, i) => {
      const lw = `${w} layer ${i}`;
      if (!isObj(l)) return err(lw, "must be an object");
      const prims = KITS[pack.kit];
      if (prims && !prims.includes(l.prim)) err(lw, `prim "${l.prim}" is not a ${pack.kit} primitive (${prims.join(", ")})`);
      if (l.tally != null) {
        if (!tallyVals.has(l.tally)) err(lw, `tally "${l.tally}" is not in pack.tallies`);
        else if (!tallyVals.get(l.tally).has(l.value)) err(lw, `a layer bound to tally "${l.tally}" needs a value from ${[...tallyVals.get(l.tally)].join(", ")}, not ${JSON.stringify(l.value)}`);
      }
      for (const k of ["x", "y", "w", "h"]) if (l[k] != null && !(num(l[k]) && l[k] >= 0 && l[k] <= 1)) err(lw, `${k} must be a fraction from 0 to 1`);
    });
  }

  // script.json
  const script = isObj(pack.script) ? pack.script : null;
  if (!script || !Array.isArray(script.scenes) || !script.scenes.length) { err("script.json", "needs a non-empty scenes list"); return done(); }
  const endings = isObj(script.endings) ? script.endings : {};
  if (!isObj(script.endings) || !Object.keys(endings).length) err("script.json", "needs at least one ending");
  const sceneIds = new Set();
  for (const sc of script.scenes) {
    if (!isObj(sc) || !str(sc.id) || !ID.test(sc.id)) { err("script.json", `a scene has a bad id: ${JSON.stringify(sc && sc.id)}`); continue; }
    if (sceneIds.has(sc.id)) err(`scene ${sc.id}`, "duplicate id");
    sceneIds.add(sc.id);
  }
  if (!sceneIds.has(pack.start)) err("pack.json", `start "${pack.start}" is not a scene`);
  const target = id => sceneIds.has(id) || has(endings, id);

  // The card fields an input writes: no condition may read them, because typed text cannot be explored.
  const inputFields = new Set();
  for (const sc of script.scenes) for (const g of (isObj(sc) && Array.isArray(sc.choices) ? sc.choices : [])) for (const o of (isObj(g) && Array.isArray(g.options) ? g.options : [])) {
    if (isObj(o) && isObj(o.input) && str(o.input.field)) inputFields.add(o.input.field);
  }

  const checkCond = (w, c) => {
    if (!isObj(c)) return err(w, "a condition must be an object");
    const ks = ["flag", "field", "meter", "tally", "all", "any", "not"].filter(k => has(c, k));
    if (ks.length !== 1) return err(w, `a condition needs exactly one of flag, field, meter, tally, all, any, not: ${JSON.stringify(c)}`);
    const k = ks[0];
    if (k === "flag") { if (!str(c.flag)) err(w, "flag must be a name"); }
    else if (k === "field") {
      if (!fieldIds.has(c.field)) err(w, `field "${c.field}" is not in pack.fields`);
      else if (inputFields.has(c.field)) err(w, `a condition reads field "${c.field}", which an input writes; typed text cannot be explored`);
      if (!has(c, "is")) err(w, `field condition "${c.field}" needs "is"`);
    } else if (k === "meter") {
      if (!meterIds.has(c.meter)) err(w, `meter "${c.meter}" is not in pack.meters`);
      if (!has(c, "gte") && !has(c, "lte")) err(w, "meter condition needs gte or lte");
      for (const b of ["gte", "lte"]) if (has(c, b) && !num(c[b])) err(w, `${b} must be a number`);
    } else if (k === "tally") {
      const vals = tallyVals.get(c.tally);
      if (!vals) err(w, `tally "${c.tally}" is not in pack.tallies`);
      const top = has(c, "top"), val = has(c, "value");
      if (top === val) err(w, "a tally condition is either { tally, top } or { tally, value, gte|lte }");
      else if (top) { if (vals && !vals.has(c.top)) err(w, `tally "${c.tally}" has no value "${c.top}" (${[...vals].join(", ")})`); }
      else {
        if (vals && !vals.has(c.value)) err(w, `tally "${c.tally}" has no value "${c.value}" (${[...vals].join(", ")})`);
        if (!has(c, "gte") && !has(c, "lte")) err(w, "a tally count condition needs gte or lte");
        for (const b of ["gte", "lte"]) if (has(c, b) && !num(c[b])) err(w, `${b} must be a number`);
      }
    } else if (k === "all" || k === "any") {
      if (!Array.isArray(c[k]) || !c[k].length) err(w, `${k} must be a non-empty list`);
      else c[k].forEach(x => checkCond(w, x));
    } else checkCond(w, c.not);
  };
  const checkEffects = (w, list) => {
    if (list == null) return;
    if (!Array.isArray(list)) return err(w, "effects must be a list");
    for (const e of list) {
      if (!isObj(e)) { err(w, "an effect must be an object"); continue; }
      const ks = ["flag", "set", "meter", "tally"].filter(k => has(e, k));
      if (ks.length !== 1) { err(w, `an effect needs exactly one of flag, set, meter, tally: ${JSON.stringify(e)}`); continue; }
      if (ks[0] === "flag") { if (!str(e.flag)) err(w, "flag must be a name"); }
      else if (ks[0] === "set") {
        if (!isObj(e.set) || !Object.keys(e.set).length) err(w, "set must be an object of field values");
        else for (const f of Object.keys(e.set)) if (!fieldIds.has(f)) err(w, `set: "${f}" is not in pack.fields`);
      } else if (ks[0] === "meter") {
        if (!meterIds.has(e.meter)) err(w, `meter "${e.meter}" is not in pack.meters`);
        if (!num(e.add)) err(w, "meter effect needs a numeric add");
      } else {
        const vals = tallyVals.get(e.tally);
        if (!vals) err(w, `tally "${e.tally}" is not in pack.tallies`);
        if (!str(e.add)) err(w, "tally effect needs add: a value name");
        else if (vals && !vals.has(e.add)) err(w, `tally "${e.tally}" has no value "${e.add}" (${[...vals].join(", ")})`);
      }
    }
  };
  // notes (chips) and comment, on a beat or a choice group
  const checkNotes = (w, x) => {
    if (x.notes != null) {
      if (!Array.isArray(x.notes)) err(w, "notes must be a list of note ids");
      else for (const n of x.notes) if (!(notes && has(notes, n))) err(w, `note "${n}" is not in notes.json`);
    }
    if (x.comment != null) {

  const text = pending ? "Rolling…" : `${rollLine(info)}: `;
  const html = slideHtml(`<section class="panel roll-panel" data-look="${esc(V.view && V.view.scene ? V.view.scene.look : "")}" aria-label="Roll">
      <div class="tags">${gateTag("exec")}</div>
      <p class="roll-ask">The dice decide${dF ? " (four Fate dice)" : ""}</p>
      <div class="dice" role="img" aria-label="${esc(pending ? "Rolling" : rollWords(info, meterId))}">${dice}${pending ? "" : addHtml}</div>
      <p class="roll-line ${pending ? "pending" : ""}" data-r="${pending ? "" : info.table ? "table" : esc(info.result)}"><span class="rl-t" aria-hidden="true">${esc(text)}</span>${pending ? "" : `<span class="res">${esc(resultOf(info))}</span>`}</p></section>`);
  return el(html);
}

function inputSlide(v) {
  const i = v.input;
  const html = slideHtml(`<section class="panel input-panel" data-look="${esc(v.scene ? v.scene.look : "")}" aria-label="Write">
      <form class="in-form" novalidate>
        <label class="ask" for="inField">${esc(i.prompt)}</label>
        <input class="field" id="inField" type="text" maxlength="${i.max}" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
        <div class="field-meta"><span>Goes on your card: ${esc(fieldLabel(i.field))}</span><span id="inCount">0 / ${i.max}</span></div>
        <div class="row"><button type="submit" class="btn primary">Write it down</button></div>
      </form></section>`);
  return { el: el(html), say: "", focus: "#inField" };
}

function endingSlide(v) {
  const e = v.ending;
  const html = slideHtml(`<section class="panel ending" data-look="${esc(e.look || "")}" data-ending="${esc(e.id != null ? e.id : "")}" aria-label="Ending">
      <div class="tags"><span class="tag">Ending</span>${lookTag(e.look)}</div>
      <h2 class="end-title" tabindex="-1">${esc(e.title)}</h2>
      <p class="fine" style="margin-top:0">Endings found: ${V.found.size} of ${ENDING_IDS.length}</p>
      <div class="row">
        <button type="button" class="btn primary" data-act="again">Play again</button>
        <button type="button" class="btn" data-act="card">Card</button>
        <button type="button" class="btn" data-act="copy">Copy result</button>
        <button type="button" class="btn" data-act="verify">Verify</button>
